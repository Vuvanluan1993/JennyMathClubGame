name: Deploy GitHub Pages

# main chỉ chứa mã nguồn; mỗi lần đẩy vào main, CI dựng bản (tools/build_all.py) rồi đưa cả kho lên Pages.
# Cần một lần: Settings › Pages › Source = GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  dung-ban:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dựng mọi bản sinh ra
        run: python3 tools/build_all.py

      - uses: actions/configure-pages@v5

      - name: Đóng gói trang (có .nojekyll ở gốc)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: dung-ban
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
