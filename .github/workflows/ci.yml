name: Kiểm tra

on:
  pull_request:
  push:
    branches: [main, 'tich-hop/**']   # nhánh tích hợp (Q6): chạy kiểm tra + lưu bản dựng để thầy tải về thử

concurrency:
  group: kiem-tra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4   # Firebase emulator (rules.test.js) cần JDK 21+
        with:
          distribution: temurin
          java-version: 21

      - name: Cài gói Node
        run: npm ci

      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium

      - name: Dựng bản Lớp học ảo
        # P-21: bản dựng của nhánh tích hợp (và PR vào nó) trỏ dự án Firebase THỬ jenny-lop-hoc-ao-thu, có dải "Bản thử";
        # main và PR vào main giữ dự án thật (như deploy.yml, FB_ENV mặc định that). Khối cấu hình: src/lop-hoc-ao/firebase/cau-hinh.json
        env:
          FB_ENV: ${{ (github.ref == 'refs/heads/main' || github.base_ref == 'main') && 'that' || 'thu' }}
        run: npm run build

      - name: Lưu bản dựng (tải về, giải nén, chạy python3 -m http.server ở thư mục đó)
        uses: actions/upload-artifact@v4
        with:
          name: ban-dung
          path: |
            .
            !node_modules/
            !src/
            !tools/
            !docs/
          retention-days: 14

      - name: Chạy bộ kiểm tra
        run: npm test

      - name: Lưu kết quả (.ci)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ket-qua-kiem-tra
          path: .ci/
          if-no-files-found: ignore
