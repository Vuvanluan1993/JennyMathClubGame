     <p class="muted" style="margin:6px 0 0">Số câu làm mỗi ngày (vàng là hôm nay).</p></section>

function seaOne(cv,run0){if(!cv.getContext)return;let ctx;try{ctx=cv.getContext('2d')}catch(e){return}if(!ctx)return;
  const Z=3,W=Math.ceil(cv.width/Z),H=Math.ceil(cv.height/Z),run=run0;
  const dark=document.documentElement.dataset.theme==='dark'||(document.documentElement.dataset.theme!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
  const band=dark?['#123d5c','#0f3550','#0c2d45','#0a263b']:['#9CE0F6','#6FD0F2','#3FC1EC','#1FA9DD'];
  const foam=dark?'#3f7fa6':'#FFFFFF',spark=dark?'#5aa3c9':'#FFFFFF',shade=dark?'#08202f':'#1590C4';
  let seed=11;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  const isl=JSON.parse(cv.dataset.isl||'[]').map(([x,y])=>[Math.round(x/Z),Math.round(y/Z)]);
  const sparks=Array.from({length:Math.round(W*H/180)},()=>({x:rnd()*W,y:rnd()*H,v:.15+rnd()*.25,p:Math.floor(rnd()*8)}));

  const gulls=[{x:rnd()*W,y:6,v:.6},{x:rnd()*W,y:12,v:.45}];
  const rocks=Array.from({length:Math.round(W/70)},(_,i)=>({x:Math.round(30+i*70+rnd()*30),y:Math.round(rnd()<.5?6+rnd()*10:H-14-rnd()*6)}));
  const weeds=Array.from({length:Math.round(W/40)},()=>({x:Math.round(rnd()*W),y:Math.round(H-8-rnd()*10)}));
  const whale={x:Math.round((155+300)/Z),y:H-12},bottle={x:rnd()*W,y:Math.round(H*.8)},boat={x:-30,y:Math.round(H*.86)};
  const blit=(n,x,y)=>ctx.drawImage(pxCanvas(n),Math.round(x),Math.round(y));
  ctx.imageSmoothingEnabled=false;ctx.setTransform(Z,0,0,Z,0,0);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches||cv.dataset.live!=='1';
  let f=0,last=0;
  function frame(ts){if(run!==seaRun||!cv.isConnected)return;
    if(!reduce&&ts-last<125){requestAnimationFrame(frame);return}last=ts;f++;
    // nền: 4 dải nước, chỗ nối có hạt so le
    const bh=H/4;for(let b=0;b<4;b++){ctx.fillStyle=band[b];ctx.fillRect(0,Math.floor(b*bh),W,Math.ceil(bh)+1)}
    for(let b=1;b<4;b++){const y0=Math.floor(b*bh);ctx.fillStyle=band[b-1];for(let x=(f>>2)%4;x<W;x+=4){ctx.fillRect(x,y0,2,1);ctx.fillRect(x+2,y0+1,1,1)}}
    // bóng cá lặn
    ctx.fillStyle=shade;fish.forEach(o=>{o.x+=o.v;if(o.x>W+6)o.x=-6;const y=o.y+Math.round(Math.sin((f+o.x)/9));ctx.fillRect(Math.round(o.x),y,3,1);ctx.fillRect(Math.round(o.x)+1,y-1,1,1);ctx.fillRect(Math.round(o.x)+1,y+1,1,1);ctx.fillRect(Math.round(o.x)-1,y-1,1,3)});
    // rong biển lắc lư
    weeds.forEach(w=>blit('weed',w.x+((f>>2)%2),w.y));
    // sóng lấp lánh trôi
    sparks.forEach(s=>{s.x-=s.v;if(s.x<-4)s.x=W+2;const ph=(f+s.p)%16;if(ph<12){ctx.fillStyle=spark;const x=Math.round(s.x),y=Math.round(s.y);ctx.fillRect(x,y,ph<4||ph>8?2:3,1);if(ph>=4&&ph<=8)ctx.fillRect(x+1,y-1,1,1)}});
    // vòng bọt quanh mỗi đảo
    ctx.fillStyle=foam;isl.forEach(([cx,cy],k)=>{const r=15+((f+k*3)>>2)%2;for(let a=0;a<28;a++){if((a+(f>>1))%3===0)continue;const t=a/28*Math.PI*2;ctx.fillRect(Math.round(cx+Math.cos(t)*(r+3)),Math.round(cy+Math.sin(t)*(r*.55+2)+9),1,1)}});

    rocks.forEach(r=>{blit('rock',r.x,r.y);ctx.fillStyle=foam;const o=(f>>1)%2;ctx.fillRect(r.x-1-o,r.y+3,2,1);ctx.fillRect(r.x+7+o,r.y+3,2,1)});

    const wy=whale.y+((f>>3)%2);blit('whale',whale.x,wy);ctx.fillStyle=foam;ctx.fillRect(whale.x-1,wy+5,18,1);
    const sp=f%24;if(sp<10){const h=Math.min(sp,5);ctx.fillStyle=foam;for(let i=0;i<h;i++)ctx.fillRect(whale.x+7,wy-1-i,1,1);if(sp>=5){ctx.fillRect(whale.x+5,wy-6,1,1);ctx.fillRect(whale.x+9,wy-6,1,1);ctx.fillRect(whale.x+4,wy-4,1,1);ctx.fillRect(whale.x+10,wy-4,1,1)}}
    // chai thư trôi
    bottle.x+=.12;if(bottle.x>W+6)bottle.x=-6;blit('bottle',bottle.x,bottle.y+((f>>2)%2));

    if(!reduce)requestAnimationFrame(frame)}
  requestAnimationFrame(frame)}

function vnRead(n){if(n===0)return'không';const D=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];

  for(const[v,w]of parts){const c=Math.floor(n/v)%1000;if(c||(!started&&false)){s.push((r3(c,started)+(w?' '+w:'')).trim());started=true}else if(started&&v===1e3&&n%1e3){/* bỏ trống hàng nghìn */}}

 place:()=>()=>{const n=R(1000000,9999999),str=String(n);let k;do{k=R(0,5)}while(str[k]==='0');const dg=str[k],v=Number(dg)*10**(6-k);let html='',c=0;sp(n).split('').forEach(ch=>{if(/\d/.test(ch)){html+=c===k?`<u class="hl">${ch}</u>`:ch;c++}else html+=ch});const cands=[v*10,v/10,v*100,Number(dg)].filter(x=>x!==v&&x>=1&&Number.isInteger(x));return CQ(`Giá trị của chữ số được gạch chân trong số <b>${html}</b> là:`,`Giá trị của chữ số ${dg} được gạch chân trong số này là bao nhiêu?`,sp(v),cands.map(sp),`Chữ số ${dg} đứng ở hàng có giá trị ${sp(v)}.`,'Giá trị của chữ số')},

 mixRead:()=>()=>{const w=R(1,9),d=R(2,9),n=R(1,d-1);const good=`${w}|${n}/${d}`;const opts=shuf([good,`${n}|${w}/${d}`,`${w}|${d}/${n}`,`${d}|${n}/${w}`].filter((v,i,s)=>s.indexOf(v)===i));return{type:'opt',cols:2,q:`<b>${NUMW[w]} và ${NUMW[n]} phần ${NUMW[d]}</b> viết là:`,say:`${NUMW[w]} và ${NUMW[n]} phần ${NUMW[d]} viết là hỗn số nào?`,opts:opts.map(v=>{const [a,f]=v.split('|'),[x,y]=f.split('/');return{h:`<span class="mix"><b>${a}</b>${F(x,y)}</span>`,v}}),a:opts.indexOf(good),sol:`Phần nguyên ${w}, phần phân số ${F(n,d)}.`,kind:'Đọc, viết hỗn số'}},

function shapeRows(k,c){const W=k==='rc'?16:12,H=k==='rc'?9:12,R=[];for(let y=0;y<H;y++){let s='';for(let x=0;x<W;x++){let ch='.';
  if(k==='sq'||k==='rc'){ch=(x===0||y===0||x===W-1||y===H-1)?'k':c}
  else if(k==='ci'){const d=Math.hypot(x-5.5,y-5.5);ch=d<=5.9?(d>4.9?'k':c):'.'}
  else{const half=(y+1)*W/(2*H),cx=(W-1)/2;const inn=Math.abs(x-cx)<=half;const edge=inn&&(Math.abs(x-cx)>half-1.2||y===H-1);ch=inn?(edge?'k':c):'.'}
  s+=ch}R.push(s)}return R}

function stopMini(){if(mgLoop){cancelAnimationFrame(mgLoop.raf);clearInterval(mgLoop.tick);mgLoop=null}}
function miniAfterRender(){if(scr.k!=='mini'||scr.end||scr.started)return;scr.started=true;stopMini();const f=document.getElementById('mgf');if(!f)return;sayJ(scr.say);
  const items=[];let last=0,spawnGap=1100;const W=()=>f.clientWidth,H=()=>f.clientHeight,fish=scr.mode==='fish';
  const spawn=()=>{const it=scr._r.item(),el=document.createElement('button');el.type='button';el.className='mgi '+(fish?'fishi':'balloi');el.innerHTML=`<span class="mgt">${it.t}</span>`;const sp=(fish?60:50)+Math.random()*40+(45-scr.t)*1.4;const o={el,ok:it.ok,x:fish?-130:R(10,Math.max(20,W()-120)),y:fish?R(10,Math.max(20,H()-70)):H()+10,v:sp,dead:false};
    el.addEventListener('pointerdown',e=>{e.preventDefault();if(o.dead)return;o.dead=true;if(o.ok){scr.score++;sfx('ok');el.classList.add('pop');document.getElementById('mgs').textContent=scr.score}else{scr.lives--;sfx('bad');el.classList.add('wrong');const l=document.getElementById('mgl');if(l)l.innerHTML=[0,1,2].map(i=>`<span class="${i<scr.lives?'':'lost'}">${spr('heart',18)}</span>`).join('');if(scr.lives<=0)endMini()}setTimeout(()=>el.remove(),300)});
    f.appendChild(el);items.push(o)};
  let prev=performance.now();
  const step=ts=>{if(!mgLoop)return;const dt=Math.min(.05,(ts-prev)/1000);prev=ts;if(ts-last>spawnGap){spawn();last=ts;spawnGap=Math.max(650,spawnGap-12)}
    items.forEach(o=>{if(o.dead&&!o.el.isConnected)return;if(fish)o.x+=o.v*dt;else o.y-=o.v*dt;o.el.style.transform=`translate(${o.x}px,${o.y}px)`;if((fish&&o.x>W()+20)||(!fish&&o.y<-90)){o.dead=true;o.el.remove()}});
    mgLoop.raf=requestAnimationFrame(step)};
  mgLoop={raf:requestAnimationFrame(step),tick:setInterval(()=>{scr.t--;const e=document.getElementById('mgt');if(e)e.textContent=scr.t;if(scr.t<=0)endMini()},1000)}}

function mgBg(f,mode){const Z=4,W=Math.ceil(f.clientWidth/Z),H=Math.ceil(f.clientHeight/Z);const cv=document.createElement('canvas');cv.className='mgbg';cv.width=W;cv.height=H;const x=cv.getContext('2d');x.imageSmoothingEnabled=false;
  const bl=(n,px,py)=>x.drawImage(pxCanvas(n),Math.round(px),Math.round(py));let seed=5;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  if(mode==='fish'){const B=['#9CE0F6','#6FD0F2','#3FC1EC','#1FA9DD','#1590C4'];B.forEach((c,i)=>{x.fillStyle=c;x.fillRect(0,Math.floor(i*H/5),W,Math.ceil(H/5)+1)});
    for(let i=1;i<5;i++){x.fillStyle=B[i-1];const y=Math.floor(i*H/5);for(let k=0;k<W;k+=4){x.fillRect(k,y,2,1)}}
    x.fillStyle='#F6D98B';x.fillRect(0,H-5,W,5);x.fillStyle='#E2B85E';for(let k=0;k<W;k+=3)x.fillRect(k,H-5,1,1);
    for(let i=0;i<W/14;i++)bl('weed',rnd()*W,H-11);for(let i=0;i<W/40;i++)bl('rock',rnd()*W,H-8);
    x.fillStyle='#fff';for(let i=0;i<W*H/220;i++)x.fillRect(Math.floor(rnd()*W),Math.floor(rnd()*(H-8)),2,1)}
  else{const B=['#BDEBFA','#CDF0FB','#DDF5FC','#EAF9FD'];B.forEach((c,i)=>{x.fillStyle=c;x.fillRect(0,Math.floor(i*H/4),W,Math.ceil(H/4)+1)});
    for(let i=0;i<W/30+1;i++)bl('cloud',rnd()*W,rnd()*H*.6);
    x.fillStyle='#2AB563';for(let k=0;k<W;k++){const h=6+Math.round(3*Math.sin(k/9)+2*Math.sin(k/4));x.fillRect(k,H-h,1,h)}x.fillStyle='#1E8A4A';for(let k=0;k<W;k+=5)x.fillRect(k,H-3,2,3)}
  f.appendChild(cv);
  if(mode==='fish'){for(let i=0;i<7;i++){const b=document.createElement('i');b.className='mgbub';b.style.left=(8+rnd()*84)+'%';b.style.animationDelay=(rnd()*4).toFixed(1)+'s';b.style.animationDuration=(3+rnd()*3).toFixed(1)+'s';f.appendChild(b)}
    const boat=document.createElement('div');boat.className='mgboat';boat.innerHTML=spr('boat',56)+`<span class="mgjen">${spr('jenny',30)}</span>`;f.appendChild(boat)}}
function miniAfterRender(){if(scr.k!=='mini'||scr.end||scr.started)return;scr.started=true;stopMini();const f=document.getElementById('mgf');if(!f)return;sayJ(scr.say);mgBg(f,scr.mode);
  const items=[];let last=0,spawnGap=1100,n=0;const W=()=>f.clientWidth,H=()=>f.clientHeight,fish=scr.mode==='fish';
  const FS=['fishO','fishY','fishP','fishG','fish'],BS=['balloon','balloonB','balloonP','balloonG'];
  const spawn=()=>{const it=scr._r.item(),el=document.createElement('button');el.type='button';n++;
    if(fish){el.className='mgi fishi';el.innerHTML=`${spr(FS[n%FS.length],46,'mgsp flip')}<span class="mgt">${it.t}</span>`}
    else{el.className='mgi balloi';el.innerHTML=`${spr(BS[n%BS.length],132,'mgsp')}<span class="mgt">${it.t}</span>`}
    const sp=(fish?55:45)+Math.random()*35+(45-scr.t)*1.3;const o={el,ok:it.ok,x:fish?-140:R(6,Math.max(10,W()-90)),y:fish?R(70,Math.max(80,H()-90)):H()+10,v:sp,dead:false,ph:Math.random()*6};
    el.addEventListener('pointerdown',e=>{e.preventDefault();if(o.dead)return;o.dead=true;
      if(o.ok){scr.score++;sfx('ok');el.classList.add('pop');el.insertAdjacentHTML('beforeend',`<span class="mgfx">${spr('burst',56)}</span>`);document.getElementById('mgs').textContent=scr.score}

      setTimeout(()=>el.remove(),380)});
    f.appendChild(el);items.push(o)};
  let prev=performance.now();
  const step=ts=>{if(!mgLoop)return;const dt=Math.min(.05,(ts-prev)/1000);prev=ts;if(ts-last>spawnGap){spawn();last=ts;spawnGap=Math.max(650,spawnGap-12)}
    items.forEach(o=>{if(!o.el.isConnected)return;if(!o.dead){if(fish)o.x+=o.v*dt;else o.y-=o.v*dt}const bob=fish?Math.round(Math.sin(ts/300+o.ph)*3):Math.round(Math.sin(ts/500+o.ph)*4);
      o.el.style.transform=`translate(${Math.round(fish?o.x:o.x+bob)}px,${Math.round(fish?o.y+bob:o.y)}px)`;if(!o.dead&&((fish&&o.x>W()+20)||(!fish&&o.y<-130))){o.dead=true;o.el.remove()}});
    mgLoop.raf=requestAnimationFrame(step)};
  mgLoop={raf:requestAnimationFrame(step),tick:setInterval(()=>{scr.t--;const e=document.getElementById('mgt');if(e)e.textContent=scr.t;if(scr.t<=0)endMini()},1000)}}
