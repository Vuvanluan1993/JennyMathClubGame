<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lớp học ảo Jenny</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=VT323&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Ứng dụng học: thanh trên cùng dính, nội dung một cột rộng tối đa 1120px, lưới hai cột co thành một cột trên điện thoại */
:root{
 --bg:#eef4f8;--surface:#ffffff;--surface2:#f6f9fb;--ink:#13263a;--muted:#566779;--line:#dbe4ec;
 --sea:#0a7ea4;--sea-ink:#ffffff;--sea-soft:#e0f1f7;--sea-deep:#06587a;
 --sun:#e8960c;--sun-soft:#fff2d9;--sun-ink:#7d4b00;
 --leaf:#22884f;--leaf-soft:#e2f4e9;--coral:#d4492f;--coral-soft:#fde8e3;
 --lock:#e9eef2;--shadow:0 1px 2px rgba(19,38,58,.06),0 4px 14px rgba(19,38,58,.06);
 --f-display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;--f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --acc:var(--sea);--onacc:var(--sea-ink);--accs:var(--sea-soft);--accb:var(--sea);--ok:var(--leaf);--oks:var(--leaf-soft);--okb:var(--leaf);
 --warn:var(--sun-ink);--warns:var(--sun-soft);--warnb:var(--sun);--bad:var(--coral);--bads:var(--coral-soft);
 --card:var(--surface);--quiet:var(--muted);--chip:var(--surface2);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1520;--surface:#122131;--surface2:#172a3d;--ink:#e5eef6;--muted:#97a9bb;--line:#24394d;--sea:#3db5db;--sea-ink:#04202d;--sea-soft:#113548;--sea-deep:#96d8ef;--sun:#ffbd47;--sun-soft:#382a0f;--sun-ink:#ffd48a;--leaf:#5bcf8b;--leaf-soft:#123423;--coral:#ff8a72;--coral-soft:#3b1c16;--lock:#0f1c28;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1520;--surface:#122131;--surface2:#172a3d;--ink:#e5eef6;--muted:#97a9bb;--line:#24394d;--sea:#3db5db;--sea-ink:#04202d;--sea-soft:#113548;--sea-deep:#96d8ef;--sun:#ffbd47;--sun-soft:#382a0f;--sun-ink:#ffd48a;--leaf:#5bcf8b;--leaf-soft:#123423;--coral:#ff8a72;--coral-soft:#3b1c16;--lock:#0f1c28;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:var(--f-body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h2{font-size:20px;font-weight:700}h3{font-size:16px;font-weight:700}
button{font:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* thanh trên */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.appbar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:800;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.who{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px 4px 3px 3px}
.who select{border:0;background:none;padding:6px 4px;font-weight:600;max-width:210px}
.demo{background:var(--sun-soft);color:var(--sun-ink);font-size:13px}
.demo .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:6px}
.demo .btn{background:transparent;border-color:color-mix(in srgb,var(--sun-ink) 35%,transparent);color:var(--sun-ink)}
main{padding-block:20px 48px}
/* thành phần chung */
.grid{display:grid;gap:18px}
.g2{grid-template-columns:minmax(0,1fr) 320px}
@media(max-width:900px){.g2{grid-template-columns:minmax(0,1fr)}}
.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.muted{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:12px;cursor:pointer;font-weight:600;font-size:14.5px;transition:transform .08s,background .15s}
.btn:hover:not(:disabled){background:var(--surface2)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.pri{background:var(--sea);border-color:var(--sea);color:var(--sea-ink)}
.btn.pri:hover:not(:disabled){background:var(--sea-deep);border-color:var(--sea-deep)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#2b1a00}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.lg{padding:13px 22px;font-size:16px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{background:var(--coral-soft);color:var(--coral);border-color:var(--coral)}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--sea) 55%,transparent);outline-offset:2px}
select,input{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--leaf-soft);color:var(--leaf);border-color:transparent}.pill.warn{background:var(--sun-soft);color:var(--sun-ink);border-color:transparent}.pill.bad{background:var(--coral-soft);color:var(--coral);border-color:transparent}.pill.acc{background:var(--sea-soft);color:var(--sea-deep);border-color:transparent}
.tag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:7px}
.tag.free{background:var(--leaf-soft);color:var(--leaf)}.tag.paid{background:var(--sun-soft);color:var(--sun-ink)}
.stars{color:var(--sun);letter-spacing:1px}.stars .off{color:var(--line)}
.big{font-family:var(--f-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.bar{height:10px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sea);border-radius:99px}
.bar.sun i{background:var(--sun)}.bar.leaf i{background:var(--leaf)}
.secthead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.secthead .grow{flex:1}
/* hero học sinh */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px;background:linear-gradient(135deg,var(--sea) 0%,var(--sea-deep) 100%);color:var(--sea-ink);display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-60px;bottom:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h1{font-size:clamp(24px,4vw,32px);font-weight:800}
.hero .sub{opacity:.9;margin-top:2px}
.hero .grow{flex:1;min-width:220px;position:relative;z-index:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:12px;padding:6px 12px;font-weight:600;font-size:14px}
.chip b{font-family:var(--f-display);font-size:18px}
.hero .btn{background:var(--sun);border-color:var(--sun);color:#2b1a00;position:relative;z-index:1}
/* bản đồ đảo */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px;margin-top:14px}
.isl{position:relative;border:1px solid var(--line);border-radius:16px;padding:12px 12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;color:inherit;transition:transform .12s,box-shadow .12s}
.isl:hover:not(.lock){transform:translateY(-2px);box-shadow:var(--shadow)}
.isl .art{border-radius:12px;background:var(--sea-soft);display:grid;place-items:center;height:92px}
.isl .no{position:absolute;top:18px;left:18px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.isl b{font-size:14px;line-height:1.35}
.isl.cur{border-color:var(--sea);box-shadow:0 0 0 3px var(--sea-soft)}
.isl.done .art{background:var(--leaf-soft)}
.isl.lock{cursor:default;background:var(--lock)}
.isl.lock .art{background:transparent;border:1px dashed var(--line)}
.isl .now{position:absolute;top:18px;right:18px}
.paidbox{border:1px solid color-mix(in srgb,var(--sun) 45%,var(--line));background:linear-gradient(180deg,var(--sun-soft),var(--surface) 70%)}
.locknote{background:var(--surface2);border:1px dashed var(--line);border-radius:14px;padding:16px;color:var(--muted);margin-top:12px;display:flex;gap:12px;align-items:flex-start}
.locknote b{color:var(--ink)}
/* thú cưng, huy hiệu */
.pet{font-size:46px;line-height:1}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:600}
.badge i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--leaf-soft);color:var(--leaf)}
.badge.t i{background:var(--sea-soft);color:var(--sea-deep)}
/* trang đảo */
.page{max-width:780px;margin:0 auto}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.lesson{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.lesson .grow{flex:1;min-width:220px}
.lesson h1{font-size:clamp(22px,3.6vw,28px);font-weight:800}
.bigstars{font-size:30px;letter-spacing:4px;color:var(--sun)}.bigstars .off{color:var(--line)}
.tl{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:12px;position:relative}
.tl::before{content:"";position:absolute;left:21px;top:22px;bottom:22px;width:2px;background:var(--line)}
.tl li{position:relative;display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;flex-wrap:wrap}
.tl .n{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--surface2);border:2px solid var(--line);flex:none;margin-left:-1px}
.tl li.done .n{background:var(--leaf);border-color:var(--leaf);color:var(--sea-ink)}
.tl li.next{border-color:var(--sea);box-shadow:0 0 0 3px var(--sea-soft)}
.tl li.next .n{border-color:var(--sea);color:var(--sea-deep)}
.tl li.off{opacity:.6}
.tl .grow{flex:1;min-width:160px}
.tl b{display:block}
/* video */
.player{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.slide{aspect-ratio:16/9;max-width:100%;background:var(--sea-soft);padding:clamp(16px,4vw,36px);display:flex;flex-direction:column;gap:10px;overflow:auto}
.slide h3{font-size:clamp(20px,3.6vw,30px);font-weight:800;color:var(--sea-deep)}
.slide .body{font-size:clamp(15px,2.3vw,20px);line-height:1.55}
.slide .body p{margin:4px 0}
.slide svg{max-width:100%;height:auto}
.pctl{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line);flex-wrap:wrap}
.play{width:46px;height:46px;border-radius:50%;border:0;background:var(--sea);color:var(--sea-ink);cursor:pointer;font-size:17px;display:grid;place-items:center;flex:none}
.prog{display:flex;gap:4px;flex:1;min-width:120px}
.prog i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.prog i.on{background:var(--sea)}
.prog i.okq{background:var(--leaf)}.prog i.badq{background:var(--coral)}
.cap{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-size:15px;line-height:1.55;min-height:52px;display:flex;gap:10px}
/* làm bài */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,30px);box-shadow:var(--shadow)}
.qtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.qbox{font-size:clamp(17px,2.6vw,21px);line-height:1.6;margin:8px 0 18px}
.ansrow{display:flex;gap:10px;flex-wrap:wrap}
.ansrow input{flex:1;min-width:min(240px,100%);font-size:20px;padding:12px 16px;border-radius:14px;border-width:2px;font-variant-numeric:tabular-nums}
.ansrow input:focus{border-color:var(--sea)}
.fb{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;margin-top:6px;line-height:1.55}
.fb .ic{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--sea-ink)}
.fb.ok{background:var(--leaf-soft)}.fb.ok .ic{background:var(--leaf)}
.fb.bad{background:var(--coral-soft)}.fb.bad .ic{background:var(--coral)}
.fb.info{background:var(--sea-soft)}.fb.info .ic{background:var(--sea)}
.sol{margin-top:6px;color:var(--ink);opacity:.85}
.result{text-align:center;padding:12px 0}
.result .bigstars{font-size:46px}
.result .bigstars span{display:inline-block;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.result .bigstars span:nth-child(2){animation-delay:.12s}.result .bigstars span:nth-child(3){animation-delay:.24s}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
/* ví dụ */
.exstep{display:flex;gap:12px;align-items:flex-start;margin:10px 0;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);line-height:1.6}
.exstep .grow{flex:1;min-width:0}
/* Jenny */
.jav{flex:none;border-radius:50%;background:var(--sun-soft);display:grid;place-items:center;overflow:hidden}
/* giáo viên */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .big{display:block;margin-top:4px}
.kpi.alert{border-color:color-mix(in srgb,var(--coral) 45%,var(--line))}
.alertlist{display:grid;gap:8px;margin-top:10px}
.al{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface2);border-left:4px solid var(--sun);flex-wrap:wrap}
.al.bad{border-left-color:var(--coral)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--sea-soft);color:var(--sea-deep);flex:none}
.tablewrap{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
tr:last-child td{border-bottom:0}
.who-cell{display:flex;gap:10px;align-items:center}
.task{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;background:var(--surface2)}
details summary{cursor:pointer;font-weight:700;list-style:none;display:flex;gap:8px;align-items:center}
details summary::-webkit-details-marker{display:none}
.log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;max-height:280px;overflow:auto;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;white-space:pre-wrap}
textarea{width:100%;min-height:140px;font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
/* phụ huynh */
.msg{background:var(--surface2);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:14px 16px;line-height:1.6;max-width:560px}
.msg p{margin:6px 0}
.msg .todo{background:var(--sun-soft);border-radius:10px;padding:8px 10px;color:var(--sun-ink);font-weight:600}
.week{display:flex;gap:8px;align-items:flex-end;height:120px;margin-top:12px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.week div i{display:block;width:100%;max-width:34px;background:var(--sea);border-radius:8px 8px 3px 3px;margin:4px 0}
.week div.today i{background:var(--sun)}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat div{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-weight:800}
/* thông báo */
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,10px);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:14px;font-size:14.5px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:20;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* toán */
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.88em;line-height:1.15;margin:0 2px}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.sys{display:inline-flex;flex-direction:column;vertical-align:middle;border-left:2px solid currentColor;border-radius:10px 0 0 10px;padding-left:8px;margin:2px 4px;line-height:1.6}
sup{font-size:.7em}
@media (max-width:560px){.demo .wrap>span:nth-of-type(2){display:none}.ansrow .btn{flex:1}.seg button{padding:7px 10px}.brand small{display:none}.card{padding:16px}.hero{padding:18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Lớp 6: bản đồ, đảo nhà, nhiệm vụ ===== */
.hasnav main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;gap:4px;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(19,38,58,.06)}
.bnav button{flex:1;max-width:140px;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;padding:6px 4px;border-radius:12px;cursor:pointer}
.bnav button span{font-size:22px;line-height:1}
.bnav button.on{color:var(--sea-deep);background:var(--sea-soft)}
.hero.sm{padding:16px 18px}.hero.sm h1{font-size:24px}.hero.sm .chips{margin-top:8px}.hero.sm .chip{padding:4px 10px}
.alertbar{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid color-mix(in srgb,var(--sun) 50%,var(--line));background:var(--sun-soft);color:var(--sun-ink);border-radius:16px;padding:12px 14px;font:inherit;cursor:pointer;flex-wrap:nowrap}
.alertbar>span{flex:1;min-width:0}
.sea{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,transparent,var(--sea-soft) 30%,var(--sea-soft) 80%,transparent);margin-top:6px}
.seain{position:relative}
.route{position:absolute;inset:0}
.node{position:absolute;width:110px;border:0;background:none;color:inherit;font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;scroll-snap-align:center;padding:0}
.node .ball{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:36px;background:var(--surface);border:3px solid var(--line);box-shadow:var(--shadow);transition:transform .15s}
.node:hover .ball{transform:scale(1.06)}
.node.done .ball{border-color:var(--leaf)}
.node.cur .ball{border-color:var(--sea)}
.node.here .ball{border-color:var(--sun);box-shadow:0 0 0 6px color-mix(in srgb,var(--sun) 30%,transparent);animation:bob 2s ease-in-out infinite}
.node.storm .ball{border-color:var(--coral);background:var(--coral-soft)}
.node.lock .ball{background:var(--lock);opacity:.8;font-size:26px}
.node .lbl{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:12.5px;line-height:1.25;background:var(--surface);border-radius:10px;padding:4px 6px;box-shadow:var(--shadow)}
.node.lock .lbl{color:var(--muted)}
.node .flag{position:absolute;top:-14px;font-size:11px;font-weight:700;background:var(--sun);color:#2b1a00;border-radius:99px;padding:2px 8px;white-space:nowrap}
.node .flag.warn{background:var(--coral);color:#fff}
@keyframes bob{50%{transform:translateY(-5px)}}
.chip2{background:var(--sun-soft);color:var(--sun-ink);border-radius:10px;padding:4px 10px;font-weight:600}
.homeisle{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:18px;margin-top:12px;overflow:hidden;background:linear-gradient(180deg,#bfe6f4 0%,#7cc6e4 60%,#4aa8d0 100%)}
.homeisle .isle{position:absolute;left:8%;right:8%;top:28%;bottom:8%;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 30%,#f7dfa8,#e7c27a 70%,#d9ad60);box-shadow:0 8px 0 rgba(255,255,255,.35)}
.homeisle .deco{position:absolute;transform:translate(-50%,-50%);font-size:clamp(26px,6vw,40px);filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.homeisle .deco.pet{font-size:clamp(30px,7vw,46px)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.shop .item{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:12px 8px;cursor:pointer;font:inherit;color:inherit}
.shop .item .ic{font-size:32px}
.shop .item.own{opacity:.6;cursor:default}
.quests{display:grid;gap:10px;margin-top:10px}
.qrow{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;flex-wrap:wrap}
.qrow .grow{flex:1;min-width:160px}.qrow .bar{margin:6px 0 2px}
.qrow .qic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sun-soft);font-weight:800}
.qrow.ok .qic{background:var(--leaf);color:#fff}
/* ===== Màn chơi toàn màn hình ===== */
.gaming .appbar,.gaming .demo,.gaming .bnav{display:none}
.game{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.game>*{width:100%;max-width:560px;margin-left:auto;margin-right:auto}
.gtop{display:flex;align-items:center;gap:12px;padding:12px 16px 6px}
.gx{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface2);color:var(--muted);font-size:18px;cursor:pointer;flex:none}
.hearts{font-size:20px;color:var(--coral);letter-spacing:2px;flex:none}.hearts .lost{color:var(--line)}
.planks{flex:1;display:flex;gap:4px}
.planks i{flex:1;height:14px;border-radius:4px;background:var(--line)}
.planks i.ok{background:#b07a43}.planks i.bad{background:var(--coral)}.planks i.cur{background:color-mix(in srgb,#b07a43 35%,var(--line))}
.bosshp{flex:1;height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.bosshp i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),#ff9b5e);transition:width .4s}
.combo{text-align:center;font-weight:800;color:var(--sun-ink);font-size:13px;margin-top:2px}
.gmid{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0}
.scene{display:flex;flex-direction:column;align-items:center;gap:2px}
.monster{font-size:clamp(48px,14vw,72px);line-height:1;display:inline-block;animation:bob 2.4s ease-in-out infinite}
.monster.hit{animation:hit .4s}
@keyframes hit{30%{transform:translateX(-8px) rotate(-8deg);filter:brightness(1.6)}60%{transform:translateX(8px) rotate(6deg)}}
.qtxt{font-size:clamp(18px,5vw,23px);line-height:1.5;text-align:center;font-weight:600}
.slotbox{align-self:center;min-width:160px;padding:10px 20px;border-radius:16px;border:3px solid var(--sea);background:var(--surface);font-family:var(--f-display);font-size:34px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:1px}
.slotbox.empty{color:var(--line);border-style:dashed}
.seq{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
.seq .slot{min-width:64px;min-height:44px;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;font-weight:700;padding:4px 8px;background:var(--surface)}
.seq .lt{color:var(--muted)}
.gbot{padding:10px 16px 16px;position:relative}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:clamp(48px,7.5vh,60px);border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--f-display);font-size:26px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.pad button:active{transform:translateY(2px);box-shadow:none}
.pad .del{color:var(--muted);font-size:22px}
.pad .go{background:var(--sea);border-color:var(--sea);color:var(--sea-ink);font-size:18px;box-shadow:0 2px 0 var(--sea-deep)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button,.chips2 button{min-height:58px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:17px;font-weight:600;cursor:pointer;padding:8px;box-shadow:0 2px 0 var(--line)}
.opts button:active,.chips2 button:active{transform:translateY(2px);box-shadow:none}
.opts.two .t{border-color:var(--leaf);color:var(--leaf)}.opts.two .f{border-color:var(--coral);color:var(--coral)}
.chips2{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.chips2 button{min-width:64px;min-height:50px}
.chips2 button.on{border-color:var(--sea);background:var(--sea-soft);color:var(--sea-deep)}
.chips2 button.used{opacity:.3}
.gobtn{width:100%;min-height:54px;border-radius:14px;border:0;background:var(--sea);color:var(--sea-ink);font:inherit;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--sea-deep)}
.gobtn:disabled{opacity:.4}
.gobtn.ghost{background:var(--surface2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.gobtn.sun{background:var(--sun);color:#2b1a00;box-shadow:0 3px 0 var(--sun-ink)}
.nline{position:relative;height:84px;margin:0 20px}
.nline .axis{position:absolute;left:-12px;right:-12px;top:30px;height:4px;border-radius:4px;background:var(--ink)}
.nline button{position:absolute;top:6px;transform:translateX(-50%);width:34px;height:70px;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;color:var(--ink);font:inherit;font-weight:700}
.nline button i{display:block;width:20px;height:20px;margin-top:16px;border-radius:50%;background:var(--surface);border:3px solid var(--ink)}
.nline button:hover i,.nline button:focus-visible i{background:var(--sun)}
.nline button span{margin-top:8px;font-size:15px}
.sheet{border-radius:18px;padding:14px;display:grid;gap:12px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:0}}
.sheet .sh{display:flex;gap:12px;align-items:flex-start;line-height:1.5}
.sheet .ic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:18px}
.sheet.ok{background:var(--leaf-soft)}.sheet.ok .ic{background:var(--leaf)}.sheet.ok b{color:var(--leaf)}
.sheet.warn{background:var(--sun-soft)}.sheet.warn .ic{background:var(--sun)}.sheet.warn b{color:var(--sun-ink)}
.sheet.bad{background:var(--coral-soft)}.sheet.bad .ic{background:var(--coral)}.sheet.bad b{color:var(--coral)}
.sheet.ok .gobtn{background:var(--leaf);box-shadow:0 3px 0 color-mix(in srgb,var(--leaf) 60%,#000)}
.gend{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:24px 16px}
.gend h1{font-size:30px;font-weight:800}
.bigicon{font-size:84px;line-height:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.endstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin:10px 0}
.endstats div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px}
.endstats b{display:block;font-family:var(--f-display);font-size:24px}
.endstats span{font-size:12px;color:var(--muted)}
.earn{font-family:var(--f-display);font-size:24px;font-weight:800;margin:4px 0}
.unlock{background:var(--sea-soft);color:var(--sea-deep);border-radius:12px;padding:8px 12px}
.gendbtn{display:grid;gap:10px;width:100%;margin-top:12px}
@media (max-width:560px){
 .appbar .wrap{gap:8px;padding-block:8px}.brand b{font-size:16px}.brand .jav{width:32px!important;height:32px!important}
 .seg{flex:1 1 100%;order:3}.seg button{flex:1;padding:7px 4px;font-size:13.5px;white-space:nowrap}.who{order:4}
 .who{width:100%}.who select{flex:1;max-width:none}
 .demo .wrap{gap:6px;padding-block:4px;font-size:12px}.demo .wrap>b{display:none}.demo .btn{padding:3px 8px;font-size:12px}
 .hero.sm{padding:14px;gap:12px}.hero.sm h1{font-size:21px}.hero.sm .chip{font-size:13px}.hero.sm .chip b{font-size:15px}
 .alertbar{font-size:13.5px;padding:10px 12px}
}
.medal{font-weight:800;border-radius:99px;padding:4px 12px;margin:2px 0}
.medal.m3{background:var(--sun-soft);color:var(--sun-ink)}.medal.m2{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}.medal.m1{background:var(--coral-soft);color:var(--coral)}
.tl li.help{border:2px dashed var(--sun);background:var(--sun-soft)}
.tl li.help .n{background:var(--sun);border-color:var(--sun)}
.tl li.weak{border-color:color-mix(in srgb,var(--coral) 40%,var(--line))}
.tl li .n{font-size:15px}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mlist li{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 10px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:14px}
.node .wk{font-size:11px;font-weight:700;color:var(--coral)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Phong cách pixel cho học sinh (màu logo Clb) ===== */
body.px{--pxk:#1F2A5A;--f-display:"VT323","Be Vietnam Pro",ui-monospace,monospace;--bg:#EEF2F8;--sea:#0079C1;--sea-deep:#1F2A5A;--sea-soft:#DDF3FB;--leaf:#1E9A52;--leaf-soft:#E3F7EA;--sun:#FCB40C;--sun-soft:#FFF4D6;--sun-ink:#7A4E00;--coral:#E0441A;--coral-soft:#FDE6DE;--line:#C9D1E6;--water:#BDEBFA;--wdot:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body.px{--pxk:#5868B0;--bg:#0b1520;--sea:#3db5db;--sea-deep:#96d8ef;--sea-soft:#113548;--leaf:#5bcf8b;--leaf-soft:#123423;--sun:#ffbd47;--sun-soft:#382a0f;--sun-ink:#ffd48a;--coral:#ff8a72;--coral-soft:#3b1c16;--line:#24394d;--water:#0f3247;--wdot:#2a5f7d}}
:root[data-theme="dark"] body.px{--pxk:#5868B0;--bg:#0b1520;--sea:#3db5db;--sea-deep:#96d8ef;--sea-soft:#113548;--leaf:#5bcf8b;--leaf-soft:#123423;--sun:#ffbd47;--sun-soft:#382a0f;--sun-ink:#ffd48a;--coral:#ff8a72;--coral-soft:#3b1c16;--line:#24394d;--water:#0f3247;--wdot:#2a5f7d}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:inline-block;vertical-align:-.18em}
img.pxe{height:1.15em}
.stars .off img.px,.hearts .lost img.px{filter:grayscale(1);opacity:.35}
body.px h1,body.px h2,body.px h3{font-family:var(--f-display);font-weight:400;letter-spacing:.3px;line-height:1.05}
body.px h2{font-size:28px}body.px h3{font-size:25px}
body.px .hero h1,body.px .hero.sm h1{font-size:clamp(30px,6vw,40px);font-weight:400}
body.px .lesson h1{font-size:clamp(30px,5vw,38px);font-weight:400}
body.px .gend h1{font-size:42px;font-weight:400}
body.px .card,body.px .isl,body.px .sheet,body.px .shop .item{border:3px solid var(--pxk);border-radius:0;box-shadow:0 4px 0 var(--pxk)}
body.px .hero{border-radius:0;background:var(--sea);border:3px solid var(--pxk);box-shadow:0 4px 0 var(--pxk)}
body.px .hero::after{display:none}
body.px .chip,body.px .chip2,body.px .pill{border-radius:0}
body.px .chip b{font-family:var(--f-display);font-size:24px;font-weight:400;line-height:1}
body.px .jav{border-radius:0;background:var(--sun-soft);place-items:end center;border:2px solid var(--pxk)}
body.px .btn,body.px .gobtn,body.px .opts button,body.px .chips2 button,body.px .pad button{border-radius:0;border:3px solid var(--pxk);box-shadow:0 4px 0 var(--pxk)}
body.px .btn.ghost{border-color:transparent;box-shadow:none}
body.px .btn.sm{border-width:2px;box-shadow:0 3px 0 var(--pxk)}
body.px .gobtn{font-family:var(--f-display);font-size:28px;font-weight:400;text-transform:uppercase;letter-spacing:.5px;line-height:1}
body.px .gobtn.ghost{box-shadow:0 4px 0 var(--pxk);border:3px solid var(--pxk)}
body.px .sheet.ok .gobtn{box-shadow:0 4px 0 var(--pxk)}
body.px .btn:active:not(:disabled),body.px .gobtn:active,body.px .opts button:active,body.px .chips2 button:active,body.px .pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pxk)}
body.px .pad button{font-size:34px;font-weight:400}
body.px .pad .go{font-family:var(--f-display);font-size:26px}
body.px .slotbox{border-radius:0;font-weight:400;font-size:46px;line-height:1;border-color:var(--pxk)}
body.px .planks i,body.px .bosshp{border-radius:0}
body.px .planks{gap:3px}body.px .planks i.ok{background:var(--leaf)}
body.px .bosshp{border:2px solid var(--pxk)}body.px .bosshp i{background:var(--coral)}
body.px .sheet .ic{border-radius:0}
body.px .sea{background-color:var(--water);background-image:linear-gradient(90deg,var(--wdot) 0 12px,transparent 12px),linear-gradient(90deg,var(--wdot) 0 6px,transparent 6px);background-size:96px 64px,64px 48px;background-position:20px 18px,52px 40px;background-repeat:repeat;border:3px solid var(--pxk);image-rendering:pixelated}
body.px .node .ball{border-radius:0;border:3px solid var(--pxk);box-shadow:0 4px 0 var(--pxk)}
body.px .node.done .ball{background:var(--leaf-soft)}
body.px .node.here .ball{background:var(--sun-soft);box-shadow:0 4px 0 var(--pxk),0 0 0 6px var(--sun)}
body.px .node .lbl{border-radius:0;border:2px solid var(--pxk);box-shadow:none}
body.px .node .lbl b{font-family:var(--f-display);font-weight:400;font-size:18px;line-height:1}
body.px .node .flag{border-radius:0;font-family:var(--f-display);font-size:17px;font-weight:400;border:2px solid var(--pxk);line-height:1;padding:2px 6px 0}
body.px .isl .art{border-radius:0}
body.px .isl .no{border-radius:0;font-family:var(--f-display);font-weight:400;font-size:20px;border:2px solid var(--pxk)}
body.px .bnav{border-top:3px solid var(--pxk)}
body.px .bnav button{border-radius:0;font-family:var(--f-display);font-size:18px;font-weight:400;line-height:1}
body.px .bnav button.on{background:var(--sun-soft);color:var(--ink);box-shadow:inset 0 -4px 0 var(--sun)}
body.px .homeisle{border-radius:0;border:3px solid var(--pxk);background:var(--water) linear-gradient(90deg,var(--wdot) 0 10px,transparent 10px) 14px 20px/80px 56px}
body.px .homeisle .isle{border-radius:0;background:#F6D98B;box-shadow:none;clip-path:polygon(10% 0,90% 0,90% 10%,96% 10%,96% 22%,100% 22%,100% 78%,96% 78%,96% 90%,90% 90%,90% 100%,10% 100%,10% 90%,4% 90%,4% 78%,0 78%,0 22%,4% 22%,4% 10%,10% 10%)}
body.px .homeisle .deco{filter:none}
body.px .monster.hit{filter:brightness(1.8)}

/* ===== Khung pixel cho toàn bộ ứng dụng: viền 3px khuyết góc + bóng đổ cứng ===== */
body.px{--f3:0 -3px 0 0 var(--pxk),0 3px 0 0 var(--pxk),-3px 0 0 0 var(--pxk),3px 0 0 0 var(--pxk);--f2:0 -2px 0 0 var(--pxk),0 2px 0 0 var(--pxk),-2px 0 0 0 var(--pxk),2px 0 0 0 var(--pxk);--drop:0 8px 0 0 var(--pxk);--drop2:0 6px 0 0 var(--pxk)}
body.px *,body.px *::before,body.px *::after{border-radius:0!important}
body.px :is(.card,.isl,.sheet,.hero,.shop .item,.homeisle,.sea,.paidbox,.player,.qcard,.kpi,.task,.log,.msg,.toast,.alertbar,.unlock,.endstats div,.stat div,.exstep,.locknote,.al,.fb){border:0!important;box-shadow:var(--f3),var(--drop)!important;margin-bottom:8px}
body.px :is(.tl li,.mlist li,.qrow){border:0!important;box-shadow:var(--f2),var(--drop2)!important;margin:2px 2px 8px}
body.px :is(.btn:not(.ghost),.gobtn,.opts button,.chips2 button,.pad button,.nline button,.gx,.seg,.bnav){border:0!important;box-shadow:var(--f3),var(--drop2)!important}
body.px :is(.btn:not(.ghost),.gobtn,.opts button,.chips2 button,.pad button,.gx):active:not(:disabled){transform:translateY(5px);box-shadow:var(--f3),0 1px 0 0 var(--pxk)!important}
body.px .btn.sm:not(.ghost){box-shadow:var(--f2),0 4px 0 0 var(--pxk)!important}
body.px :is(select,input,textarea,.who select){border:0!important;box-shadow:var(--f2)!important;background-color:var(--surface)}
body.px :is(.pill,.tag,.chip,.chip2,.badge,.node .lbl,.node .flag,.isl .no,.jav,.av,.medal,.sheet .ic,.fb .ic,.tl .n,.qrow .qic,.slotbox,.seq .slot,.node .ball,.badge i){border:0!important;box-shadow:var(--f2)!important}
body.px .node .ball{box-shadow:var(--f3),var(--drop2)!important}
body.px .node.here .ball{box-shadow:var(--f3),0 6px 0 0 var(--pxk),0 0 0 9px var(--sun)!important}
body.px .node.storm .ball{box-shadow:var(--f3),0 6px 0 0 var(--pxk),0 0 0 9px var(--coral)!important}
body.px .slotbox{box-shadow:var(--f3)!important}
body.px .slotbox.empty{box-shadow:var(--f3)!important;opacity:.85}
body.px :is(.bar,.bosshp,.prog,.planks i){border:0!important;box-shadow:var(--f2)!important}
body.px .planks{gap:6px;padding:0 2px}
body.px .seg{gap:3px;padding:3px}
body.px .seg button.on{box-shadow:inset 0 -4px 0 var(--sun)}
body.px .isl.cur{background:var(--sun-soft)}
body.px .isl.lock{opacity:.85}
body.px .isl .art{box-shadow:none!important}
body.px .sea{background:#3FC1EC}
.seacv{position:absolute;inset:0;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.seain .route{position:absolute;inset:0}
.seain .node{z-index:1}
body.px .node .ball{width:110px;height:76px;background:none!important;box-shadow:none!important;position:relative;display:block;opacity:1}
body.px .node .ball>img:first-child{position:absolute;left:50%;bottom:0;transform:translateX(-50%);filter:drop-shadow(0 3px 0 rgba(31,42,90,.35))}
body.px .node.lock .ball>img:first-child{opacity:.9}
body.px .node .ball .bdg{position:absolute;left:50%;top:6px;transform:translateX(-50%)}
body.px .node .ball .jen{top:-6px;left:58%}
body.px .node.here .ball,body.px .node.storm .ball{box-shadow:none!important}
body.px .node.here .ball .jen{animation:hop .9s steps(2) infinite}
@keyframes hop{50%{transform:translate(-50%,-5px)}}

<script>
/* ===================== Tiện ích ===================== */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const sup=(b,e)=>`${b}<sup>${e}</sup>`;
const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r};
const roman=n=>{const m=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(const[v,c]of m)while(n>=v){s+=c;n-=v}return s};
const starsHtml=(n,max)=>`<span class="stars" aria-label="${n} trên ${max} sao">${'★'.repeat(n)}<span class="off">${'★'.repeat(Math.max(0,max-n))}</span></span>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SELF_CAP=150;

/* ===================== PHẦN I · SGK Kết nối tri thức 6, Chương I ===================== */
const VENN_SVG=`<svg viewBox="0 0 320 170" width="320" role="img" aria-label="Biểu đồ Venn hai tập hợp"><circle cx="120" cy="88" r="68" fill="var(--acc)" fill-opacity=".12" stroke="var(--acc)" stroke-width="2"/><circle cx="200" cy="88" r="68" fill="var(--ok)" fill-opacity=".12" stroke="var(--ok)" stroke-width="2"/><text x="78" y="30" fill="var(--ink)" font-size="15" font-weight="700">A</text><text x="236" y="30" fill="var(--ink)" font-size="15" font-weight="700">B</text><text x="88" y="93" fill="var(--ink)" font-size="13">chỉ A</text><text x="160" y="93" fill="var(--ink)" font-size="13" text-anchor="middle">cả hai</text><text x="208" y="93" fill="var(--ink)" font-size="13">chỉ B</text></svg>`;
const PEN_SVG=`<svg viewBox="0 0 300 150" width="300" role="img" aria-label="Tập hợp đồ dùng trong hộp bút"><ellipse cx="150" cy="75" rx="140" ry="62" fill="none" stroke="var(--acc)" stroke-width="2.5"/><text x="150" y="20" text-anchor="middle" fill="var(--quiet)" font-size="12">Hộp bút của em</text><circle cx="70" cy="80" r="5" fill="var(--acc)"/><text x="82" y="85" fill="var(--ink)" font-size="15">bút chì</text><circle cx="160" cy="62" r="5" fill="var(--acc)"/><text x="172" y="67" fill="var(--ink)" font-size="15">thước</text><circle cx="160" cy="104" r="5" fill="var(--acc)"/><text x="172" y="109" fill="var(--ink)" font-size="15">tẩy</text></svg>`;

const P1_6=[
 {id:'b1',title:'Bài 1. Tập hợp',video:true,slides:[
  {t:'Bài 1 · Tập hợp',h:'<p>Chào các em! Mình là <b>Jenny</b>.</p><p>Hôm nay chúng ta tìm hiểu: tập hợp là gì, cách viết tập hợp và các kí hiệu ∈, ∉.</p>',say:'Chào các em! Mình là Jenny. Hôm nay chúng ta cùng tìm hiểu tập hợp là gì, cách viết một tập hợp, và hai kí hiệu thuộc, không thuộc.'},
  {t:'Tập hợp là gì?',h:PEN_SVG+'<p>Bút chì, thước, tẩy là các <b>phần tử</b> của tập hợp đồ dùng trong hộp bút.</p>',say:'Tập hợp là một nhóm các đối tượng. Ví dụ, các đồ dùng trong hộp bút của em gồm bút chì, thước và tẩy. Mỗi đồ dùng là một phần tử của tập hợp đó.'},
  {t:'Kí hiệu ∈ và ∉',h:'<p>Đặt tên tập hợp bằng chữ in hoa: <b>A = {1; 2; 3}</b></p><p>2 ∈ A &nbsp;(2 thuộc A)</p><p>5 ∉ A &nbsp;(5 không thuộc A)</p>',say:'Ta đặt tên tập hợp bằng chữ cái in hoa. Ví dụ A là tập hợp gồm một, hai, ba. Số hai là phần tử của A, ta viết hai thuộc A. Số năm không có trong A, ta viết năm không thuộc A.'},
  {t:'Hai cách viết tập hợp',h:'<p><b>Cách 1. Liệt kê:</b> B = {0; 2; 4; 6; 8}</p><p><b>Cách 2. Nêu tính chất đặc trưng:</b><br>B = {x ∈ ℕ | x chẵn, x &lt; 10}</p><p class="muted">Mỗi phần tử chỉ viết một lần, thứ tự tùy ý.</p>',say:'Có hai cách viết một tập hợp. Cách một: liệt kê các phần tử trong dấu ngoặc nhọn, ngăn cách bởi dấu chấm phẩy. Cách hai: nêu tính chất đặc trưng, ví dụ B là tập hợp các số tự nhiên chẵn nhỏ hơn mười. Lưu ý: mỗi phần tử chỉ được viết một lần.'},
  {t:'Tập hợp ℕ và ℕ*',h:'<p>ℕ = {0; 1; 2; 3; …} &nbsp;là tập hợp các số tự nhiên.</p><p>ℕ* = {1; 2; 3; …} &nbsp;là tập hợp các số tự nhiên <b>khác 0</b>.</p>',say:'Tập hợp các số tự nhiên kí hiệu là N, gồm không, một, hai, ba, và cứ thế tiếp tục. N sao là tập hợp các số tự nhiên khác không, bắt đầu từ một.'},
  {t:'Ví dụ',h:'<p>Cho C = {x ∈ ℕ | 3 &lt; x ≤ 9}. Viết C bằng cách liệt kê.</p><p>• “3 &lt; x”: không lấy số 3.<br>• “x ≤ 9”: có lấy số 9.</p><p><b>C = {4; 5; 6; 7; 8; 9}</b>, có 6 phần tử.</p>',say:'Ví dụ: cho C là tập hợp các số tự nhiên x lớn hơn ba và nhỏ hơn hoặc bằng chín. Lớn hơn ba nên không lấy số ba. Nhỏ hơn hoặc bằng chín nên có lấy số chín. Vậy C gồm bốn, năm, sáu, bảy, tám, chín: có sáu phần tử.'},
  {t:'Ghi nhớ',h:'<p>• Tập hợp gồm các phần tử, viết trong { }.</p><p>• a ∈ A: a thuộc A; &nbsp;a ∉ A: a không thuộc A.</p><p>• Hai cách viết: liệt kê hoặc nêu tính chất đặc trưng.</p><p>Vào đảo luyện tập nào! Mỗi màn đạt được <b>1 sao</b>.</p>',say:'Ghi nhớ nhé: tập hợp gồm các phần tử, viết trong dấu ngoặc nhọn. Có hai cách viết: liệt kê, hoặc nêu tính chất đặc trưng. Bây giờ em vào đảo luyện tập nhé. Mỗi màn đạt, em được một ngôi sao.'}],
  gen:[
  ()=>{const a=R(1,9),b=a+R(4,9);return{q:`Cho A = {x ∈ ℕ | ${a} &lt; x ≤ ${b}}. Tập hợp A có bao nhiêu phần tử?`,a:b-a,sol:`A = {${range(a+1,b).join('; ')}}, có ${b-a} phần tử.`}},
  ()=>{const w=pick(['JENNY','HANOI','BANANA','KANGAROO','OLYMPIC','MISSISSIPPI','SAIGON','TOANHOC']),u=[...new Set(w)];return{q:`Gọi M là tập hợp các chữ cái trong từ “${w}”. M có bao nhiêu phần tử?`,a:u.length,sol:`M = {${u.join('; ')}}. Mỗi chữ cái chỉ viết một lần nên M có ${u.length} phần tử.`}},
  ()=>{if(R(0,1)){const d=pick([2,3,5]),a=R(1,20),k=R(10,40),b=a+d*k;return{q:`Tập hợp B = {${a}; ${a+d}; ${a+2*d}; …; ${b}} có bao nhiêu phần tử?`,a:k+1,sol:`Các số cách đều ${d} đơn vị: (${b} − ${a}) : ${d} + 1 = ${k+1} phần tử.`}}const s=R(3,15),L=range(10,99).filter(n=>Math.floor(n/10)+n%10===s);return{q:`Tập hợp các số có hai chữ số mà tổng hai chữ số bằng ${s} có bao nhiêu phần tử?`,a:L.length,sol:`Đó là {${L.join('; ')}}, có ${L.length} phần tử.`}}]},
 {id:'b2',title:'Bài 2. Cách ghi số tự nhiên',slides:[
  {t:'Bài 2 · Cách ghi số tự nhiên',h:'<p>• Hệ thập phân dùng 10 chữ số 0, 1, …, 9. Mỗi hàng gấp 10 lần hàng ngay bên phải.</p><p>• Giá trị của chữ số phụ thuộc vị trí: trong 4 <b>7</b>35, chữ số 7 có giá trị 700.</p>',say:'Trong hệ thập phân, ta dùng mười chữ số từ không đến chín. Giá trị của mỗi chữ số phụ thuộc vào vị trí của nó. Ví dụ trong số bốn nghìn bảy trăm ba mươi lăm, chữ số bảy có giá trị bảy trăm.'},
  {t:'Số La Mã',h:'<p>I = 1, V = 5, X = 10, L = 50, C = 100</p><p>Nhỏ đứng sau lớn thì cộng: VI = 6. Nhỏ đứng trước lớn thì trừ: IV = 4, IX = 9, XL = 40.</p>',say:'Số La Mã dùng các chữ I bằng một, V bằng năm, X bằng mười, L bằng năm mươi, C bằng một trăm. Chữ nhỏ đứng sau chữ lớn thì cộng, chữ nhỏ đứng trước chữ lớn thì trừ.'}],
  gen:[
  ()=>{let n;do{n=R(10000,99999)}while(new Set(String(n)).size<5);const s=String(n),i=R(0,4),d=+s[i],p=4-i,v=d*10**p;return{q:`Trong số ${fmt(n)}, chữ số ${d} có giá trị bằng bao nhiêu?`,a:v,sol:`Chữ số ${d} ở hàng ${['đơn vị','chục','trăm','nghìn','chục nghìn'][p]} nên có giá trị ${fmt(v)}.`}},
  ()=>{const n=R(4,99),r=roman(n);return{q:`Số La Mã <b>${r}</b> có giá trị bằng bao nhiêu?`,a:n,sol:`${r} = ${n}.`}},
  ()=>{if(R(0,1)){const n=R(1000,99999);return{q:`Số ${fmt(n)} có bao nhiêu trăm? (số trăm, không phải chữ số hàng trăm)`,a:Math.floor(n/100),sol:`Bỏ hai chữ số cuối: ${fmt(n)} có ${Math.floor(n/100)} trăm.`}}const d=R(0,9);let best=0;for(let n=9999;n>=1000;n--){const s=String(n);if(new Set(s).size===4&&+s[3]===d){best=n;break}}return{q:`Tìm số lớn nhất có bốn chữ số khác nhau mà chữ số hàng đơn vị là ${d}.`,a:best,sol:`Giữ ${d} ở hàng đơn vị, các hàng còn lại chọn chữ số lớn nhất chưa dùng: ${best}.`}}]},
 {id:'b3',title:'Bài 3. Thứ tự trong tập hợp các số tự nhiên',slides:[
  {t:'Bài 3 · Thứ tự trong ℕ',h:'<p>• Số liền sau của a là a + 1; số liền trước của a (a ≠ 0) là a − 1.</p><p>• a ≤ b nghĩa là a &lt; b hoặc a = b.</p><p>• Từ a đến b có b − a + 1 số tự nhiên.</p>',say:'Số liền sau của a là a cộng một. Số liền trước của a là a trừ một. Kí hiệu nhỏ hơn hoặc bằng nghĩa là nhỏ hơn hoặc bằng nhau. Từ a đến b có b trừ a cộng một số tự nhiên.'}],
  gen:[
  ()=>{const n=R(100,99999);return R(0,1)?{q:`Số liền sau của ${fmt(n)} là số nào?`,a:n+1,sol:`${fmt(n)} + 1 = ${fmt(n+1)}.`}:{q:`Số liền trước của ${fmt(n)} là số nào?`,a:n-1,sol:`${fmt(n)} − 1 = ${fmt(n-1)}.`}},
  ()=>{const a=R(5,60),b=a+R(5,40);return R(0,1)?{q:`Có bao nhiêu số tự nhiên x thỏa mãn ${a} &lt; x &lt; ${b}?`,a:b-a-1,sol:`x chạy từ ${a+1} đến ${b-1}: có ${b-1} − ${a+1} + 1 = ${b-a-1} số.`}:{q:`Có bao nhiêu số tự nhiên x thỏa mãn ${a} ≤ x ≤ ${b}?`,a:b-a+1,sol:`${b} − ${a} + 1 = ${b-a+1} số.`}},
  ()=>{const a=R(10,80),b=a+R(20,90),f=a%2?a:a+1,l=b%2?b:b-1,c=(l-f)/2+1;return{q:`Có bao nhiêu số lẻ x thỏa mãn ${a} ≤ x ≤ ${b}?`,a:c,sol:`Số lẻ đầu là ${f}, cuối là ${l}: (${l} − ${f}) : 2 + 1 = ${c} số.`}}]},
 {id:'b4',title:'Bài 4. Phép cộng và phép trừ số tự nhiên',slides:[
  {t:'Bài 4 · Cộng và trừ',h:'<p>• Giao hoán: a + b = b + a. Kết hợp: (a + b) + c = a + (b + c).</p><p>• x + a = b thì x = b − a; &nbsp;a − x = b thì x = a − b; &nbsp;x − a = b thì x = b + a.</p>',say:'Phép cộng có tính chất giao hoán và kết hợp, giúp ta tính nhanh. Khi tìm x: số hạng chưa biết bằng tổng trừ số hạng đã biết; số trừ bằng số bị trừ trừ hiệu; số bị trừ bằng hiệu cộng số trừ.'}],
  gen:[
  ()=>{const a=R(100,999),b=R(100,999);return R(0,1)?{q:`Tính ${a} + ${b}.`,a:a+b,sol:`${a} + ${b} = ${fmt(a+b)}.`}:{q:`Tính ${Math.max(a,b)} − ${Math.min(a,b)}.`,a:Math.abs(a-b),sol:`${Math.max(a,b)} − ${Math.min(a,b)} = ${Math.abs(a-b)}.`}},
  ()=>{const x=R(20,500),a=R(20,500),t=R(0,2);if(t===0)return{q:`Tìm x, biết x + ${a} = ${x+a}.`,a:x,sol:`x = ${x+a} − ${a} = ${x}.`};if(t===1)return{q:`Tìm x, biết ${x+a} − x = ${a}.`,a:x,sol:`x = ${x+a} − ${a} = ${x}.`};return{q:`Tìm x, biết x − ${a} = ${x}.`,a:x+a,sol:`x = ${x} + ${a} = ${x+a}.`}},
  ()=>{const p=pick([100,200,1000]),a=R(11,p-11),b=p-a,c=R(100,900);return{q:`Tính nhanh: ${a} + ${c} + ${b}.`,a:a+b+c,sol:`(${a} + ${b}) + ${c} = ${p} + ${c} = ${fmt(p+c)}.`}}]},
 {id:'b5',title:'Bài 5. Phép nhân và phép chia số tự nhiên',slides:[
  {t:'Bài 5 · Nhân và chia',h:'<p>• a · (b + c) = a · b + a · c.</p><p>• Chia có dư: a = b · q + r, với 0 ≤ r &lt; b.</p>',say:'Phép nhân phân phối với phép cộng: a nhân tổng b cộng c bằng a nhân b cộng a nhân c. Trong phép chia có dư, số bị chia bằng số chia nhân thương cộng số dư, và số dư luôn nhỏ hơn số chia.'}],

/* ===================== Phân số và kiểm tra đáp án ===================== */
const gcdI=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const rat=(n,d)=>{if(d<0){n=-n;d=-d}const g=gcdI(n,d);return[n/g,d/g]};
const rawfr=(n,d)=>`${n<0?'−':''}<span class="frac"><span>${Math.abs(n)}</span><span>${d}</span></span>`;
const fr=(n,d)=>{[n,d]=rat(n,d);if(d===1)return n<0?`−${-n}`:`${n}`;return`${n<0?'−':''}<span class="frac"><span>${Math.abs(n)}</span><span>${d}</span></span>`};
const frP=(n,d)=>{[n,d]=rat(n,d);return n<0?`(${fr(n,d)})`:fr(n,d)}; // có ngoặc khi âm
const rtxt=(n,d)=>{[n,d]=rat(n,d);return d===1?`${n}`:`${n}/${d}`};
function parseRat(s){s=String(s).replace(/[−–]/g,'-').replace(/\s/g,'').replace(',','.');let m=s.match(/^(-?\d+)\/(-?\d+)$/);if(m){const d=+m[2];if(!d)return null;return rat(+m[1],d)}m=s.match(/^-?\d+(\.\d+)?$/);if(m){const k=(s.split('.')[1]||'').length,p=10**k;return rat(Math.round(+s*p),p)}return null}
function isCorrect(v,q){
  if(q.pair){const m=String(v).replace(/[−–]/g,'-').match(/-?\d+(?:[.,]\d+)?/g);return!!m&&m.length===2&&+m[0].replace(',','.')===q.pair[0]&&+m[1].replace(',','.')===q.pair[1]}
  if(q.frac){const r=parseRat(v);return!!r&&r[0]===rat(...q.frac)[0]&&r[1]===rat(...q.frac)[1]}
  return num(String(v).replace(/[−–]/g,'-'))===q.a;
}
const ansText=q=>q.pair?`(${q.pair[0]}; ${q.pair[1]})`:q.frac?fr(...q.frac):fmt(q.a);
const ansHint=q=>q.pair?'Nhập x; y (ví dụ: 2; -3)':q.frac?'Nhập phân số tối giản, ví dụ -3/4':'Nhập đáp số';
const nz=()=>{let x;do{x=R(-9,9)}while(!x);return x};
/* đa thức: terms = [[hệ số, 'x', bậc x, 'y', bậc y], ...] hiển thị */
function mono(c,vars,first){const sgn=c<0?(first?'−':' − '):(first?'':' + ');const a=Math.abs(c);const v=vars.map(([s,e])=>e===0?'':e===1?s:`${s}<sup>${e}</sup>`).join('');return sgn+(a===1&&v?'':a)+v}
const poly=ts=>ts.filter(t=>t[0]).map((t,i)=>mono(t[0],t[1],i===0)).join('')||'0';

  {t:'Ghi nhớ',h:'<p>• Số hữu tỉ: a/b, b ≠ 0. Tập hợp ℚ.</p><p>• Viết về phân số tối giản, mẫu dương.</p><p>• So sánh: quy đồng mẫu dương, so tử.</p><p class="muted">Nhập phân số dạng −3/4 khi trả lời.</p>',say:'Ghi nhớ: số hữu tỉ viết được dạng a trên b. Luôn rút gọn về phân số tối giản với mẫu dương. So sánh thì quy đồng mẫu dương rồi so tử. Khi trả lời, em nhập phân số dạng âm ba gạch chéo bốn nhé.'}],
  gen:[
  ()=>{let [a,b]=rat(nz(),R(2,9));const k=R(2,4);if(R(0,1))return{q:`Rút gọn phân số ${rawfr(a*k,b*k)} về phân số tối giản.`,frac:[a,b],sol:`Chia cả tử và mẫu cho ${k}${gcdI(a,b)>1?'…':''}: ${fr(a,b)}.`};return{q:`Số đối của ${fr(a,b)} là số nào?`,frac:[-a,b],sol:`Số đối của ${fr(a,b)} là ${fr(-a,b)}.`}},
  ()=>{const d=pick([2,4,5,8,10,20,25]),n=nz()*R(1,9);const [p,q]=rat(n,d);const dec=(n/d).toString().replace('.',',');return{q:`Viết số thập phân <b>${dec.replace('-','−')}</b> dưới dạng phân số tối giản.`,frac:[p,q],sol:`${dec.replace('-','−')} = ${fr(p,q)}.`}},
  ()=>{const b=R(2,6),a=R(1,4)*b+R(1,b-1);const c=R(2,6),dd=R(1,4)*c+R(1,c-1);const L=[];for(let x=-30;x<=30;x++)if(x*b>-a&&x*c<dd)L.push(x);return{q:`Có bao nhiêu số nguyên x thỏa mãn ${fr(-a,b)} &lt; x &lt; ${fr(dd,c)}?`,a:L.length,sol:`${fr(-a,b)} ≈ ${(-a/b).toFixed(2).replace('.',',')}, ${fr(dd,c)} ≈ ${(dd/c).toFixed(2).replace('.',',')}. Các số nguyên: ${L.join('; ')} → ${L.length} số.`}}]},
 {id:'g7b2',title:'Bài 2. Cộng, trừ, nhân, chia số hữu tỉ',video:true,slides:[
  {t:'Bài 2 · Cộng, trừ số hữu tỉ',h:`<p>Viết về hai phân số cùng mẫu dương rồi cộng (trừ) tử.</p><p>${fr(1,3)} + ${frP(-3,4)} = ${fr(4,12)} + ${frP(-9,12)} = ${fr(-5,12)}</p>`,say:'Muốn cộng hay trừ hai số hữu tỉ, ta viết chúng thành hai phân số cùng mẫu dương rồi cộng hoặc trừ tử số. Ví dụ một phần ba cộng âm ba phần tư bằng bốn phần mười hai cộng âm chín phần mười hai, bằng âm năm phần mười hai.'},
  {t:'Nhân, chia số hữu tỉ',h:`<p>Nhân: tử nhân tử, mẫu nhân mẫu.</p><p>${fr(-2,3)} · ${fr(9,4)} = ${fr(-18,12)} = ${fr(-3,2)}</p><p>Chia: nhân với số nghịch đảo. &nbsp;${fr(3,5)} : ${frP(-6,7)} = ${fr(3,5)} · ${frP(-7,6)} = ${fr(-7,10)}</p>`,say:'Nhân hai số hữu tỉ: tử nhân tử, mẫu nhân mẫu, rồi rút gọn. Chia cho một số thì nhân với số nghịch đảo của nó. Ví dụ ba phần năm chia âm sáu phần bảy bằng ba phần năm nhân âm bảy phần sáu, bằng âm bảy phần mười.'},
  {t:'Quy tắc dấu',h:'<p>(+) · (+) = (+) &nbsp;&nbsp; (−) · (−) = (+)</p><p>(+) · (−) = (−) &nbsp;&nbsp; (−) · (+) = (−)</p><p>Chia cũng theo quy tắc dấu như nhân.</p>',say:'Quy tắc dấu: hai số cùng dấu nhân với nhau được số dương. Hai số khác dấu nhân với nhau được số âm. Phép chia cũng theo quy tắc dấu như phép nhân.'},
  {t:'Tìm x',h:`<p>x + ${fr(1,2)} = ${fr(5,6)} &nbsp; → &nbsp; x = ${fr(5,6)} − ${fr(1,2)} = ${fr(5,6)} − ${fr(3,6)} = ${fr(1,3)}</p><p>${fr(2,3)} · x = ${fr(4,9)} &nbsp; → &nbsp; x = ${fr(4,9)} : ${fr(2,3)} = ${fr(2,3)}</p>`,say:'Tìm x: nếu x cộng một phần hai bằng năm phần sáu, thì x bằng năm phần sáu trừ một phần hai, bằng một phần ba. Nếu hai phần ba nhân x bằng bốn phần chín, thì x bằng bốn phần chín chia hai phần ba, bằng hai phần ba.'},
  {t:'Ghi nhớ',h:'<p>• Cộng, trừ: quy đồng mẫu dương.</p><p>• Nhân: tử · tử, mẫu · mẫu. Chia: nhân nghịch đảo.</p><p>• Luôn rút gọn kết quả.</p>',say:'Ghi nhớ: cộng trừ thì quy đồng mẫu dương. Nhân thì tử nhân tử, mẫu nhân mẫu. Chia thì nhân với nghịch đảo. Và luôn rút gọn kết quả. Vào đảo nào!'}],
  gen:[
  ()=>{const a=nz(),b=R(2,9),c=nz(),d=R(2,9),s=R(0,1)?1:-1;const [n,m]=rat(a*d+s*c*b,b*d);return{q:`Tính ${fr(a,b)} ${s>0?'+':'−'} ${frP(c,d)}.`,frac:[n,m],sol:`Quy đồng mẫu ${b*d}: ${rawfr(a*d,b*d)} ${s>0?'+':'−'} ${c*b<0?'('+rawfr(c*b,b*d)+')':rawfr(c*b,b*d)} = ${fr(n,m)}.`}},
  ()=>{const a=nz(),b=R(2,9),c=nz(),d=R(2,9);if(R(0,1)){return{q:`Tính ${fr(a,b)} · ${frP(c,d)}.`,frac:[a*c,b*d],sol:`Tử nhân tử, mẫu nhân mẫu: ${fr(a*c,b*d)}.`}}return{q:`Tính ${fr(a,b)} : ${frP(c,d)}.`,frac:[a*d,b*c],sol:`Nhân với nghịch đảo ${frP(d,c)}: ${fr(a*d,b*c)}.`}},
  ()=>{const xn=nz(),xd=R(2,6),an=nz(),ad=R(2,6);if(R(0,1)){const [bn,bd]=rat(xn*ad+an*xd,xd*ad);return{q:`Tìm x, biết x + ${frP(an,ad)} = ${fr(bn,bd)}.`,frac:[xn,xd],sol:`x = ${fr(bn,bd)} − ${frP(an,ad)} = ${fr(xn,xd)}.`}}const [pn,pd]=rat(an*xn,ad*xd);return{q:`Tìm x, biết ${fr(an,ad)} · x = ${fr(pn,pd)}.`,frac:[xn,xd],sol:`x = ${fr(pn,pd)} : ${frP(an,ad)} = ${fr(xn,xd)}.`}}]},
 {id:'g7b3',title:'Bài 3. Lũy thừa với số mũ tự nhiên của một số hữu tỉ',video:true,slides:[

  {t:'Lũy thừa của một thương',h:`<p>(<span class="frac"><span>a</span><span>b</span></span>)<sup>n</sup> = <span class="frac"><span>a<sup>n</sup></span><span>b<sup>n</sup></span></span></p><p>(${fr(-1,2)})<sup>3</sup> = ${fr(-1,8)} &nbsp;&nbsp; (${fr(-1,2)})<sup>4</sup> = ${fr(1,16)}</p><p class="muted">Số âm mũ lẻ thì âm, mũ chẵn thì dương.</p>`,say:'Lũy thừa của một phân số bằng lũy thừa của tử chia lũy thừa của mẫu. Chú ý dấu: số âm với số mũ lẻ thì kết quả âm, với số mũ chẵn thì kết quả dương. Âm một phần hai mũ ba bằng âm một phần tám, mũ bốn bằng một phần mười sáu.'},
  {t:'Nhân, chia lũy thừa cùng cơ số',h:'<p>x<sup>m</sup> · x<sup>n</sup> = x<sup>m + n</sup></p><p>x<sup>m</sup> : x<sup>n</sup> = x<sup>m − n</sup> &nbsp;(x ≠ 0, m ≥ n)</p><p>(x<sup>m</sup>)<sup>n</sup> = x<sup>m · n</sup></p>',say:'Nhân hai lũy thừa cùng cơ số thì cộng số mũ. Chia thì trừ số mũ. Lũy thừa của lũy thừa thì nhân hai số mũ với nhau.'},
  {t:'Ví dụ',h:`<p>(${fr(-2,3)})<sup>5</sup> : (${fr(-2,3)})<sup>3</sup> = (${fr(-2,3)})<sup>2</sup> = ${fr(4,9)}</p><p>Tìm x: (${fr(1,2)})<sup>x</sup> = ${fr(1,32)} → 32 = 2<sup>5</sup> nên x = 5.</p>`,say:'Ví dụ: âm hai phần ba mũ năm chia âm hai phần ba mũ ba bằng âm hai phần ba bình phương, bằng bốn phần chín. Tìm x biết một phần hai mũ x bằng một phần ba mươi hai: vì ba mươi hai bằng hai mũ năm nên x bằng năm.'},
  {t:'Ghi nhớ',h:'<p>• (a/b)<sup>n</sup> = a<sup>n</sup>/b<sup>n</sup>; chú ý dấu khi a âm.</p><p>• Cùng cơ số: nhân cộng mũ, chia trừ mũ.</p><p>• (x<sup>m</sup>)<sup>n</sup> = x<sup>mn</sup>.</p>',say:'Ghi nhớ: lũy thừa của phân số bằng lũy thừa tử chia lũy thừa mẫu, chú ý dấu. Cùng cơ số: nhân thì cộng mũ, chia thì trừ mũ. Lũy thừa của lũy thừa thì nhân mũ. Chúc các em luyện tập vui!'}],
  gen:[

  ()=>{const a=pick([-3,-2,2,3,5]),b=pick([2,3,4,7]),m=R(2,9),n=R(2,9),t=R(0,2);const base=`(${fr(a,b)})`;if(t===0)return{q:`${base}<sup>${m}</sup> · ${base}<sup>${n}</sup> = ${base}<sup>?</sup>. Số mũ bằng bao nhiêu?`,a:m+n,sol:`Cộng số mũ: ${m} + ${n} = ${m+n}.`};if(t===1)return{q:`${base}<sup>${m+n}</sup> : ${base}<sup>${n}</sup> = ${base}<sup>?</sup>. Số mũ bằng bao nhiêu?`,a:m,sol:`Trừ số mũ: ${m+n} − ${n} = ${m}.`};return{q:`[${base}<sup>${m}</sup>]<sup>${n}</sup> = ${base}<sup>?</sup>. Số mũ bằng bao nhiêu?`,a:m*n,sol:`Nhân số mũ: ${m} · ${n} = ${m*n}.`}},
  ()=>{const b=pick([2,3,5]),x=R(2,b===2?7:4),neg=R(0,1)&&x%2===0;const base=neg?fr(-1,b):fr(1,b);return{q:`Tìm số tự nhiên x, biết (${base})<sup>x</sup> = ${fr(1,b**x)}.`,a:x,sol:`${b**x} = ${b}<sup>${x}</sup> nên x = ${x}${neg?' (x chẵn nên kết quả dương)':''}.`}}]}

/* ===================== Lớp 8 · Chương I Đa thức ===================== */
const P1_8=[
 {id:'g8b1',title:'Bài 1. Đơn thức',video:true,slides:[
  {t:'Bài 1 · Đơn thức',h:'<p>Đơn thức là biểu thức đại số chỉ gồm <b>một số</b>, <b>một biến</b>, hoặc <b>một tích</b> giữa các số và các biến.</p><p>Ví dụ: 5; &nbsp;x; &nbsp;−3x<sup>2</sup>y; &nbsp;<span class="frac"><span>1</span><span>2</span></span>xy<sup>3</sup>z.</p><p class="muted">x + y không phải đơn thức (có phép cộng).</p>',say:'Chào các em lớp tám! Đơn thức là biểu thức đại số chỉ gồm một số, một biến, hoặc một tích giữa các số và các biến. Ví dụ năm, x, âm ba x bình phương y. Còn x cộng y không phải đơn thức vì có phép cộng.'},
  {t:'Đơn thức thu gọn',h:'<p>Thu gọn: nhân các số với nhau, nhân các lũy thừa cùng biến.</p><p>2x<sup>2</sup>y · (−3xy<sup>3</sup>) = <b>−6x<sup>3</sup>y<sup>4</sup></b></p><p>Hệ số: −6. &nbsp;Phần biến: x<sup>3</sup>y<sup>4</sup>.</p>',say:'Muốn thu gọn đơn thức, ta nhân các số với nhau và nhân các lũy thừa của cùng một biến. Hai x bình phương y nhân âm ba x y mũ ba bằng âm sáu x mũ ba y mũ bốn. Hệ số là âm sáu, phần biến là x mũ ba y mũ bốn.'},
  {t:'Bậc của đơn thức',h:'<p>Bậc = tổng số mũ của tất cả các biến (đơn thức thu gọn, hệ số khác 0).</p><p>−6x<sup>3</sup>y<sup>4</sup> có bậc 3 + 4 = <b>7</b>.</p><p>Số khác 0 là đơn thức bậc 0.</p>',say:'Bậc của đơn thức thu gọn có hệ số khác không là tổng số mũ của tất cả các biến. Âm sáu x mũ ba y mũ bốn có bậc bảy. Một số khác không là đơn thức bậc không.'},
  {t:'Đơn thức đồng dạng',h:'<p>Đồng dạng: hệ số khác 0 và <b>cùng phần biến</b>.</p><p>Cộng, trừ đơn thức đồng dạng: cộng, trừ hệ số, giữ phần biến.</p><p>3xy<sup>2</sup> + 5xy<sup>2</sup> − 2xy<sup>2</sup> = <b>6xy<sup>2</sup></b></p>',say:'Hai đơn thức đồng dạng là hai đơn thức có hệ số khác không và có cùng phần biến. Để cộng trừ các đơn thức đồng dạng, ta cộng trừ các hệ số và giữ nguyên phần biến. Ba x y bình phương cộng năm x y bình phương trừ hai x y bình phương bằng sáu x y bình phương.'},
  {t:'Ghi nhớ',h:'<p>• Thu gọn trước, rồi mới tìm hệ số và bậc.</p><p>• Bậc = tổng số mũ các biến.</p><p>• Đồng dạng: cùng phần biến; cộng hệ số.</p>',say:'Ghi nhớ: luôn thu gọn đơn thức trước rồi mới tìm hệ số và bậc. Bậc là tổng số mũ các biến. Các đơn thức đồng dạng có cùng phần biến, khi cộng thì cộng hệ số. Vào đảo nào!'}],
  gen:[
  ()=>{const k=nz(),a=R(1,5),b=R(0,4),c=R(0,3);return{q:`Bậc của đơn thức ${mono(k,[['x',a],['y',b],['z',c]],true)} là bao nhiêu?`,a:a+b+c,sol:`Tổng số mũ các biến: ${a} + ${b} + ${c} = ${a+b+c}.`}},
  ()=>{const p=nz(),q=nz(),a=R(1,4),b=R(1,3),c=R(1,3),d=R(1,4);return{q:`Thu gọn (${mono(p,[['x',a],['y',b]],true)}) · (${mono(q,[['x',c],['y',d]],true)}). Hệ số của đơn thức thu được là bao nhiêu?`,a:p*q,sol:`= ${mono(p*q,[['x',a+c],['y',b+d]],true)}, hệ số ${p*q}.`}},
  ()=>{if(R(0,1)){const cs=[nz(),nz(),nz()],s=cs.reduce((x,y)=>x+y,0);return{q:`${cs.map((c,i)=>mono(c,[['x',1],['y',2]],i===0)).join('')} = ?·xy<sup>2</sup>. Hệ số bằng bao nhiêu?`,a:s,sol:`Cộng các hệ số: ${cs.join(' + ').replace(/\+ -/g,'− ')} = ${s}.`}}const k=nz(),a=R(1,3),b=R(1,2),x=pick([-2,-1,1,2,3]),y=pick([-2,-1,1,2]);return{q:`Tính giá trị của đơn thức ${mono(k,[['x',a],['y',b]],true)} tại x = ${x}, y = ${y}.`,a:k*x**a*y**b,sol:`${k} · (${x})<sup>${a}</sup> · (${y})<sup>${b}</sup> = ${k*x**a*y**b}.`}}]},
 {id:'g8b2',title:'Bài 2. Đa thức',video:true,slides:[
  {t:'Bài 2 · Đa thức',h:'<p>Đa thức là một <b>tổng</b> của những đơn thức. Mỗi đơn thức là một <b>hạng tử</b>.</p><p>P = 3x<sup>2</sup>y − 2xy + 5 có ba hạng tử.</p><p class="muted">Mỗi đơn thức cũng là một đa thức.</p>',say:'Chào các em! Đa thức là một tổng của những đơn thức. Mỗi đơn thức trong tổng gọi là một hạng tử. Ví dụ P bằng ba x bình phương y trừ hai x y cộng năm có ba hạng tử.'},
  {t:'Thu gọn đa thức',h:'<p>Gộp các hạng tử đồng dạng.</p><p>Q = 4x<sup>2</sup> − 3xy + x<sup>2</sup> + 5xy − 7</p><p>&nbsp;&nbsp;= <b>5x<sup>2</sup> + 2xy − 7</b></p>',say:'Thu gọn đa thức là gộp các hạng tử đồng dạng với nhau. Bốn x bình phương cộng x bình phương được năm x bình phương. Âm ba x y cộng năm x y được hai x y. Kết quả là năm x bình phương cộng hai x y trừ bảy.'},
  {t:'Bậc của đa thức',h:'<p>Bậc của đa thức = bậc cao nhất của hạng tử trong dạng <b>thu gọn</b>.</p><p>5x<sup>2</sup> + 2xy<sup>3</sup> − 7 &nbsp;có các bậc 2, 4, 0 → bậc <b>4</b>.</p>',say:'Bậc của đa thức là bậc của hạng tử có bậc cao nhất, trong dạng thu gọn. Ví dụ năm x bình phương cộng hai x y mũ ba trừ bảy có các hạng tử bậc hai, bốn và không, nên đa thức có bậc bốn.'},
  {t:'Giá trị của đa thức',h:'<p>Thay giá trị của biến rồi tính.</p><p>P = x<sup>2</sup> − 3xy + 2 tại x = 2, y = −1:</p><p>P = 4 − 3 · 2 · (−1) + 2 = 4 + 6 + 2 = <b>12</b></p>',say:'Muốn tính giá trị của đa thức, ta thay giá trị của các biến vào rồi thực hiện phép tính. Ví dụ P tại x bằng hai, y bằng âm một: bốn trừ ba nhân hai nhân âm một cộng hai, bằng mười hai. Cẩn thận với dấu trừ nhé.'},
  {t:'Ghi nhớ',h:'<p>• Đa thức = tổng các đơn thức (hạng tử).</p><p>• Thu gọn trước khi tìm bậc.</p><p>• Tính giá trị: thay số, đặt số âm trong ngoặc.</p>',say:'Ghi nhớ: đa thức là tổng các đơn thức. Luôn thu gọn trước khi tìm bậc. Khi tính giá trị, đặt số âm trong ngoặc để không nhầm dấu. Vào đảo thôi!'}],
  gen:[
  ()=>{const t=[[nz(),[['x',R(2,4)],['y',R(0,3)]]],[nz(),[['x',R(0,1)],['y',R(1,4)]]],[nz(),[['x',0],['y',0]]]];const deg=Math.max(...t.map(([_,v])=>v[0][1]+v[1][1]));return{q:`Đa thức ${poly(t)} có bậc bao nhiêu?`,a:deg,sol:`Bậc các hạng tử: ${t.map(([_,v])=>v[0][1]+v[1][1]).join(', ')}. Bậc cao nhất là ${deg}.`}},
  ()=>{const a=nz(),b=nz(),c=nz(),d=nz();const t=[[a,[['x',2],['y',1]]],[c,[['x',1],['y',1]]],[b,[['x',2],['y',1]]],[d,[['x',1],['y',1]]]];return{q:`Thu gọn ${poly(t)}. Hệ số của x<sup>2</sup>y là bao nhiêu?`,a:a+b,sol:`Gộp hạng tử đồng dạng: (${a}) + (${b}) = ${a+b}. Đa thức thu gọn: ${poly([[a+b,[['x',2],['y',1]]],[c+d,[['x',1],['y',1]]]])}.`}},
  ()=>{const a=nz(),b=nz(),c=R(-9,9),x=pick([-2,-1,1,2,3]),y=pick([-2,-1,1,2]);const v=a*x*x+b*x*y+c;return{q:`Tính giá trị của P = ${poly([[a,[['x',2]]],[b,[['x',1],['y',1]]],[c,[]]])} tại x = ${x}, y = ${y}.`,a:v,sol:`P = ${a} · (${x})<sup>2</sup> + ${b} · (${x}) · (${y}) + (${c}) = ${a*x*x} + ${b*x*y} + ${c} = ${v}.`}}]},
 {id:'g8b3',title:'Bài 3. Phép cộng và phép trừ đa thức',video:true,slides:[
  {t:'Bài 3 · Cộng, trừ đa thức',h:'<p>Bước 1: viết hai đa thức trong ngoặc, nối bằng dấu + hoặc −.</p><p>Bước 2: bỏ ngoặc (trước ngoặc có dấu − thì <b>đổi dấu</b> mọi hạng tử).</p><p>Bước 3: thu gọn.</p>',say:'Chào các em! Để cộng hay trừ hai đa thức: bước một, viết hai đa thức trong ngoặc nối với nhau bằng dấu cộng hoặc trừ. Bước hai, bỏ ngoặc; nếu trước ngoặc là dấu trừ thì phải đổi dấu tất cả hạng tử trong ngoặc. Bước ba, thu gọn.'},
  {t:'Ví dụ cộng',h:'<p>A = 2x<sup>2</sup> − 3x + 1, &nbsp;B = x<sup>2</sup> + 5x − 4</p><p>A + B = 2x<sup>2</sup> − 3x + 1 + x<sup>2</sup> + 5x − 4</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= <b>3x<sup>2</sup> + 2x − 3</b></p>',say:'Ví dụ: A bằng hai x bình phương trừ ba x cộng một, B bằng x bình phương cộng năm x trừ bốn. A cộng B: bỏ ngoặc rồi gộp hạng tử đồng dạng, được ba x bình phương cộng hai x trừ ba.'},
  {t:'Ví dụ trừ',h:'<p>A − B = (2x<sup>2</sup> − 3x + 1) − (x<sup>2</sup> + 5x − 4)</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= 2x<sup>2</sup> − 3x + 1 <b>− x<sup>2</sup> − 5x + 4</b></p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= <b>x<sup>2</sup> − 8x + 5</b></p>',say:'A trừ B: khi bỏ ngoặc có dấu trừ phía trước, ta đổi dấu mọi hạng tử của B: x bình phương thành âm x bình phương, năm x thành âm năm x, âm bốn thành cộng bốn. Thu gọn được x bình phương trừ tám x cộng năm.'},
  {t:'Tìm đa thức chưa biết',h:'<p>C + A = B &nbsp;→ &nbsp;C = B − A</p><p>C − A = B &nbsp;→ &nbsp;C = B + A</p><p class="muted">Giống như tìm x với số, nhưng giờ là đa thức.</p>',say:'Muốn tìm đa thức C biết C cộng A bằng B, ta lấy B trừ A. Nếu C trừ A bằng B thì C bằng B cộng A. Cách làm giống như tìm x với các số mà em đã biết.'},
  {t:'Ghi nhớ',h:'<p>• Bỏ ngoặc có dấu − phía trước: đổi dấu tất cả.</p><p>• Cộng trừ xong phải thu gọn.</p><p>• Kiểm tra bằng cách thay một giá trị của x.</p>',say:'Ghi nhớ: bỏ ngoặc có dấu trừ phía trước thì đổi dấu tất cả hạng tử. Cộng trừ xong phải thu gọn. Mẹo kiểm tra: thay một giá trị bất kì của x vào hai vế xem có bằng nhau không. Vào đảo nào!'}],
  gen:[
  ()=>{const A=[nz(),nz(),R(-9,9)],B=[nz(),nz(),R(-9,9)],P=x=>poly([[x[0],[['x',2]]],[x[1],[['x',1]]],[x[2],[]]]);return{q:`Cho A = ${P(A)}, B = ${P(B)}. Hệ số của x<sup>2</sup> trong A + B là bao nhiêu?`,a:A[0]+B[0],sol:`A + B = ${P([A[0]+B[0],A[1]+B[1],A[2]+B[2]])}. Hệ số của x<sup>2</sup> là ${A[0]+B[0]}.`}},
  ()=>{const A=[nz(),nz(),R(-9,9)],B=[nz(),nz(),R(-9,9)],P=x=>poly([[x[0],[['x',2]]],[x[1],[['x',1]]],[x[2],[]]]);const k=R(1,2);const nm=['','x','hạng tử tự do'][k];return{q:`Cho A = ${P(A)}, B = ${P(B)}. Trong A − B, ${k===1?'hệ số của x':'hạng tử tự do (số không chứa biến)'} bằng bao nhiêu?`,a:A[k]-B[k],sol:`A − B = ${P([A[0]-B[0],A[1]-B[1],A[2]-B[2]])}. Đáp số: ${A[k]-B[k]}.`}},
  ()=>{const A=[nz(),nz(),R(-9,9)],B=[nz(),nz(),R(-9,9)],P=x=>poly([[x[0],[['x',2]]],[x[1],[['x',1]]],[x[2],[]]]);const C=[B[0]-A[0],B[1]-A[1],B[2]-A[2]],x=pick([-2,-1,1,2]);const v=C[0]*x*x+C[1]*x+C[2];return{q:`Tìm đa thức C sao cho C + (${P(A)}) = ${P(B)}. Tính giá trị của C tại x = ${x}.`,a:v,sol:`C = B − A = ${P(C)}. Tại x = ${x}: C = ${v}.`}}]}
];

/* ===================== Lớp 9 · Chương I Phương trình và hệ hai phương trình bậc nhất hai ẩn ===================== */
const neg=c=>c<0?'−'+(-c):''+c;
const lin=(a,b,c)=>`${mono(a,[['x',1]],true)}${mono(b,[['y',1]],false)} = ${neg(c)}`;
const sys=(e1,e2)=>`<span class="sys"><span>${e1}</span><span>${e2}</span></span>`;
const P1_9=[
 {id:'g9b1',title:'Bài 1. Khái niệm phương trình và hệ hai phương trình bậc nhất hai ẩn',video:true,slides:[
  {t:'Bài 1 · Phương trình bậc nhất hai ẩn',h:'<p>Dạng: <b>ax + by = c</b>, với a, b không đồng thời bằng 0.</p><p>Ví dụ: 2x − y = 3; &nbsp; 0x + 4y = 8; &nbsp; x + 0y = 5.</p>',say:'Chào các em lớp chín! Phương trình bậc nhất hai ẩn x và y có dạng a x cộng b y bằng c, trong đó a và b không đồng thời bằng không. Ví dụ hai x trừ y bằng ba.'},
  {t:'Nghiệm của phương trình',h:'<p>Cặp (x<sub>0</sub>; y<sub>0</sub>) là nghiệm nếu ax<sub>0</sub> + by<sub>0</sub> = c.</p><p>2x − y = 3: thay (2; 1): 4 − 1 = 3 ✓ &nbsp; thay (1; 2): 2 − 2 = 0 ✗</p><p class="muted">Phương trình bậc nhất hai ẩn có vô số nghiệm.</p>',say:'Cặp số x không, y không là nghiệm nếu thay vào thì hai vế bằng nhau. Thay hai và một vào hai x trừ y: bốn trừ một bằng ba, đúng. Thay một và hai thì được không, khác ba, nên không phải nghiệm. Phương trình bậc nhất hai ẩn luôn có vô số nghiệm.'},
  {t:'Hệ hai phương trình',h:`<p>Hệ hai phương trình bậc nhất hai ẩn: ${sys('ax + by = c','a′x + b′y = c′')}</p><p>Nghiệm của hệ là cặp số thỏa mãn <b>cả hai</b> phương trình.</p>`,say:'Hệ hai phương trình bậc nhất hai ẩn gồm hai phương trình viết trong dấu ngoặc nhọn. Nghiệm của hệ là cặp số thỏa mãn đồng thời cả hai phương trình.'},
  {t:'Ví dụ',h:`<p>Kiểm tra (2; 1) với hệ ${sys('x + y = 3','2x − y = 3')}</p><p>2 + 1 = 3 ✓ &nbsp;&nbsp; 4 − 1 = 3 ✓ &nbsp;→ (2; 1) là nghiệm của hệ.</p>`,say:'Ví dụ: kiểm tra cặp hai, một với hệ x cộng y bằng ba và hai x trừ y bằng ba. Phương trình thứ nhất: hai cộng một bằng ba, đúng. Phương trình thứ hai: bốn trừ một bằng ba, đúng. Vậy hai, một là nghiệm của hệ.'},
  {t:'Ghi nhớ',h:'<p>• ax + by = c, a và b không cùng bằng 0.</p><p>• Kiểm tra nghiệm: thay vào, hai vế bằng nhau.</p><p>• Nghiệm của hệ: đúng với cả hai phương trình.</p>',say:'Ghi nhớ: phương trình bậc nhất hai ẩn có dạng a x cộng b y bằng c. Kiểm tra nghiệm bằng cách thay vào. Nghiệm của hệ phải đúng với cả hai phương trình. Vào đảo thôi!'}],
  gen:[
  ()=>{const a=nz(),b=nz(),x=R(-6,6),y=R(-6,6);if(R(0,1))return{q:`Tìm c để cặp (${x}; ${y}) là nghiệm của phương trình ${mono(a,[['x',1]],true)}${mono(b,[['y',1]],false)} = c.`,a:a*x+b*y,sol:`c = ${a} · (${x}) + ${b} · (${y}) = ${a*x+b*y}.`};const a1=pick([1,-1,2,3]),c=a1*x+b*y;return{q:`Cặp (x; ${y}) là nghiệm của phương trình ${lin(a1,b,c)}. Tìm x.`,a:x,sol:`${mono(a1,[['x',1]],true)} = ${c} − (${b*y}) = ${c-b*y} → x = ${x}.`}},
  ()=>{const x=R(-5,5),y=R(-5,5),a=nz(),b=nz(),m=nz();const c=a*x+b*y;if(!x)return{q:`Cặp (${x}; ${y}) có là nghiệm của ${lin(a,b,c)} không? Nhập 1 nếu có, 0 nếu không.`,a:1,sol:`${a} · 0 + ${b} · (${y}) = ${c}. Đúng nên nhập 1.`};const ok=R(0,1),cc=ok?c:c+nz();return{q:`Cặp (${x}; ${y}) có là nghiệm của ${lin(a,b,cc)} không? Nhập 1 nếu có, 0 nếu không.`,a:ok?1:0,sol:`${a} · (${x}) + ${b} · (${y}) = ${c}${ok?' = vế phải. Có.':` ≠ ${cc}. Không.`}`}},
  ()=>{let x;do{x=pick([-3,-2,-1,1,2,3])}while(!x);const y=R(-5,5),m=nz(),a=nz(),b=nz(),c=a*x+b*y,d=m*x+y;return{q:`Hệ ${sys(lin(a,b,c),`mx + y = ${d}`)} có nghiệm (${x}; ${y}). Tìm m.`,a:m,sol:`Thay vào phương trình thứ hai: m · (${x}) + (${y}) = ${d} → m = ${m}.`}}]},
 {id:'g9b2',title:'Bài 2. Giải hệ hai phương trình bậc nhất hai ẩn',video:true,slides:[
  {t:'Bài 2 · Giải hệ phương trình',h:'<p>Hai cách chính:</p><p>1. <b>Phương pháp thế</b>: rút một ẩn từ một phương trình, thế vào phương trình kia.</p><p>2. <b>Phương pháp cộng đại số</b>: cộng hoặc trừ hai phương trình để khử một ẩn.</p>',say:'Chào các em! Có hai cách chính để giải hệ hai phương trình bậc nhất hai ẩn: phương pháp thế, và phương pháp cộng đại số.'},
  {t:'Phương pháp thế',h:`<p>${sys('x + 2y = 7','3x − y = 7')}</p><p>Từ (1): x = 7 − 2y. Thế vào (2): 3(7 − 2y) − y = 7 → 21 − 7y = 7 → y = 2.</p><p>x = 7 − 4 = 3. &nbsp;Nghiệm <b>(3; 2)</b>.</p>`,say:'Phương pháp thế: từ phương trình một rút x bằng bảy trừ hai y. Thế vào phương trình hai: ba nhân bảy trừ hai y, trừ y bằng bảy, được y bằng hai. Suy ra x bằng ba. Nghiệm là ba, hai.'},
  {t:'Phương pháp cộng đại số',h:`<p>${sys('2x + 3y = 13','2x − y = 1')}</p><p>Trừ vế theo vế: 4y = 12 → y = 3. &nbsp;Thay vào: 2x − 3 = 1 → x = 2.</p><p>Nghiệm <b>(2; 3)</b>.</p>`,say:'Phương pháp cộng đại số: hai phương trình có cùng hệ số hai x, ta trừ vế theo vế để khử x, được bốn y bằng mười hai, y bằng ba. Thay lại được x bằng hai. Nghiệm là hai, ba.'},
  {t:'Khi hệ số chưa bằng nhau',h:`<p>${sys('3x + 2y = 8','x − y = 1')} &nbsp; Nhân (2) với 2: 2x − 2y = 2.</p><p>Cộng với (1): 5x = 10 → x = 2, y = 1.</p>`,say:'Nếu hệ số chưa bằng nhau, ta nhân một phương trình với một số thích hợp. Nhân phương trình hai với hai được hai x trừ hai y bằng hai. Cộng với phương trình một, khử y, được x bằng hai, y bằng một.'},
  {t:'Ghi nhớ',h:'<p>• Thế: hợp khi có ẩn với hệ số 1 hoặc −1.</p><p>• Cộng đại số: làm cho hệ số một ẩn bằng nhau (hoặc đối nhau).</p><p>• Luôn thay nghiệm vào cả hai phương trình để kiểm tra.</p><p class="muted">Nhập nghiệm dạng: 3; 2</p>',say:'Ghi nhớ: dùng phương pháp thế khi có ẩn với hệ số một hoặc âm một. Dùng cộng đại số khi làm cho hệ số của một ẩn bằng nhau hoặc đối nhau. Luôn kiểm tra nghiệm bằng cả hai phương trình. Khi trả lời, em nhập x chấm phẩy y nhé.'}],
  gen:[
  ()=>{const x=R(-6,9),y=R(-6,9);return{q:`Giải hệ ${sys(`x + y = ${x+y}`,`x − y = ${x-y}`)}`,pair:[x,y],sol:`Cộng hai phương trình: 2x = ${2*x} → x = ${x}; y = ${x+y} − (${x}) = ${y}. Nghiệm (${x}; ${y}).`}},
  ()=>{const x=R(-5,6),y=R(-5,6),a=R(1,4),b=nz(),d=nz();const c=a*x+b*y,e=x+d*y;return{q:`Giải hệ ${sys(lin(a,b,c),lin(1,d,e))}`,pair:[x,y],sol:`Từ phương trình hai: x = ${e} ${d>0?'−':'+'} ${Math.abs(d)}y. Thế vào phương trình một rồi giải được y = ${y}, x = ${x}.`}},
  ()=>{let a,b,c,d;do{a=nz();b=nz();c=nz();d=nz()}while(a*d-b*c===0);const x=R(-5,5),y=R(-5,5);return{q:`Giải hệ ${sys(lin(a,b,a*x+b*y),lin(c,d,c*x+d*y))}`,pair:[x,y],sol:`Nhân để hệ số của x bằng nhau rồi trừ vế theo vế: y = ${y}; thay lại: x = ${x}. Nghiệm (${x}; ${y}).`}}]},

/* ===================== Sự kiện (mẫu xAPI) ===================== */
const VERB={answered:'đã trả lời',watched:'đã xem video',studied:'đã học ví dụ',passed:'qua màn',failed:'chưa qua màn',earned:'nhận sao',assigned:'mở buổi',activated:'kích hoạt Toán Jenny',awarded:'được tặng thẻ',purchased:'đã mua'};
function log(actor,verb,objName,_n,result){
  const who=S.st[actor]?S.st[actor].name:'Giáo viên';
  S.events.push({actor:{name:who,account:{name:actor}},verb:{id:'http://adlnet.gov/expapi/verbs/'+verb,display:{vi:VERB[verb]||verb}},object:{id:'jenny:'+encodeURIComponent(objName),definition:{name:{vi:objName}}},result:result||{},context:{extensions:{'jenny:day':S.day}},timestamp:new Date().toISOString()});
  if(S.events.length>3000)S.events.splice(0,S.events.length-3000);
}
const evDay=e=>e.context.extensions['jenny:day'];

/* ===================== Sao và mở khóa ===================== */
const p1Stars=st=>L1(st).reduce((a,x)=>a+st.p1[x.id].m.filter(Boolean).length,0);
const p2Stars=st=>(st.grade<=5?P2_1.filter(x=>x.grade===st.grade):P2).reduce((a,x)=>a+st.p2[x.id].m.reduce((s,v,i)=>s+(v?STAR2[i]:0),0),0);
const totalStars=st=>p1Stars(st)+p2Stars(st);
const islandOpen=(st,k)=>st.grade<=5?open1(st,k):totalStars(st)>=NEED(k);
const curIsland=st=>{const P=L1(st);for(let k=0;k<P.length;k++){if(islandOpen(st,k)&&st.p1[P[k].id].m.some(v=>!v))return k}return -1};
function addCoins(id,n,kind){const st=S.st[id];if(kind==='self'){const used=st.selfCoins[S.day]||0;n=Math.max(0,Math.min(n,SELF_CAP-used));st.selfCoins[S.day]=used+n}st.coins+=n;return n}

/* ===================== Số liệu ===================== */
function dayStats(id,d){
  const ev=S.events.filter(e=>e.actor.account.name===id&&evDay(e)===d&&e.verb.id.endsWith('answered'));
  const sec=ev.reduce((a,e)=>a+Math.min(180,parseInt(String(e.result.duration||'PT0S').slice(2))||0),0);
  const stars=S.events.filter(e=>e.actor.account.name===id&&evDay(e)===d&&e.verb.id.endsWith('earned')).reduce((a,e)=>a+(e.result.score?e.result.score.raw:0),0);
  return{n:ev.length,c:ev.filter(e=>e.result.success).length,min:Math.round(sec/60),stars};
}
function activeDays(id){let a=0;const from=Math.max(1,S.day-6);for(let d=from;d<=S.day;d++)if(dayStats(id,d).n)a++;return{a,span:S.day-from+1}}
function alerts(id){
  const st=S.st[id],out=[];
  L1(st).forEach(x=>{const s=st.p1[x.id];s.fails.forEach((f,i)=>{if(f>=2&&!s.m[i])out.push({t:`Kẹt ${x.title.split('.')[0]} · ${M1[i].split(' · ')[0]}`,c:'bad'})})});
  P2.forEach(x=>{const s=st.p2[x.id];s.fails.forEach((f,i)=>{if(f>=2&&!s.m[i])out.push({t:`Kẹt ${x.title.split(' · ')[0]} · màn ${'★'.repeat(i+1)}`,c:'bad'})})});
  if(st.grade<=5){const nm=Object.keys(st.mist||{}).length;if(nm>=3)out.push({t:`Sổ lỗi sai: ${nm} dạng`,c:'warn'})}
  if(st.grade===6){const nm=Object.keys(st.mist||{}).length;if(nm>=3)out.push({t:`Sổ lỗi sai: ${nm} dạng`,c:'warn'});const w=P1_6.filter(x=>st.p1[x.id]&&st.p1[x.id].med&&st.p1[x.id].med.some((m,i)=>st.p1[x.id].m[i]&&m===1));if(w.length)out.push({t:`Đạt Đồng: ${w.map(x=>x.title.split('.')[0]).join(', ')}`,c:'warn'})}
  if(S.day>1&&!dayStats(id,S.day).n&&!dayStats(id,S.day-1).n)out.push({t:'Không học 2 ngày',c:'warn'});
  if(st.active&&st.grade<=5)P2_1.filter(x=>x.grade===st.grade).forEach(x=>{if(!x.draft&&S.open[x.id]&&!j1s(st,x.id).m.every(Boolean))out.push({t:`Chưa xong ${x.title.split(' · ')[0]} Toán Jenny`,c:'warn'})});
  if(st.active&&st.grade===6)P2.forEach(x=>{if(S.open[x.id]&&!st.p2[x.id].m.every(Boolean))out.push({t:`Chưa xong ${x.title.split(' · ')[0]} Toán Jenny`,c:'warn'})});
  return out;
}

function startPlayer(){
  const u=unit(scr.part,scr.id),slides=u.slides;let i=0,playing=false,timer=null,seen=new Set([0]);
  const synth=('speechSynthesis' in window)?window.speechSynthesis:null;
  let voice=null;const pickVoice=()=>{try{voice=(synth.getVoices()||[]).find(v=>/^vi/i.test(v.lang))||null}catch(e){voice=null}};
  if(synth){pickVoice();try{synth.onvoiceschanged=pickVoice}catch(e){}}
  const el=id=>document.getElementById(id);
  function draw(){if(!el('slide'))return;const s=slides[i];el('slide').innerHTML=`<h3>${s.t}</h3><div class="body">${s.h}</div>`;el('cap').textContent=s.say;
    el('prog').innerHTML=slides.map((_,j)=>`<i class="${j<=i?'on':''}"></i>`).join('');el('pCount').textContent=`${i+1}/${slides.length}`;
    el('pPrev').disabled=i===0;el('pNext').disabled=i===slides.length-1;el('pPlay').textContent=playing?'❚❚':'▶';el('pPlay').setAttribute('aria-label',playing?'Dừng':'Phát');
    const all=seen.size>=slides.length;el('pDone').disabled=!all;el('pDone').classList.toggle('pri',all);
    el('pNote').textContent=all?'Em đã xem hết các trang.':voice?'Bấm ▶ để Jenny đọc bằng giọng tiếng Việt.':synth?'Máy chưa có giọng tiếng Việt: em đọc phụ đề bên dưới.':'Máy không đọc được: em đọc phụ đề, trang tự chuyển.'}
  function clear(){clearTimeout(timer);timer=null;if(synth)try{synth.cancel()}catch(e){}}
  function speak(){clear();const s=slides[i];const after=()=>{if(!playing)return;if(i<slides.length-1){i++;seen.add(i);draw();speak()}else{playing=false;draw()}};
    if(synth){try{const u2=new SpeechSynthesisUtterance(s.say);u2.lang='vi-VN';if(voice)u2.voice=voice;u2.rate=1;let ended=false;u2.onend=()=>{if(ended)return;ended=true;timer=setTimeout(after,500)};u2.onerror=()=>{if(ended)return;ended=true;timer=setTimeout(after,Math.max(3500,s.say.length*60))};synth.speak(u2);return}catch(e){}}
    timer=setTimeout(after,Math.max(3500,s.say.length*60))}
  player={toggle(){playing=!playing;if(playing)speak();else clear();draw()},next(){if(i<slides.length-1){i++;seen.add(i);draw();if(playing)speak()}},prev(){if(i>0){i--;draw();if(playing)speak()}},stop(){playing=false;clear()}};
  draw();
}
