<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hành trình của Jenny Mầm non – Học Toán cùng Jenny</title>
<link rel="icon" href="../../../assets/jenny-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Hành trình của Jenny – Mầm non (5–6 tuổi).
   Bản đồ 6 đảo theo chủ đề × 8 màn; mỗi màn 5 câu tương tác (kéo thả, nối, tô màu, chọn) có giọng đọc + Vườn của Jenny.
   Mọi màn hình vừa 1 khung nhìn, không kéo lên xuống. */
:root{
  --sky:#CFEAFB; --ink:#1D2B53; --ink-soft:#4A5878; --paper:#fff;
  --sun:#FFC93C; --sun-soft:#FFF0C2; --coral:#FF6B57; --mint:#2DBE8C; --mint-soft:#D5F6E8;
  --sel:#2F7DE1; --sel-soft:#DCEBFF; --hatch:#B8C6DD; --purple:#8E6BD8; --grass:#B7E08F;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:var(--body);
  background-image:radial-gradient(circle at 1px 1px,rgba(29,43,83,.10) 1px,transparent 1.4px);background-size:22px 22px;
  -webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.app{height:100vh;height:100dvh;padding:8px 14px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;max-width:1400px;margin:0 auto}

/* top bar */
.bar{display:flex;align-items:center;gap:8px;min-width:0}
.bar .logo{height:42px;width:auto;flex:none}
.ttl{font-family:var(--display);font-weight:800;font-size:24px;line-height:1;white-space:nowrap}
.ttl small{display:block;font-family:var(--body);font-size:11.5px;letter-spacing:.08em;color:var(--ink-soft);margin-top:3px;text-transform:uppercase}
.spacer{flex:1;min-width:0}
.pill{display:flex;align-items:center;gap:5px;background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:3px 11px 3px 6px;box-shadow:0 3px 0 var(--ink);flex:none}
.pill svg{width:22px;height:22px;flex:none}
.pill b{font-family:var(--display);font-size:19px;line-height:1}
.pill small{font-size:12px;font-weight:800;color:var(--ink-soft)}
.pill.flash{animation:flash .6s}
@keyframes flash{30%{transform:scale(1.18);background:var(--sun-soft)}}
.ib{width:42px;height:42px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0;flex:none;color:var(--ink);text-decoration:none}
.ib svg{width:22px;height:22px}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ib.off{opacity:.45}

/* bottom tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{height:54px;border:2.5px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-weight:800;font-size:19px;padding:0 8px}
.tab svg{width:26px;height:26px;flex:none}
.tab[aria-selected="true"]{background:var(--sun)}
.tab:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.tab .dot{min-width:20px;height:20px;border-radius:10px;background:var(--coral);color:#fff;font-family:var(--body);font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 5px;border:2px solid var(--ink)}

main{min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}
.view.on{display:grid}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink)}

/* ---------- map ---------- */
#vMap{grid-template-rows:auto minmax(0,1fr);gap:8px}
.isle-head{display:flex;align-items:center;gap:8px}
.isle-head .nm{flex:1;min-width:0;text-align:center;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05}
.isle-head .nm small{display:block;font-family:var(--body);font-size:12.5px;font-weight:800;color:var(--ink-soft)}
.mapbox{min-height:0;position:relative;container-type:size}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%}
.node{cursor:pointer}
.node .ring{animation:pulse 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.18);opacity:.35}}
.node:focus{outline:none}
.node:focus-visible circle.face{stroke:var(--sel);stroke-width:5}

/* ---------- math station ---------- */
#vMath{grid-template-columns:minmax(0,1fr) 330px;gap:12px}
#vMath.answered{grid-template-columns:minmax(0,1fr) 230px}
@media (max-height:520px){ #vMath.answered{grid-template-columns:minmax(0,1fr) 170px} #vMath.answered .mrow,#vMath.answered .mhead{display:none} #vMath.answered .mcard{grid-template-rows:minmax(0,1fr)} }
.mcard{display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;padding:12px 14px;min-height:0}
.mhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg{display:flex;gap:6px}
.seg button{border:2.5px solid var(--ink);border-radius:12px;background:#fff;padding:4px 10px;font-weight:900;font-size:14px;display:flex;align-items:center;gap:4px;box-shadow:0 2px 0 var(--ink)}
.seg button svg{width:16px;height:16px}
.seg button[aria-pressed="true"]{background:var(--sun)}
.today{margin-left:auto;font-size:13px;font-weight:800;color:var(--ink-soft);display:flex;align-items:center;gap:4px}
.today svg{width:16px;height:16px}
.mtext{min-height:0;overflow:hidden;font-size:22px;line-height:1.5;font-weight:700;display:flex;flex-direction:column;gap:10px}
.mtext .qn{font-family:var(--display);font-size:.8em;color:var(--ink-soft);letter-spacing:.04em}
.mtext .q{white-space:pre-line}
.mtext .sol{white-space:pre-line;background:var(--mint-soft);border:2.5px solid var(--mint);border-radius:14px;padding:8px 12px;font-weight:700}
.mtext .sol.bad{background:var(--sun-soft);border-color:var(--sun)}
.mtext .sol b.h{display:block;font-family:var(--display);font-size:1.05em}
.mtext.solved .q{color:var(--ink-soft)}
.mtext .qbtn{display:none;align-self:flex-start;border:2px solid var(--ink);border-radius:10px;background:#fff;font-weight:900;font-size:13px;padding:3px 10px}
.mtext.fold .qbtn{display:block}
.mtext.scroll{overflow-y:auto}
.mtext.fold .qn{display:none}
.mtext.fold{gap:6px}
.mtext.fold .sol{padding:6px 10px}
.mtext.fold:not(.showq) .q,.mtext.fold:not(.showq) .fig{display:none}
.mtext.fold.showq .sol{display:none}
.mtext .fig{flex:1 1 0;min-height:110px;position:relative}
.mtext .fig svg{position:absolute;inset:0;width:100%;height:100%}
.mtext .q{flex:none}
.mtext .sol{flex:none}
.mhead .read{border:2.5px solid var(--ink);border-radius:999px;background:var(--sel);color:#fff;padding:4px 12px 4px 6px;font-weight:900;font-size:15px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--ink)}
.mhead .read svg{width:24px;height:24px;background:#fff;border-radius:50%;padding:3px;color:var(--ink)}
.mhead .read.on{background:var(--coral);animation:pulse2 1.2s ease-in-out infinite}
@keyframes pulse2{50%{box-shadow:0 3px 0 var(--ink),0 0 0 6px rgba(255,107,87,.3)}}
.mhead .read:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.opts{display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:8px;min-height:0}
.opt{border:2.5px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 3px 0 var(--ink);display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;gap:6px;padding:6px 10px;min-height:0;font-weight:900;font-size:19px;text-align:left}
.opt .no{width:30px;height:30px;border-radius:50%;background:var(--sun);border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:17px}
.opt .ob{height:100%;min-height:0;position:relative;display:flex;align-items:center}
.opt .ob svg{position:absolute;inset:0;width:100%;height:100%}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.opt.no-go{opacity:.35;background:#EEF1F6}
.opt.right{background:var(--mint-soft);border-color:var(--mint)}
.opt.wrong{background:#FFE1DC;border-color:var(--coral)}
.mpad.pick .ans,.mpad.pick #bClr{display:none}
.mpad.pick{grid-template-rows:auto minmax(0,1fr) auto}
@media (max-aspect-ratio:1/1){ .mtext .fig{min-height:150px} }
@media (max-height:520px){ .mtext .fig{min-height:80px} }
.grades{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grades button{border:3px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--ink);padding:14px 8px;font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1}
.grades button small{display:block;font-family:var(--body);font-size:13px;color:var(--ink-soft)}
.grades button[aria-pressed="true"]{background:var(--sun)}
.mpad{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:8px;min-height:0}
.ans{height:64px;border:3px solid var(--ink);border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:flex-end;padding:0 16px;font-family:var(--display);font-weight:800;font-size:36px;letter-spacing:.04em;box-shadow:inset 0 3px 0 rgba(29,43,83,.08)}
.ans.empty{color:var(--hatch)}
.ans.ok{background:var(--mint-soft);border-color:var(--mint)}
.ans.no{background:#FFE1DC;border-color:var(--coral);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(0,1fr);gap:7px;min-height:0}
.key{border:2.5px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--ink);font-family:var(--display);font-weight:800;font-size:26px;display:grid;place-items:center;padding:0;min-height:0}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.key.go{background:var(--mint);color:#fff}
.key.go.next{background:var(--sun);color:var(--ink);font-size:22px;display:flex;align-items:center;justify-content:center;gap:8px}
.keys.done{grid-template-rows:minmax(54px,1fr);grid-auto-rows:auto}
.key svg{width:28px;height:28px}
.jrow{display:flex;align-items:flex-end;gap:8px;min-height:0}
.jrow .bubble{flex:1;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:7px 10px;font-weight:800;font-size:14.5px;line-height:1.35;position:relative}
.jrow .bubble:after{content:"";position:absolute;right:-9px;bottom:14px;border:7px solid transparent;border-left-color:var(--ink)}
.jsvg{width:58px;height:68px;flex:none}
.jsvg .m-happy,.jsvg .m-oops{display:none}
.jsvg.happy .m-norm,.jsvg.oops .m-norm{display:none}
.jsvg.happy .m-happy,.jsvg.oops .m-oops{display:inline}
.jsvg.bounce{animation:bounce .5s}
@keyframes bounce{40%{transform:translateY(-8px)}}
.mrow{display:flex;gap:7px}
.btn{height:44px;border:2.5px solid var(--ink);border-radius:13px;background:#fff;box-shadow:0 3px 0 var(--ink);font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;flex:1;text-decoration:none;color:var(--ink)}
.btn svg{width:20px;height:20px}
.btn.y{background:var(--sun)}
.btn.g{background:var(--mint);color:#fff}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45}

/* ---------- garden ---------- */
#vGarden{grid-template-rows:minmax(0,1fr) auto;gap:8px}
.gbox{min-height:0;container-type:size;display:grid;place-items:center}
.scene{width:min(100cqw,100cqh*1.75);height:min(100cqh,100cqw/1.75);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);overflow:hidden;position:relative;
  background:linear-gradient(#BDE6FF 0 22%,var(--grass) 22%);display:grid;grid-template-columns:62% 38%;grid-template-rows:22% 78%;container-type:size}
.deco{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:0 2%}
.deco > div{height:100%;display:grid;place-items:end center;position:relative}
.deco svg{height:92%;width:auto;max-width:100%}
.deco .slot{opacity:.28;display:grid;place-items:end center;height:100%;width:100%}
.plots{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:3%;padding:4% 3% 5% 4%}
.plot,.pen{border:2.5px solid var(--ink);border-radius:14%;background:#A9764E;position:relative;display:grid;place-items:center;padding:0;min-height:0;box-shadow:0 3px 0 rgba(29,43,83,.55)}
.plot{background:repeating-linear-gradient(0deg,#9A6A43 0 12%,#A9764E 12% 24%)}
.plot svg,.pen svg{width:82%;height:82%}
.plot .bar2,.pen .bar2{position:absolute;left:10%;right:10%;bottom:7%;height:9%;border-radius:9px;background:rgba(255,255,255,.55);border:1.5px solid var(--ink);overflow:hidden}
.plot .bar2 i,.pen .bar2 i{display:block;height:100%;background:var(--mint)}
.plot.ripe svg,.pen.ripe .prod{animation:bounce 1s infinite}
.plot .plus,.pen .plus{font-family:var(--display);font-weight:800;font-size:min(9cqh,6cqw);color:#fff;opacity:.85}
.pens{display:grid;grid-template-rows:repeat(3,1fr);gap:4%;padding:4% 5% 5% 3%}
.pen{background:#F5E3B5;border-radius:12%;grid-template-columns:1fr auto;padding:0 4%}
.pen .ani{height:88%;display:grid;place-items:center}
.pen .ani svg{height:100%;width:auto}
.pen .side{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900;font-size:min(4.2cqh,3cqw);line-height:1.1}
.pen .side svg{width:min(9cqh,6cqw);height:min(9cqh,6cqw)}
.pen .prod svg{width:min(10cqh,7cqw);height:min(10cqh,7cqw)}
.pen .hungry{background:var(--coral);color:#fff;border-radius:999px;padding:2px 7px;border:2px solid var(--ink)}
@container (orientation: portrait){
  .scene{width:min(100cqw,100cqh*.8);height:min(100cqh,100cqw/.8);grid-template-columns:1fr;grid-template-rows:16% 50% 34%}
  .pens{grid-template-rows:1fr;grid-template-columns:repeat(3,1fr);padding:2% 4% 4%}
  .pen{grid-template-columns:1fr;grid-template-rows:1fr auto;padding:4% 2%}
  .pen .side{font-size:min(3cqh,4.2cqw);flex-direction:row}
  .plots{padding:4%}
}
.gbar{display:flex;gap:8px;align-items:center}
.gbar .btn{flex:0 1 auto}
.gbar .info{flex:1;font-weight:800;font-size:14px;color:var(--ink-soft);line-height:1.3}

/* ---------- lock ---------- */
#vLock{place-items:center}
.lock{max-width:520px;width:100%;padding:18px 20px;display:grid;gap:10px;text-align:center;justify-items:center}
.lock h2{font-family:var(--display);font-weight:800;font-size:28px;margin:0;line-height:1.1}
.lock p{margin:0;font-weight:700;color:var(--ink-soft);line-height:1.45}
.lock input{width:100%;max-width:300px;height:54px;border:3px solid var(--ink);border-radius:14px;font-family:var(--display);font-weight:800;font-size:26px;text-align:center;letter-spacing:.12em;text-transform:uppercase}
.lock .err{color:#B3261E;font-weight:900;min-height:1.3em}
.lock .jsvg{width:84px;height:98px}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;background:rgba(29,43,83,.45);display:grid;place-items:center;padding:10px;z-index:20}
.panel{background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:16px 18px;width:min(560px,100%);display:grid;gap:10px;text-align:center}
.panel h2{font-family:var(--display);font-weight:800;font-size:26px;margin:0;line-height:1.1}
.panel p{margin:0;font-weight:700;line-height:1.45;color:var(--ink-soft)}
.panel .stars{display:flex;justify-content:center;gap:6px;color:var(--sun)}
.panel .stars svg{width:40px;height:40px}
.panel .stars svg.dim{color:#E3E8F1}
.panel .row{display:flex;gap:8px;flex-wrap:wrap}
.panel .row > *{flex:1 1 140px}
.shopgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{border:2.5px solid var(--ink);border-radius:14px;background:#fff;padding:6px;display:grid;justify-items:center;gap:2px;box-shadow:0 3px 0 var(--ink);font-weight:800;font-size:13px;line-height:1.2}
.item svg.pic{width:54px;height:54px}
.item b{font-family:var(--display);font-size:16px}
.item .price{display:flex;align-items:center;gap:3px;font-weight:900}
.item .price svg{width:16px;height:16px}
.item[disabled]{opacity:.5}
.item.own{background:var(--mint-soft)}
.stabs{display:flex;gap:6px;justify-content:center}
.stabs button{border:2.5px solid var(--ink);border-radius:12px;background:#fff;padding:5px 12px;font-weight:900;box-shadow:0 2px 0 var(--ink)}
.stabs button[aria-pressed="true"]{background:var(--sun)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{border:2.5px solid var(--ink);border-radius:14px;padding:6px}
.kv b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.kv span{font-size:12px;font-weight:800;color:var(--ink-soft)}
textarea.code{width:100%;height:64px;border:2.5px solid var(--ink);border-radius:12px;font:700 12px/1.35 ui-monospace,Menlo,monospace;padding:6px;resize:none}
.toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:8px 16px;font-weight:900;z-index:40;box-shadow:0 4px 0 rgba(0,0,0,.25);pointer-events:none;max-width:92vw;text-align:center;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* ---------- small screens ---------- */
@media (max-aspect-ratio:1/1){
  #vMath.answered{grid-template-columns:1fr}
  #vMath.answered .mhead{display:none}
  #vMath.answered .mcard{grid-template-rows:minmax(0,1fr)}
  .seg button{padding:3px 7px;font-size:13px}
  #vMath{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:8px}
  .mpad{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;gap:7px}
  .ans{height:50px;font-size:30px}
  .mpad .mrow .btn{height:50px;padding:0 10px}
  .keys{grid-column:1/-1;grid-template-columns:repeat(6,1fr);grid-auto-rows:46px;gap:6px}
  .keys .key[data-k="-"]{order:5}
  .keys .key[data-k="6"],.keys .key[data-k="7"],.keys .key[data-k="8"],.keys .key[data-k="9"]{order:6}
  .keys .key[data-k="0"]{order:7}
  .keys .key.go{order:8}
  .keys.done{grid-template-rows:50px}
  .opts{grid-column:1/-1;grid-template-rows:none;grid-template-columns:repeat(3,minmax(0,1fr));height:100px}
  .opt{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);justify-items:center;text-align:center;font-size:15px;padding:4px}
  .opt .no{width:24px;height:24px;font-size:14px}
  .opt .ob{width:100%;justify-content:center}
  .mpad.pick{grid-template-columns:1fr}
  .jrow{display:none}
}
@media (max-aspect-ratio:1/1) and (max-width:420px){ .mpad .mrow .btn{font-size:0;gap:0;width:50px;flex:none} .mpad .mrow .btn svg{width:24px;height:24px} }
@media (max-width:620px){
  .ttl{font-size:18px}
  .ttl small{display:none}
  .bar .logo{height:34px}
  .pill{padding:2px 8px 2px 4px;gap:3px}
  .pill b{font-size:16px}
  .pill small{display:none}
  .pill svg{width:18px;height:18px}
  .ib{width:36px;height:36px;border-radius:10px}
  .ib svg{width:19px;height:19px}
  .tab{height:48px;font-size:16px;gap:5px}
  .tab svg{width:22px;height:22px}
  .bar .hide-s{display:none}
}
@media (max-width:460px){ .ttl{display:none} }
@media (max-height:520px){
  .app{padding:5px 10px;gap:5px}
  .bar .logo{height:32px}
  .ib{width:34px;height:34px}
  .tab{height:40px;font-size:15px}
  .mtext{font-size:17px}
  .ans{height:46px;font-size:28px}
  .key{font-size:20px}
  .jrow{display:none}
  .mpad,.mpad.pick{grid-template-rows:auto auto minmax(0,1fr)}
  .mpad.pick{grid-template-rows:auto minmax(0,1fr)}
  .isle-head .nm{font-size:18px}
  .panel{padding:10px 14px;gap:7px}
  .lock{padding:10px 16px;gap:6px}
  .lock .jsvg{display:none}
  .lock h2{font-size:22px}
  .lock input{height:44px}
  .lock .btn{height:40px}
  .mcard{padding:8px 10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Mầm non: playing ---------- */
.tabs{grid-template-columns:repeat(2,1fr)}
.app.playing .tabs{display:none}
.app.playing{grid-template-rows:auto minmax(0,1fr)}
#vPlay{grid-template-rows:auto auto minmax(0,1fr);gap:8px}
.ptop{display:flex;align-items:center;gap:10px;min-width:0}
.ptop .pt{font-family:var(--display);font-weight:800;font-size:17px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dots{flex:1;display:flex;justify-content:center;gap:8px}
.dots i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;transition:transform .2s}
.dots i.ok{background:var(--mint)}
.dots i.cur{background:var(--sun);transform:scale(1.25)}
.spk{width:58px;height:58px;border-radius:50%;border:3px solid var(--ink);background:var(--sel);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;padding:0;flex:none}
.spk svg{width:32px;height:32px;color:#fff}
.spk.on{background:var(--coral);animation:pulse2 1.2s ease-in-out infinite}
@keyframes pulse2{50%{box-shadow:0 4px 0 var(--ink),0 0 0 8px rgba(255,107,87,.3)}}
.pask{padding:8px 16px;max-height:20vh;overflow:hidden;display:flex;align-items:center}
.pask span{font-family:var(--display);font-weight:800;line-height:1.2}
.pstage{min-height:0;position:relative}
.act{height:100%;display:grid;gap:10px;min-height:0}
.act.col{grid-template-rows:minmax(0,1fr) auto}
.act.col > :nth-child(3){grid-row:auto}
.act.col:has(> :nth-child(3)){grid-template-rows:minmax(0,1fr) auto auto}
.row{display:flex;align-items:stretch;gap:12px;min-height:0}
.row.two > *{flex:1 1 0;min-width:0}
.row.c{justify-content:center;align-items:center}
.row.two.op > .opsym{flex:0 0 auto;align-self:center}
.opsym{font-family:var(--display);font-weight:800;font-size:44px}
.eq{font-family:var(--display);font-weight:800;font-size:32px}
.grp{background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:10px;display:grid;place-content:center;min-height:0;min-width:0;--s:40px;overflow:hidden}
.grp .it{width:var(--s);height:var(--s);display:grid;place-items:center;padding:0;border:0;background:none;position:relative;border-radius:16px}
.grp .it svg{width:100%;height:100%}
.grp .it.gone{opacity:.35}
.grp .it.gone:after{content:"";position:absolute;inset:8%;background:linear-gradient(45deg,transparent 46%,#FF6B57 46%,#FF6B57 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,#FF6B57 46%,#FF6B57 54%,transparent 54%)}
.grp.pickable .it{cursor:pointer;background:#F6F9FE;border:2.5px solid #D3DCEA}
.grp.pickable .it:active{transform:scale(.95)}
.tapgrp{cursor:pointer}
.choices{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.cbtn{min-width:84px;height:76px;border:3px solid var(--ink);border-radius:20px;background:#fff;box-shadow:0 5px 0 var(--ink);font-family:var(--display);font-weight:800;font-size:36px;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:8px;touch-action:manipulation}
.cbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.cbtn .sym{font-size:40px}
.cbtn .opx{font-size:30px}
.cbtn.card{background:var(--sun-soft)}
.cbtn.pic{width:92px;padding:6px}.cbtn.pic svg{width:100%;height:100%}
.cbtn.ok{background:var(--mint);color:#fff;min-width:130px}
.cbtn.pc{width:64px;min-width:64px;border-radius:50%;height:64px}
.cbtn.pc.on{outline:5px solid var(--ink);outline-offset:3px}
.slot{width:84px;height:76px;border:3px dashed var(--ink);border-radius:18px;background:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:40px;color:var(--hatch)}
.slot.filled{border-style:solid;color:var(--ink);background:var(--mint-soft)}
.drag{cursor:grab;position:relative;z-index:5}
.drag.lift{z-index:30;cursor:grabbing;box-shadow:0 10px 0 rgba(29,43,83,.3)}
.right{background:var(--mint-soft)!important;border-color:var(--mint)!important}
.shake{animation:shake .4s}
.hintme{animation:hint 1s ease-in-out 3;outline:5px dashed var(--sun);outline-offset:3px}
@keyframes hint{50%{transform:scale(1.08)}}
.grp.seq,.grp.line{place-content:center}
.slot2{border:3px dashed var(--ink)!important;background:#fff!important;font-family:var(--display);font-weight:800;font-size:calc(var(--s) * .5);color:var(--hatch)}
.slot2.filled{border-style:solid!important;background:var(--mint-soft)!important}
.it.home{opacity:.95}
.it.mark{outline:4px solid var(--sun);outline-offset:2px;border-radius:14px}
/* match */
.act.match{grid-template-columns:minmax(0,1.6fr) minmax(0,.7fr);position:relative;gap:18% }
.mcol{display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:10px;min-height:0}
.mleft{cursor:pointer;touch-action:none}
.mleft.sel{outline:4px solid var(--sel);outline-offset:2px}
.mleft.done,.mnum.done{opacity:.75}
.mnum{border:3px solid var(--ink);border-radius:20px;background:var(--sun-soft);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:44px;cursor:pointer;min-height:0}
.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible}
.lines line{stroke:#2F7DE1;stroke-width:6;stroke-linecap:round}
.lines line.tmp{stroke-dasharray:8 8}
.lines line.ok{stroke:#2DBE8C}
/* clock */
.clkbox{min-height:0;display:grid;place-items:center}
.clkbox svg{height:100%;max-width:100%;aspect-ratio:1}
.clkbox.tap .cn{cursor:pointer}
/* story */
.story .who{flex:0 0 22%!important;display:grid;place-items:center;min-height:0}
.story .who svg{width:100%;max-height:100%}
/* space */
.scene2{position:relative;min-height:0;background:linear-gradient(#DCEBFF 0 70%,#B7E08F 70%);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);container-type:size;overflow:hidden}
.scene2 .base{position:absolute;left:50%;bottom:10%;width:min(44cqw,62cqh);aspect-ratio:1;transform:translateX(-50%)}
.scene2 .base svg{width:100%;height:100%}
.zone{position:absolute;width:min(20cqw,26cqh);aspect-ratio:1;border-radius:50%;display:grid;place-items:center}
.zone.show{border:4px dashed rgba(29,43,83,.35);background:rgba(255,255,255,.35)}
.z-top{left:50%;bottom:calc(10% + min(44cqw,62cqh) * .62);transform:translateX(-50%)}
.z-under{left:50%;bottom:11%;transform:translateX(-50%);width:min(17cqw,22cqh)}
.z-left{left:calc(50% - min(44cqw,62cqh) * .5 - min(20cqw,26cqh) - 2%);bottom:10%}
.z-right{left:calc(50% + min(44cqw,62cqh) * .5 + 2%);bottom:10%}
.obj{width:100%;height:100%;border:0;background:none;padding:0;display:grid;place-items:center;border-radius:50%}
.obj svg{width:100%;height:100%}
.tray{display:flex;justify-content:center}
.tray .obj{width:110px;height:110px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.zone .obj.dragme{background:none;border:0;box-shadow:none}
.spot2{position:absolute;left:12%;bottom:8%;width:min(42cqw,70cqh);aspect-ratio:1}
.spot2 > svg{position:absolute;inset:0;width:100%;height:100%}
.spot2 .obj.in{position:absolute;left:22%;top:8%;width:56%;height:56%}
.scene2 > .obj.out{position:absolute;right:12%;bottom:8%;width:min(30cqw,50cqh);height:auto;aspect-ratio:1}
@media (max-aspect-ratio:1/1){
  .row.story{flex-direction:column;align-items:stretch}
  .story .who{flex:0 0 26%!important}
  .row.story > .opsym{align-self:center;font-size:30px;line-height:.6}
  .cbtn{height:64px;min-width:70px;font-size:28px;padding:0 10px}
  .choices{gap:8px;flex-wrap:nowrap}
  .choices.pal{gap:6px}
  .cbtn.pc{width:48px;min-width:48px;height:48px}
  .cbtn.ok{min-width:84px;padding:0 10px;font-size:24px}
  .cbtn.pic{width:76px}
  .slot{width:70px;height:64px}
  .spk{width:50px;height:50px}
  .ptop .pt{display:none}
  .act.match{gap:12%}
}
@media (max-height:520px){
  .cbtn{height:52px;min-width:60px;font-size:26px;border-radius:14px}
  .cbtn.pic{width:60px}
  .cbtn.pc{width:46px;min-width:46px;height:46px}
  .slot{width:60px;height:52px;font-size:30px}
  .eq{font-size:24px}.opsym{font-size:32px}
  .spk{width:44px;height:44px}.spk svg{width:24px;height:24px}
  .act{gap:6px}
  .tray .obj{width:70px;height:70px}
  .pask{padding:4px 12px}
}
</style>

<body>
<div class="app" id="app">
  <header class="bar">

    <div class="pill" id="pSt" title="Tổng số sao"><span data-i="star"></span><b id="vSt">0</b></div>

<script>
(function () {

  root.querySelectorAll('span[data-i]').forEach(e => {

function leaves(c = '#2DBE8C') { return `<path d="M20 30V20" ${S2} fill="none"/><path d="M20 22c0-5-4-7-9-7 0 5 4 7 9 7zM20 21c0-5 4-8 9-8 0 6-4 8-9 8z" fill="${c}" ${S2}/>`; }

/* ===== So sánh ===== */
ACTS.compare = {
  gen(lv) {

    let a = ri(1, m), b; do { b = ri(1, m); } while (b === a || Math.abs(a - b) > (lv < 2 ? 5 : 3));
    const more = R() < .6;
    return { k1, k2, a, b, mode: more ? 'more' : 'less', ask: more ? 'Bên nào nhiều hơn?' : 'Bên nào ít hơn?', say: more ? 'Bên nào nhiều hơn? Con chạm vào nhóm đó nhé.' : 'Bên nào ít hơn? Con chạm vào nhóm đó nhé.' };

function clockSvg(h, tapNums) {

  for (let i = 1; i <= 12; i++) { const a = i * 30 * Math.PI / 180, x = 100 + 64 * Math.sin(a), y = 100 - 64 * Math.cos(a);
    s += `<g class="cn" data-h="${i}">${tapNums ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="15" fill="transparent"/>` : ''}<text x="${x.toFixed(1)}" y="${(y + 8).toFixed(1)}" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="24" fill="#1D2B53">${i}</text></g>`; }
  s += `<line x1="100" y1="100" x2="100" y2="34" stroke="#2F7DE1" stroke-width="6" stroke-linecap="round"/>`;
  s += `<g class="hh" style="transform:rotate(${h * 30}deg);transform-origin:100px 100px;transition:transform .35s"><line x1="100" y1="100" x2="100" y2="56" stroke="#FF6B57" stroke-width="10" stroke-linecap="round"/></g>`;
  return s + `<circle cx="100" cy="100" r="8" fill="#1D2B53"/></svg>`;
}

/* ================= read aloud (slow Vietnamese voice) ================= */
let VOICE = null, AUD = null, readTok = 0;
const RATE = .75;
function findVoice() { try { const vs = speechSynthesis.getVoices().filter(v => /^vi/i.test(v.lang)); VOICE = vs.find(v => /HoaiMy|Hoai My|Linh|Google/i.test(v.name)) || vs[0] || null; } catch (e) { VOICE = null; } }
if ('speechSynthesis' in window) { findVoice(); try { speechSynthesis.addEventListener('voiceschanged', findVoice); } catch (e) { speechSynthesis.onvoiceschanged = findVoice; } }
function readMark(on) { const b = $('#pSpk'); if (b) b.classList.toggle('on', on); }
function stopRead() { readTok++; try { speechSynthesis.cancel(); } catch (e) {} if (AUD) { try { AUD.pause(); } catch (e) {} AUD = null; } readMark(false); }
function speechText(t) {
  return t.replace(/<[^>]+>/g, ' ').replace(/(\d)\s*[×x·]\s*(\d)/g, '$1 nhân $2').replace(/(\d)\s*[−-]\s*(\d)/g, '$1 trừ $2').replace(/−/g, ' trừ ')
    .replace(/\+/g, ' cộng ').replace(/=/g, ' bằng ').replace(/\?/g, '?').replace(/\s+/g, ' ').trim();
}
function chunks(t, max) {
  const out = []; let cur = '';
  for (const part of t.split(/(?<=[.!?;…])\s+/)) { if (!part.trim()) continue; if ((cur + ' ' + part).length > max && cur) { out.push(cur.trim()); cur = ''; } cur += ' ' + part; }
  if (cur.trim()) out.push(cur.trim()); return out;
}
let lastSay = '';
function speak(text, opts = {}) {
  if (!sndOn) return;
  stopRead(); const tok = ++readTok; if (!opts.quiet) { lastSay = text; readMark(true); }
  const done = () => { if (tok === readTok) readMark(false); };
  const t = speechText(text);
  if (VOICE) {
    const parts = chunks(t, 150);
    parts.forEach((x, k) => { const u = new SpeechSynthesisUtterance(x); u.voice = VOICE; u.lang = VOICE.lang; u.rate = RATE; u.pitch = 1.1; if (k === parts.length - 1) { u.onend = done; u.onerror = done; } speechSynthesis.speak(u); });
    return;
  }
  const parts = chunks(t, 180); let k = 0;
  const next = () => {
    if (tok !== readTok) return; if (k >= parts.length) return done();
    const a = new Audio('https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&ttsspeed=0.7&q=' + encodeURIComponent(parts[k++]));
    AUD = a; a.playbackRate = .88; a.preservesPitch = true;
    a.onended = () => setTimeout(next, 220); a.onerror = done; a.play().catch(done);
  };
  next();
}

/* ================= playing a level ================= */
const PRAISE = ['Giỏi quá!', 'Đúng rồi!', 'Tuyệt vời!', 'Con giỏi lắm!', 'Chính xác!'];
const RETRY = ['Chưa đúng rồi. Con thử lại nhé!', 'Con xem lại một chút nhé!', 'Gần đúng rồi, thử lại nào!'];
let P = null;   // current level
function startLevel(isle, i) {
  const is = ISLANDS[isle];
  const order = shuf(Array(QN).fill(0).map((_, k) => is.types[k % is.types.length]));
  P = { isle, i, is, order, q: 0, miss: 0, missQ: 0, busy: false };
  show('play'); $('#pTitle').textContent = `${is.name} · Màn ${i + 1}`;
  nextQ();
}
function dots() { $('#pDots').innerHTML = P.order.map((_, k) => `<i class="${k < P.q ? 'ok' : k === P.q ? 'cur' : ''}"></i>`).join(''); }
function nextQ() {
  if (P.q >= QN) return endLevel();
  P.missQ = 0; P.busy = false; dots();
  const type = P.order[P.q], A = ACTS[type], q = A.gen(P.i);
  const st = $('#pStage'); st.innerHTML = '';
  const api = P.api = {
    ok(node, why) {
      if (P.busy) return; P.busy = true;
      node && node.classList.add('right'); sfx.good(); burst(node || st, 34);
      const msg = pick1(PRAISE) + (why ? ' ' + why : '');
      toast(msg); speak(msg, { quiet: true });
      setTimeout(() => { P.q++; nextQ(); }, why ? 2600 : 1500);
    },
    good(node) { sfx.coin(); node && node.classList.add('right'); },
    bad(node) {
      if (P.busy) return; P.miss++; P.missQ++; sfx.bad();
      if (node) { node.classList.remove('shake'); void node.offsetWidth; node.classList.add('shake'); }
      const msg = P.missQ >= 2 ? 'Jenny gợi ý cho con nè!' : pick1(RETRY);
      toast(msg); speak(msg, { quiet: true });
      if (P.missQ >= 2 && api.hint) { const h = api.hint(); if (h) { h.classList.remove('hintme'); void h.offsetWidth; h.classList.add('hintme'); } }
    },
    hint: null
  };
  A.render(q, st, api);
  $('#pAsk').innerHTML = `<span>${esc(q.ask)}</span>`;
  P.say = q.say;
  requestAnimationFrame(() => { fitGroups(); fitAsk(); requestAnimationFrame(() => { fitGroups(); fitAsk(); }); });
  setTimeout(refit, 150);
  setTimeout(() => speak(q.say), 250);
}
function endLevel() {
  dots(); stopRead();
  const st = P.miss === 0 ? 3 : P.miss <= 2 ? 2 : 1, id = P.is.id + (P.i + 1), before = S.stars[id] || 0;
  S.stars[id] = Math.max(before, st);
  const gain = st * 5 + (st > before ? (st - before) * 5 : 0);
  S.xu += gain; S.grow++; S.plays++; save(); hud('#pXu,#pSt');
  sfx.good(); burst($('#pStage'), 60);
  const hasNext = P.i < 7;
  const msg = st === 3 ? 'Tuyệt vời! Con được 3 ngôi sao!' : st === 2 ? 'Giỏi lắm! Con được 2 ngôi sao!' : 'Con đã hoàn thành màn chơi!';
  speak(msg + ` Con nhận được ${gain} xu.`, { quiet: true });
  openOv(`<h2>${msg}</h2><div class="stars">${[0, 1, 2].map(k => starSvg(k < st)).join('')}</div>
    <p>Con nhận được <b>${gain} xu</b>. Cây và thú trong vườn lớn thêm một chút!</p>
    <div class="row">${hasNext ? '<button class="btn y" id="eNext" data-focus>Màn tiếp</button>' : ''}<button class="btn" id="eAgain">Chơi lại</button><button class="btn" id="eMap">Bản đồ</button></div>`, pn => {
    const go = (fn) => () => { closeOv(); fn(); };

    pn.querySelector('#eAgain').onclick = go(() => startLevel(P.isle, P.i));

/* size items inside each group so they fill the box without overflow */
let fitT = 0;
function refit() { cancelAnimationFrame(fitT); fitT = requestAnimationFrame(() => { fitGroups(); fitAsk(); }); }
if ('ResizeObserver' in window) new ResizeObserver(refit).observe(document.getElementById('pStage'));
function fitGroups() {
  document.querySelectorAll('#pStage .grp').forEach(g => {
    const n = g.children.length; if (!n) return;
    const cs = getComputedStyle(g), W = g.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), H = g.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    if (W <= 0 || H <= 0) return;
    const gap = Math.max(4, Math.min(W, H) * .04);
    let best = 0, bc = 1;
    const tall = H > W * 1.1, isLine = g.classList.contains('line'), isSeq = g.classList.contains('seq');
    const fixed = isSeq && !tall ? [n] : isLine ? [n, 1] : null;   // hàng xếp: 1 hàng ngang hoặc 1 cột, chọn cách cho hình to hơn
    for (const c of fixed || [...Array(n).keys()].map(x => x + 1)) { const r = Math.ceil(n / c), s = Math.min((W - gap * (c - 1)) / c, (H - gap * (r - 1)) / r); if (s > best) { best = s; bc = c; } }
    const cap = g.classList.contains('big') ? 170 : 130;
    g.style.setProperty('--s', Math.max(18, Math.min(cap, best)).toFixed(1) + 'px');
    g.style.gridTemplateColumns = `repeat(${bc}, var(--s))`; g.style.gap = gap.toFixed(1) + 'px';

}

/* ================= map ================= */
function lvUnlocked(is, i) { return islandOpen(is) && (i === 0 || (S.stars[is.id + i] || 0) > 0); }
function islandOpen(is) { return !is.need || totalStars(ISLANDS[ISLANDS.indexOf(is) - 1].id) >= is.need; }
function drawMap() {
  const is = ISLANDS[S.isle], open = islandOpen(is);
  $('#isName').innerHTML = `${is.name}<small>${is.sub} · ${totalStars(is.id)}/${is.lv.length * 3} sao</small>`;
  $('#isPrev').disabled = S.isle === 0; $('#isNext').disabled = S.isle === ISLANDS.length - 1;
  $('#isPrev').style.opacity = S.isle === 0 ? .35 : 1; $('#isNext').style.opacity = S.isle === ISLANDS.length - 1 ? .35 : 1;
  const box = $('#mapbox'), W = Math.max(box.clientWidth, 10), H = Math.max(box.clientHeight, 10);
  const NN = is.lv.length, wide = W / H > 1.15, cols = wide ? 5 : 2, rows = Math.ceil(NN / cols);
  const cw = W / cols, ch = H / rows, R = Math.max(12, Math.min(cw, ch) * .27);
  const pts = [];
  for (let i = 0; i < NN; i++) {
    const row = Math.floor(i / cols), k = i % cols, col = row % 2 ? cols - 1 - k : k;
    const wob = ((i * 37) % 7 - 3) / 3 * ch * .08;
    pts.push([cw * (col + .5), H - ch * (row + .5) + wob]);
  }
  let path = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < NN; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; const mx = (x0 + x1) / 2, my = (y0 + y1) / 2; path += ` Q${x0 === x1 ? x0 + (Math.floor(i / cols) % 2 ? -cw * .45 : cw * .45) : mx} ${y0 === y1 ? my : my} ${x1} ${y1}`; }
  // decorations: trees and rocks scattered with fixed positions

  for (let k = 0; k < 14; k++) {
    const x = ((k * 97 + 13) % 100) / 100 * W, y = ((k * 61 + 29) % 100) / 100 * H, s = Math.min(cw, ch) * .16;
    if (pts.some(([px, py]) => Math.hypot(px - x, py - y) < R * 1.9)) continue;
    deco += k % 3 ? `<g transform="translate(${x} ${y}) scale(${s / 10})"><path d="M-1.5 9v-6h3v6z" fill="#A9764E" ${S2} stroke-width=".8"/><circle cy="-1" r="6" fill="${['#F2A93B', '#2DBE8C', '#2F7DE1', '#FF6B57', '#8E6BD8', '#2DBE8C'][S.isle % 6]}" ${S2} stroke-width=".8"/></g>`
      : `<g transform="translate(${x} ${y}) scale(${s / 10})"><path d="M-7 5c0-6 4-9 7-9s7 3 7 9z" fill="#C9D3E2" ${S2} stroke-width=".8"/></g>`;
  }
  const next = is.lv.findIndex((_, i) => !(S.stars[is.id + (i + 1)] > 0));
  let nodes = '';
  pts.forEach(([x, y], i) => {
    const id = is.id + (i + 1), st = S.stars[id] || 0, unl = lvUnlocked(is, i), lv = is.lv[i][0];
    const face = !unl ? '#D6DEEA' : st ? '#FFC93C' : '#fff', ringC = ['#2DBE8C', '#2F7DE1', '#8E6BD8'][lv];
    const sr = R * .34;
    const stars = unl ? [0, 1, 2].map(k => `<path transform="translate(${x + (k - 1) * sr * 2.1} ${y + R + sr * 1.1}) scale(${sr / 10})" d="M0 -10l2.9 6.2 6.6.7-5 4.5 1.4 6.6L0 4.7l-5.9 3.3 1.4-6.6-5-4.5 6.6-.7z" fill="${k < st ? '#FFC93C' : '#fff'}" stroke="#1D2B53" stroke-width="1.6" stroke-linejoin="round"/>`).join('') : '';
    nodes += `<g class="node" tabindex="0" role="button" data-n="${i}" aria-label="Màn ${i + 1}${unl ? ', ' + st + ' sao' : ', đang khoá'}">
      ${i === next && unl ? `<circle class="ring" cx="${x}" cy="${y}" r="${R * 1.12}" fill="none" stroke="#FFC93C" stroke-width="${R * .22}"/>` : ''}
      <circle cx="${x}" cy="${y + R * .12}" r="${R}" fill="#1D2B53"/>

      ${stars}</g>`;
  });
  const jx = next >= 0 && open ? pts[next] : null;
  const jen = jx ? `<g transform="translate(${jx[0] - R * .95} ${jx[1] - R * 3.15}) scale(${R / 62})" pointer-events="none">${I.jenny.replace(/<svg[^>]*>/, '').replace('</svg>', '')}</g>` : '';
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" aria-label="Bản đồ ${is.name}">

    <path d="${path}" fill="none" stroke="#B8C6DD" stroke-width="${R * .12}" stroke-dasharray="${R * .3} ${R * .35}" stroke-linecap="round"/>

      <g transform="translate(${W / 2} ${H / 2})"><rect x="${-Math.min(W * .45, 210)}" y="-46" width="${Math.min(W * .9, 420)}" height="92" rx="18" fill="#fff" stroke="#1D2B53" stroke-width="3"/>
      <text text-anchor="middle" y="-8" font-family="Baloo 2, sans-serif" font-weight="800" font-size="22" fill="#1D2B53">Đảo đang khoá</text>

  </svg>`;
  box.querySelectorAll('.node').forEach(n => { n.onclick = () => openLevel(+n.dataset.n); n.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLevel(+n.dataset.n); } }; });
}
$('#isPrev').onclick = () => { if (S.isle > 0) { S.isle--; save(); sfx.tap(); drawMap(); } };

function openLevel(i) {

/* ================= garden ================= */
function petMood(p) { if (!p.fed) return 'sad'; const gap = dayNum(today()) - dayNum(p.fed); return gap === 0 ? 'happy' : gap === 1 ? 'hungry' : 'sad'; }

  let n = 0;
  S.plots.forEach(p => { if (p && S.grow - p.at >= PLANTS[p.k].need) n++; });
  S.pens.forEach(p => { if (p && p.fedAt != null && !p.got && S.grow - p.fedAt >= ANIMALS[p.k].need) n++; });
  return n;
}
function drawGarden() {
  const sc = $('#scene');
  const deco = DECO_ORDER.map(k => `<div title="${DECOS[k].name}">${S.deco[k] ? DECOS[k].svg : `<span class="slot">${DECOS[k].svg}</span>`}</div>`).join('');
  const plots = S.plots.map((p, i) => {
    if (!p) return `<button class="plot" data-p="${i}" aria-label="Ô đất trống, bấm để trồng cây"><span class="plus">+</span></button>`;
    const P = PLANTS[p.k], g = Math.min(P.need, S.grow - p.at), ripe = g >= P.need, stage = ripe ? 3 : g === 0 ? 0 : g / P.need < .5 ? 1 : 2;
    return `<button class="plot${ripe ? ' ripe' : ''}" data-p="${i}" aria-label="${P.name}${ripe ? ' đã chín, bấm để thu hoạch' : ', còn ' + (P.need - g) + ' màn chơi nữa'}">${plantSvg(p.k, stage)}${ripe ? '' : `<span class="bar2"><i style="width:${g / P.need * 100}%"></i></span>`}</button>`;
  }).join('');
  const pens = S.pens.map((p, i) => {
    if (!p) return `<button class="pen" data-n="${i}" aria-label="Chuồng trống, bấm để mua con vật" style="grid-template-columns:1fr"><span class="plus" style="color:#C9A86A">+</span></button>`;
    const A = ANIMALS[p.k], mood = petMood(p), fedToday = p.fed === today();
    const ready = p.fedAt != null && !p.got && S.grow - p.fedAt >= A.need;
    let side;
    if (ready) side = `<span class="prod">${PROD[p.k]}</span><span>Thu ${A.prod.toLowerCase()}</span>`;
    else if (!fedToday) side = `<span class="hungry">Đói</span><span>Cho ăn 10${I.coin}</span>`;
    else if (p.got) side = `<span>${I.check}</span><span>Mai cho ăn tiếp</span>`;
    else { const g = Math.min(A.need, S.grow - p.fedAt); side = `<span>${PROD[p.k]}</span><span>${g}/${A.need} màn</span>`; }
    return `<button class="pen${ready ? ' ripe' : ''}" data-n="${i}" aria-label="${A.name}"><span class="ani">${animalSvg(p.k, mood === 'happy' ? 'happy' : mood === 'sad' ? 'sad' : 'ok')}</span><span class="side">${side}</span></button>`;
  }).join('');
  sc.innerHTML = `<div class="deco">${deco}</div><div class="plots">${plots}</div><div class="pens">${pens}</div>`;
  sc.querySelectorAll('.plot').forEach(b => b.onclick = () => tapPlot(+b.dataset.p, b));
  sc.querySelectorAll('.pen').forEach(b => b.onclick = () => tapPen(+b.dataset.n, b));
  const ready = gardenReady();
  $('#ginfo').innerHTML = ready ? `Có <b>${ready}</b> thứ đã sẵn sàng để thu hoạch!` : 'Mỗi màn con chơi xong giúp cây và thú lớn thêm. Thú cần cho ăn mỗi ngày.';
  hud();
}
function tapPlot(i, el) {
  const p = S.plots[i];
  if (!p) {
    openOv(`<h2>Trồng cây</h2><p>Chọn hạt giống. Cây lớn lên khi con <b>chơi xong các màn</b>. Chín rồi bán lấy xu.</p>
      <div class="shopgrid">${Object.entries(PLANTS).map(([k, P]) => `<button class="item" data-k="${k}" ${S.xu < P.cost ? 'disabled' : ''}>${plantSvg(k, 3).replace('<svg', '<svg class="pic"')}<b>${P.name}</b><span class="price">${P.cost}${I.coin}</span><span>${P.need} bài · bán ${P.sell}</span></button>`).join('')}</div>
      <div class="row"><button class="btn" id="cl">Đóng</button></div>`, pn => {
      pn.querySelector('#cl').onclick = closeOv;
      pn.querySelectorAll('.item').forEach(b => b.onclick = () => { const P = PLANTS[b.dataset.k]; if (S.xu < P.cost) return; S.xu -= P.cost; S.plots[i] = { k: b.dataset.k, at: S.grow }; save(); sfx.coin(); closeOv(); drawGarden(); toast(`Đã trồng ${P.name}. Chơi ${P.need} màn để cây chín!`); });
    });
    return;
  }
  const P = PLANTS[p.k], g = S.grow - p.at;
  if (g >= P.need) { S.xu += P.sell; S.plots[i] = null; save(); sfx.coin(); burst(el, 24); drawGarden(); hud('#pXu'); toast(`Thu hoạch ${P.name}: +${P.sell} xu`); }
  else toast(`${P.name} cần thêm ${P.need - g} màn chơi nữa`);
}
function tapPen(i, el) {
  const p = S.pens[i];
  if (!p) { openShop('ani'); return; }
  const A = ANIMALS[p.k];
  if (p.fedAt != null && !p.got && S.grow - p.fedAt >= A.need) { p.got = 1; S.xu += A.sell; save(); sfx.coin(); burst(el, 20); drawGarden(); hud('#pXu'); toast(`Thu ${A.prod.toLowerCase()}: +${A.sell} xu`); return; }
  if (p.fed !== today()) {
    if (S.xu < 10) { toast('Cần 10 xu để mua thức ăn. Chơi thêm màn để kiếm xu nhé!'); return; }
    S.xu -= 10; p.fed = today(); p.fedAt = S.grow; p.got = 0; save(); sfx.tap(); drawGarden(); hud('#pXu');
    toast(`${A.name} no rồi! Chơi ${A.need} màn để thu ${A.prod.toLowerCase()}.`); return;
  }
  toast(p.got ? `${A.name} đã cho ${A.prod.toLowerCase()} hôm nay. Mai cho ăn tiếp nhé!` : `${A.name} cần thêm ${A.need - (S.grow - p.fedAt)} màn chơi nữa`);
}
let shopTab = 'ani';
function openShop(tab) {
  shopTab = tab || shopTab;
  const items = shopTab === 'ani'
    ? Object.entries(ANIMALS).map(([k, A]) => { const full = !S.pens.includes(null); return `<button class="item" data-k="${k}" ${S.xu < A.cost || full ? 'disabled' : ''}>${animalSvg(k, 'happy').replace('<svg', '<svg class="pic"')}<b>${A.name}</b><span class="price">${A.cost}${I.coin}</span><span>Cho ${A.prod.toLowerCase()}: ${A.sell} xu</span></button>`; }).join('')
    : DECO_ORDER.map(k => { const D = DECOS[k], own = S.deco[k]; return `<button class="item${own ? ' own' : ''}" data-k="${k}" ${own || S.xu < D.cost ? 'disabled' : ''}>${D.svg.replace('<svg', '<svg class="pic"')}<b>${D.name}</b><span class="price">${own ? 'Đã có' : D.cost + I.coin}</span></button>`; }).join('');
  openOv(`<h2>Cửa hàng của Jenny</h2>
    <div class="stabs"><button aria-pressed="${shopTab === 'ani'}" data-t="ani">Con vật</button><button aria-pressed="${shopTab === 'deco'}" data-t="deco">Trang trí</button></div>
    <div class="shopgrid">${items}</div>
    <p style="font-size:13.5px">${shopTab === 'ani' ? 'Vườn có 3 chuồng. Thú cần ăn mỗi ngày (10 xu).' : 'Đồ trang trí làm vườn đẹp hơn.'} Con đang có <b>${S.xu} xu</b>.</p>
    <div class="row"><button class="btn" id="cl">Đóng</button></div>`, pn => {
    pn.querySelector('#cl').onclick = closeOv;
    pn.querySelectorAll('.stabs button').forEach(b => b.onclick = () => { sfx.tap(); openShop(b.dataset.t); });
    pn.querySelectorAll('.item').forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      if (shopTab === 'ani') { const A = ANIMALS[k], slot = S.pens.indexOf(null); if (slot < 0 || S.xu < A.cost) return; S.xu -= A.cost; S.pens[slot] = { k, fed: null, fedAt: null, got: 0 }; toast(`Chào mừng ${A.name} về vườn! Nhớ cho ăn nhé.`); }
      else { const D = DECOS[k]; if (S.deco[k] || S.xu < D.cost) return; S.xu -= D.cost; S.deco[k] = 1; toast(`Đã đặt ${D.name} vào vườn!`); }
      save(); sfx.coin(); closeOv(); drawGarden(); hud('#pXu');
    });
  });
}
$('#bShop').onclick = () => { sfx.tap(); openShop(); };

/* ================= settings / backup ================= */
function backupCode() { return 'JNY1:' + btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
$('#bSet').onclick = () => {
  sfx.tap();
  openOv(`<h2>Tiến độ của bé</h2>
    <div class="kv"><div><b>${S.plays}</b><span>Màn đã chơi</span></div><div><b>${totalStars()}/${MAXST}</b><span>Sao trên bản đồ</span></div><div><b>${S.xu}</b><span>Xu</span></div></div>
    <p style="font-size:13.5px"><b>Mã sao lưu:</b> chép mã này để chơi tiếp trên máy khác.</p>
    <textarea class="code" id="bk" readonly>${backupCode()}</textarea>
    <div class="row"><button class="btn" id="cp">Chép mã</button><button class="btn" id="rs">Dán mã khôi phục</button></div>
    <div class="row"><button class="btn y" id="cl" data-focus>Đóng</button></div>`, pn => {
    pn.querySelector('#cl').onclick = closeOv;
    pn.querySelector('#cp').onclick = () => { const t = pn.querySelector('#bk'); t.select(); try { navigator.clipboard.writeText(t.value).then(() => toast('Đã chép mã sao lưu'), () => document.execCommand('copy')); } catch (e) { document.execCommand('copy'); toast('Đã chép mã sao lưu'); } };
    pn.querySelector('#rs').onclick = () => {
      const t = pn.querySelector('#bk'); t.readOnly = false; t.value = ''; t.placeholder = 'Dán mã sao lưu vào đây'; t.focus();
      const b = pn.querySelector('#rs'); b.textContent = 'Khôi phục'; b.classList.add('y');
      b.onclick = () => {
        try { const v = t.value.trim(); if (!v.startsWith('JNY1:')) throw 0; const o = JSON.parse(decodeURIComponent(escape(atob(v.slice(5))))); if (!o.saga || !o.mn) throw 0;
          S = Object.assign(fresh(), o); save(); closeOv(); hud(); show('map'); toast('Đã khôi phục tiến độ!'); }
        catch (e) { toast('Mã sao lưu không đúng'); }
      };
    };
  });
};
$('#bSnd').onclick = () => { sndOn = !sndOn; $('#bSnd').classList.toggle('off', !sndOn); if (!sndOn) stopRead(); };

/* ================= boot ================= */
paintIcons();
hud();
addEventListener('resize', () => { if (view === 'map') drawMap(); if (view === 'play') { fitGroups(); fitAsk(); } fitPanel(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (view === 'map') drawMap(); if (view === 'play') { fitGroups(); fitAsk(); } });
show('map');
window.__mn = { test(type, lv) { startLevel(0, lv || 0); P.order = Array(QN).fill(type); P.q = 0; nextQ(); }, get S() { return S; }, set S(v) { S = v; }, show, save, startLevel, ACTS, get P() { return P; }, drawGarden, fitGroups };
})();
</script>
