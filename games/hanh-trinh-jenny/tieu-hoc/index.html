<style>
/* Riêng bản tiểu học: bài chọn 1 trong 3, hình minh hoạ, nút Đọc đề, chọn lớp */
.mtext .fig{flex:1 1 0;min-height:110px;position:relative}
.mtext .fig svg{position:absolute;inset:0;width:100%;height:100%}
.mtext .q{flex:none}
.mtext .sol{flex:none}
.mhead .read{border:2.5px solid var(--ink);border-radius:999px;background:var(--sel);color:#fff;padding:4px 12px 4px 6px;font-weight:900;font-size:15px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--ink)}
.mhead .read svg{width:24px;height:24px;background:#fff;border-radius:50%;padding:3px;color:var(--ink)}
.mhead .read.on{background:var(--coral);animation:pulse2 1.2s ease-in-out infinite}
@keyframes pulse2{50%{box-shadow:0 3px 0 var(--ink),0 0 0 6px rgba(255,107,87,.3)}}
.mhead .read:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.opts{display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:8px;min-height:0}
.opt{border:2.5px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 3px 0 var(--ink);display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;gap:6px;padding:6px 10px;min-height:0;font-weight:900;font-size:19px;text-align:left}
.opt .no{width:30px;height:30px;border-radius:50%;background:var(--sun);border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:17px}
.opt .ob{height:100%;min-height:0;position:relative;display:flex;align-items:center}
.opt .ob svg{position:absolute;inset:0;width:100%;height:100%}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.opt.no-go{opacity:.35;background:#EEF1F6}
.opt.right{background:var(--mint-soft);border-color:var(--mint)}
.opt.wrong{background:#FFE1DC;border-color:var(--coral)}
.mpad.pick .ans,.mpad.pick #bClr{display:none}
.mpad.pick{grid-template-rows:auto minmax(0,1fr) auto}
@media (max-aspect-ratio:1/1){ .mtext .fig{min-height:150px} }
@media (max-height:520px){ .mtext .fig{min-height:80px} }
.grades{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grades button{border:3px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--ink);padding:14px 8px;font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1}
.grades button small{display:block;font-family:var(--body);font-size:13px;color:var(--ink-soft)}
.grades button[aria-pressed="true"]{background:var(--sun)}
@media (max-aspect-ratio:1/1){
  .opts{grid-column:1/-1;grid-template-rows:none;grid-template-columns:repeat(3,minmax(0,1fr));height:100px}
  .opt{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);justify-items:center;text-align:center;font-size:15px;padding:4px}
  .opt .no{width:24px;height:24px;font-size:14px}
  .opt .ob{width:100%;justify-content:center}
  .mpad.pick{grid-template-columns:1fr}
}
@media (max-height:520px){
  .jrow{display:none}
  .mpad,.mpad.pick{grid-template-rows:auto auto minmax(0,1fr)}
  .mpad.pick{grid-template-rows:auto minmax(0,1fr)}
}
</style>
</head>

<div class="app" id="app">
  <header class="bar">
    <a href="../../../" title="Về trang chủ" style="display:contents"><img class="logo" src="../../../assets/jenny-logo.png" alt="Học Toán cùng Jenny"></a>
    <div class="ttl">Hành trình của Jenny<small id="gradeSub">Tiểu học · Toán tư duy</small></div>
    <div class="spacer"></div>
    <div class="pill" id="pEn" title="Năng lượng: mỗi màn chơi tốn 1"><span data-i="bolt"></span><b id="vEn">0</b><small>/10</small></div>

<script>
/* Cấu hình bản tiểu học cho ../_saga/saga.js (khoá lưu cũ: jenny-saga-th). Mức tiểu học: game Bebras mở với ?kid=1 */
const SAGA = {
  key: 'jenny-saga-th', back: '../../hanh-trinh-jenny/tieu-hoc/', colsTall: 2, query: 'kid=1&', fresh: { g: null },
  islands: [
  { id: 'r', name: 'Đảo Rô bốt', sub: 'Lập trình rô bốt', color: '#BFE7C9', edge: '#7CC79A', url: '../../tu-duy-bebras/robot-tim-duong/', need: 0,
    lv: [[0, 0, 11], [0, 0, 10], [0, 0, 1], [0, 0, 23], [1, 0, 7], [1, 0, 19], [1, 0, 13], [1, 0, 8], [2, 0, 24], [2, 0, 18]] },
  { id: 'b', name: 'Đảo Ống Bi', sub: 'Xếp bi cùng màu', color: '#DCEBFF', edge: '#8FBDF0', url: '../../tu-duy-bebras/xep-ong-bi/', need: 15,
    lv: [[0, 0, 4], [0, 0, 18], [0, 0, 10], [0, 0, 8], [1, 0, 6], [1, 0, 3], [1, 0, 23], [1, 0, 20], [2, 0, 12], [2, 0, 16]] },
  { id: 'c', name: 'Đảo Chồng Hình', sub: 'Chồng hai tấm hình', color: '#FFE3A8', edge: '#E8B85C', url: '../../tu-duy-bebras/chong-hinh/', need: 15,
    lv: [[0, 0, 15], [0, 0, 3], [0, 0, 19], [0, 0, 13], [1, 0, 1], [1, 0, 18], [1, 0, 5], [1, 0, 10], [2, 0, 15], [2, 0, 22]] },
  { id: 'g', name: 'Đảo Mật Thư', sub: 'Giải mã lá thư', color: '#EADCFB', edge: '#B79BE6', url: '../../tu-duy-bebras/giai-ma-thu/', need: 15,
    lv: [[0, 0, 4], [0, 0, 14], [0, 0, 6], [0, 0, 5], [1, 0, 8], [1, 0, 16], [1, 0, 4], [1, 0, 15], [2, 0, 8], [2, 0, 20]] }
]
};
</script>

<script>
'use strict';
const GRADES = { '12': 'Lớp 1–2', '34': 'Lớp 3–4' };

/* ================= math station ================= */
let typed = '', tries = 0, answered = false, gone = [];
const mine = () => BANK.filter(p => p.g === S.g);
function pick(d) {
  const all = mine().filter(p => p.d === d), cur = S.cur && S.cur.id;
  const pool = all.filter(p => !S.solved[p.i] && p.i !== cur);
  const fresh2 = pool.filter(p => !S.miss[p.i]);
  const from = fresh2.length ? fresh2 : pool.length ? pool : all.filter(p => p.i !== cur);
  return (from.length ? from : all)[Math.floor(Math.random() * (from.length || all.length))].i;
}
function current() { let p = S.cur && BANK.find(x => x.i === S.cur.id); if (!p || p.d !== S.diff || p.g !== S.g) { S.cur = { id: pick(S.diff) }; save(); p = BANK.find(x => x.i === S.cur.id); } return p; }
const optHtml = o => /^\s*<svg/.test(o) ? o : `<span>${esc(o)}</span>`;
function drawMath() {
  if (!BANK || !S.g) return; rollDay();
  $('#seg').innerHTML = DIFF.map((n, d) => `<button aria-pressed="${S.diff === d}" data-d="${d}">${n} · ${XU[d]}${I.coin}</button>`).join('');
  $('#seg').querySelectorAll('button').forEach(b => b.onclick = () => { if (+b.dataset.d === S.diff) return; sfx.tap(); S.diff = +b.dataset.d; S.cur = null; resetAnswer(); save(); drawMath(); });
  $('#today').innerHTML = `Hôm nay ${S.dayXu}/${DAY_XU}${I.coin}`;
  const p = current();
  const right = p.k === 'pick' ? 'Đáp án đúng là số ' + (p.n + 1) : 'Đáp số là ' + p.a;
  const solTxt = answered ? `<div class="sol${S.cur.ok ? '' : ' bad'}"><b class="h">${S.cur.ok ? 'Đúng rồi! ' : right + '. '}Cùng xem lời giải:</b>${esc(p.s)}</div>` : '';
  $('#mtext').className = 'mtext' + (answered ? ' solved' : '');
  $('#vMath').classList.toggle('answered', answered);
  $('#mtext').innerHTML = `<div class="q">${esc(p.q)}</div>${p.f ? `<div class="fig">${p.f}</div>` : ''}${answered ? '<button class="qbtn" id="qbtn">Xem lại đề</button>' : ''}${solTxt}`;
  const qb = $('#qbtn'); if (qb) qb.onclick = () => { const m = $('#mtext'), on = m.classList.toggle('showq'); qb.textContent = on ? 'Xem lời giải' : 'Xem lại đề'; fitText(true); };
  $('.mpad').classList.toggle('pick', p.k === 'pick');
  drawKeys(p); drawAns(); fitText();
  if (!answered && !$('#say').innerHTML) say('Giải đúng để nhận <b>xu</b> và <b>năng lượng</b> nhé!');
}
function drawKeys(p) {
  const k = $('#keys');
  k.classList.toggle('done', answered);
  k.className = answered ? 'keys done' : p.k === 'pick' ? 'opts' : 'keys';
  if (answered) {
    k.innerHTML = `<button class="key go next" id="kNext" style="grid-column:1/-1">Bài tiếp theo ${I.right}</button>`; k.querySelector('#kNext').onclick = nextProblem; return;
  }
  if (p.k === 'pick') {
    k.innerHTML = p.o.map((o, i) => `<button class="opt${gone.includes(i) ? ' no-go' : ''}" data-o="${i}" ${gone.includes(i) ? 'disabled' : ''} aria-label="Lựa chọn ${i + 1}"><span class="no">${i + 1}</span><span class="ob">${optHtml(o)}</span></button>`).join('');
    k.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.o, b));
    return;
  }
  k.innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="key" data-k="${n}">${n}</button>`).join('')
    + `<button class="key" data-k="del" aria-label="Xoá">${I.back}</button><button class="key" data-k="0">0</button><button class="key go" data-k="ok" aria-label="Kiểm tra">${I.check}</button>`;
  k.querySelectorAll('.key').forEach(b => b.onclick = () => press(b.dataset.k));
}
function drawAns(cls) { const a = $('#ans'); a.textContent = typed || '?'; a.className = 'ans' + (typed ? '' : ' empty') + (cls ? ' ' + cls : ''); }
function resetAnswer() { typed = ''; tries = 0; answered = false; gone = []; }
function press(k) {
  if (answered || current().k === 'pick') return;
  if (k === 'ok') return check();
  if (k === 'del') typed = typed.slice(0, -1);
  else if (typed.length < 5) typed = (typed === '0' ? '' : typed) + k;
  sfx.tap(); drawAns();
}
function win(p, el) {
  answered = true; S.cur.ok = true;
  const first = !S.solved[p.i]; S.solved[p.i] = 1; delete S.miss[p.i]; S.right++; S.grow++;
  let gain = 0, en = 0;
  if (first) { gain = Math.min(tries ? Math.round(XU[p.d] / 2) : XU[p.d], Math.max(0, DAY_XU - S.dayXu)); en = Math.min(EN[p.d], EN_MAX - S.en); }
  S.xu += gain; S.dayXu += gain; S.en += en; save();
  sfx.good(); burst(el);
  const parts2 = []; if (gain) parts2.push(`+${gain} xu`); if (en) parts2.push(`+${en} năng lượng`);
  say(first ? (parts2.length ? `Giỏi quá! Em được <b>${parts2.join(', ')}</b>.` : 'Đúng rồi! Hôm nay em đã nhận đủ xu rồi.') + ' Cây và thú trong vườn lớn thêm một chút!' : 'Đúng rồi! (Bài này em đã giải trước đây nên không nhận thêm xu.)', 'happy');
  hud('#pXu,#pEn'); drawMath();
}
function lose(p) {
  answered = true; S.cur.ok = false; S.miss[p.i] = (S.miss[p.i] || 0) + 1; save();
  sfx.bad(); say('Không sao! Em đọc lời giải rồi làm bài khác nhé.', 'oops');
  drawMath();
}
let lockUntil = 0;
function choose(i, el) {
  const p = current(); if (answered || gone.includes(i) || Date.now() < lockUntil) return;
  rollDay();
  if (i === p.n) { el.classList.add('right'); return win(p, el); }
  tries++; S.wrong++; gone.push(i); el.classList.add('wrong'); lockUntil = Date.now() + 600;
  if (tries < 2) { sfx.bad(); save(); say('Chưa đúng. Em xem lại và chọn <b>thêm 1 lần</b> nhé!', 'oops'); setTimeout(() => { if (!answered) drawKeys(p); }, 450); return; }
  lose(p);
}
function check() {
  if (!typed) { say('Em gõ đáp số trước rồi bấm ✓ nhé.'); return; }
  const p = current(), v = parseInt(typed, 10);
  rollDay();
  if (v === p.a) { win(p, $('#ans')); drawAns('ok'); return; }
  tries++; S.wrong++;
  if (tries < 2) { sfx.bad(); save(); drawAns('no'); say('Chưa đúng. Em đọc lại đề và thử <b>thêm 1 lần</b> nhé!', 'oops'); typed = ''; setTimeout(() => drawAns(), 450); return; }
  lose(p); drawAns('no');
}
function nextProblem() { sfx.tap(); stopRead(); resetAnswer(); S.cur = { id: pick(S.diff) }; save(); say('Bài mới đây! Cố lên em.'); drawMath(); }
$('#bSkip').onclick = () => { if (!BANK) return; nextProblem(); };
$('#bClr').onclick = () => press('del');
addEventListener('keydown', e => {
  if (view !== 'math' || !$('#ov').hidden || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || !BANK || !S.g) return;
  const p = current();
  if (p.k === 'pick' && !answered && /^[1-3]$/.test(e.key)) { const b = document.querySelector(`.opt[data-o="${+e.key - 1}"]`); if (b && !b.disabled) b.click(); e.preventDefault(); return; }
  if (/^[0-9]$/.test(e.key)) { press(e.key); e.preventDefault(); }
  else if (e.key === 'Backspace') { press('del'); e.preventDefault(); }
  else if (e.key === 'Enter') { answered ? nextProblem() : p.k === 'pick' ? 0 : check(); e.preventDefault(); }
});
function fitText(keepFold) {
  const m = $('#mtext'); if (!m || view !== 'math') return;
  if (!keepFold) m.classList.remove('fold', 'showq'); m.classList.remove('scroll');
  const over = () => m.scrollHeight > m.clientHeight + 1;
  const shrink = min => { let fs = innerHeight < 520 ? 18 : 24; m.style.fontSize = fs + 'px'; while (over() && fs > min) { fs -= .5; m.style.fontSize = fs + 'px'; } };
  shrink(m.classList.contains('fold') ? 11 : 14);
  if (over() && answered && !m.classList.contains('fold')) { m.classList.add('fold'); shrink(11); }
  else if (over()) shrink(11);
  if (over()) m.classList.add('scroll');
}

/* read aloud: slow, child-friendly Vietnamese voice.
   1) the device's own Vietnamese voice (iPhone/iPad/Mac "Linh", Android Google, Windows Edge "HoaiMy"...)
   2) if the device has none: Google's online Vietnamese voice, played as audio. */
let VOICE = null, AUD = null, readTok = 0;
const RATE = .78;
function findVoice() {
  try {
    const vs = speechSynthesis.getVoices().filter(v => /^vi/i.test(v.lang));
    VOICE = vs.find(v => /HoaiMy|Hoai My|Linh|Google/i.test(v.name)) || vs[0] || null;
  } catch (e) { VOICE = null; }
}
if ('speechSynthesis' in window) { findVoice(); try { speechSynthesis.addEventListener('voiceschanged', findVoice); } catch (e) { speechSynthesis.onvoiceschanged = findVoice; } }
function readMark(on) { const b = $('#bRead'); b.classList.toggle('on', on); $('#bReadT').textContent = on ? 'Dừng đọc' : 'Đọc đề'; }
function stopRead() {
  readTok++;
  try { speechSynthesis.cancel(); } catch (e) {}
  if (AUD) { try { AUD.pause(); } catch (e) {} AUD = null; }
  readMark(false);
}
/* turn maths symbols into words and split into short sentences */
function speechText(t) {
  return t.replace(/(\d)\s*[×x·]\s*(\d)/g, '$1 nhân $2').replace(/×/g, ' nhân ')
    .replace(/(\d)\s*:\s*(\d)/g, '$1 chia $2')
    .replace(/(\d)\s*[−-]\s*(\d)/g, '$1 trừ $2').replace(/−/g, ' trừ ')
    .replace(/\+/g, ' cộng ').replace(/=/g, ' bằng ').replace(/</g, ' bé hơn ').replace(/>/g, ' lớn hơn ')
    .replace(/(\d+)\s*cm\b/g, '$1 xăng-ti-mét').replace(/(\d+)\s*m\b/g, '$1 mét').replace(/(\d+)\s*kg\b/g, '$1 ki-lô-gam')
    .replace(/[“”"«»]/g, '').replace(/\s+/g, ' ').trim();
}
function chunks(t, max) {
  const out = []; let cur = '';
  for (const part of t.split(/(?<=[.!?;:…])\s+|\n+/)) {
    if (!part.trim()) continue;
    if ((cur + ' ' + part).length > max && cur) { out.push(cur.trim()); cur = ''; }
    if (part.length > max) { part.split(/(?<=,)\s+/).forEach(x => { if ((cur + ' ' + x).length > max && cur) { out.push(cur.trim()); cur = ''; } cur += ' ' + x; }); }
    else cur += ' ' + part;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}
function speak(text) {
  stopRead(); const tok = ++readTok; readMark(true);
  const done = () => { if (tok === readTok) readMark(false); };
  const t = speechText(text);
  if (VOICE) {
    const parts = chunks(t, 160);
    parts.forEach((x, k) => {
      const u = new SpeechSynthesisUtterance(x); u.voice = VOICE; u.lang = VOICE.lang; u.rate = RATE; u.pitch = 1.05;
      if (k === parts.length - 1) { u.onend = done; u.onerror = done; }
      speechSynthesis.speak(u);
    });
    return;
  }
  /* Không còn giọng Google (translate_tts) — nội dung câu không gửi ra ngoài (P-08). */
  done(); toast('Máy này chưa có giọng đọc tiếng Việt. Em nhờ bố mẹ bật giọng tiếng Việt trong phần cài đặt máy nhé!');
}
$('#bRead').onclick = () => {
  if (!BANK || !S.g) return;
  if ($('#bRead').classList.contains('on')) { stopRead(); return; }
  const p = current(); let t = p.q;
  if (p.k === 'pick') t += p.o.every(o => !/^\s*<svg/.test(o)) ? ' ' + p.o.map((o, i) => `Số ${i + 1}: ${o}.`).join(' ') : ' Em hãy chọn hình số 1, số 2 hoặc số 3.';
  else if (!answered) t += ' Em hãy điền số vào ô trả lời.';
  if (answered) t = p.s;
  speak(t);
};

/* nhắc nghỉ mắt sau 25 phút chơi liên tục (trang đang mở) */
(() => { let used = 0, last = Date.now(), shown = false;
  setInterval(() => { const now = Date.now(); if (!document.hidden) used += now - last; last = now;
    if (!shown && used > 25 * 60e3 && $('#ov').hidden) { shown = true;
      openOv(`${I.jenny}<h2>Em đã chơi 25 phút rồi!</h2><p>Nghỉ mắt một chút nhé: nhìn ra xa, uống nước, vươn vai rồi chơi tiếp.</p><div class="row"><button class="btn y" id="rOk" data-focus>Em nghỉ một chút</button></div>`, pn => { pn.querySelector('#rOk').onclick = closeOv; }); }
  }, 10000);
})();

/* grade choice */
function askGrade(first) {
  openOv(`<h2>${first ? 'Em học lớp mấy?' : 'Đổi lớp'}</h2><p>Trạm toán sẽ ra bài đúng với lớp của em. Bản đồ và vườn vẫn giữ nguyên.</p>
    <div class="grades">${Object.entries(GRADES).map(([g, n]) => `<button data-g="${g}" aria-pressed="${S.g === g}">${n}<small>${g === '12' ? 'Toán tư duy lớp 1–2' : 'Toán tư duy lớp 3–4'}</small></button>`).join('')}</div>`, pn => {
    pn.querySelectorAll('.grades button').forEach(b => b.onclick = () => {
      sfx.tap(); const changed = S.g !== b.dataset.g; S.g = b.dataset.g; if (changed) { S.cur = null; resetAnswer(); } save(); closeOv(); gradeSub(); if (view === 'math') drawMath();
    });
  });
}
function gradeSub() { $('#gradeSub').textContent = (S.g ? GRADES[S.g] : 'Tiểu học') + ' · Toán tư duy'; }

/* móc vào phần chung: dừng đọc khi rời Trạm toán, hỏi lớp trước khi vào Trạm toán, nút Đổi lớp trong bảng tiến độ */
Object.assign(SAGA, {
  onShow: v => { if (v !== 'math') stopRead(); },
  beforeTab: v => { if (v === 'math' && !S.g) { askGrade(true); return true; } },
  setRow: () => `<div class="row"><button class="btn" id="chg">Đổi lớp (đang chọn: ${S.g ? GRADES[S.g] : 'chưa chọn'})</button></div>`,
  setReady: pn => { pn.querySelector('#chg').onclick = () => askGrade(false); },
  onStart: () => gradeSub(),
  afterStart: () => { if (!S.g) askGrade(true); }
});
bootSaga();
window.__saga.askGrade = askGrade;
</script>
