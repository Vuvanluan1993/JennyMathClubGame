<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>Hành trình của Jenny – Học Toán cùng Jenny</title>
<link rel="icon" href="../../../assets/jenny-logo.png">
<link rel="stylesheet" href="../../../assets/fonts/fonts.css">
<link rel="stylesheet" href="../_saga/saga.css">
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <a href="../../../" title="Về trang chủ" style="display:contents"><img class="logo" src="../../../assets/jenny-logo.png" alt="Học Toán cùng Jenny"></a>
    <div class="ttl">Hành trình của Jenny<small>Lớp 6 · Toán MATHCOUNTS</small></div>
    <div class="spacer"></div>
    <div class="pill" id="pEn" title="Năng lượng: mỗi màn chơi tốn 1"><span data-i="bolt"></span><b id="vEn">0</b><small>/10</small></div>
    <div class="pill" id="pXu" title="Xu: dùng mua đồ cho vườn"><span data-i="coin"></span><b id="vXu">0</b></div>
    <div class="pill hide-s" id="pSt" title="Tổng số sao"><span data-i="star"></span><b id="vSt">0</b></div>
    <button class="ib" id="bSet" aria-label="Tiến độ và sao lưu" title="Tiến độ và sao lưu"><span data-i="gear"></span></button>
    <button class="ib hide-s" id="bSnd" aria-label="Bật/tắt âm thanh" title="Âm thanh"><span data-i="snd"></span></button>
    <a class="ib" href="../../../" aria-label="Về trang chủ" title="Về trang chủ"><span data-i="home"></span></a>
  </header>

  <main>
    <section class="view" id="vLock" aria-label="Nhập mã CLB">
      <div class="card lock">
        <span data-i="jenny"></span>
        <h2>Chào mừng em đến với Hành trình của Jenny!</h2>
        <p>Nhập <b>mã CLB</b> thầy cô đã cho để mở trò chơi. Em chỉ cần nhập một lần trên máy này.</p>
        <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="MÃ CLB" aria-label="Mã CLB">
        <div class="err" id="codeErr" role="alert"></div>
        <button class="btn y" id="codeGo" style="max-width:300px;width:100%">Mở trò chơi</button>
      </div>
    </section>

    <section class="view" id="vMap" aria-label="Bản đồ">
      <div class="isle-head">
        <button class="ib" id="isPrev" aria-label="Đảo trước"><span data-i="left"></span></button>
        <div class="nm" id="isName"></div>
        <button class="ib" id="isNext" aria-label="Đảo sau"><span data-i="right"></span></button>
      </div>
      <div class="mapbox" id="mapbox"></div>
    </section>

    <section class="view" id="vMath" aria-label="Trạm toán">
      <div class="card mcard">
        <div class="mhead">
          <div class="seg" id="seg" role="group" aria-label="Độ khó"></div>
          <div class="today" id="today"></div>
        </div>
        <div class="mtext" id="mtext"></div>
      </div>
      <div class="mpad">
        <div class="ans empty" id="ans" aria-live="polite">?</div>
        <div class="mrow"><button class="btn" id="bSkip"><span data-i="swap"></span>Đổi bài</button><button class="btn" id="bClr"><span data-i="back"></span>Xoá</button></div>
        <div class="keys" id="keys"></div>
        <div class="jrow"><div class="bubble" id="say"></div><span data-i="jenny"></span></div>
      </div>
    </section>

    <section class="view" id="vGarden" aria-label="Vườn của Jenny">
      <div class="gbox"><div class="scene" id="scene"></div></div>
      <div class="gbar">
        <button class="btn y" id="bShop"><span data-i="cart"></span>Cửa hàng</button>
        <div class="info" id="ginfo"></div>
      </div>
    </section>
  </main>

  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab" role="tab" data-v="map"><span data-i="map"></span>Bản đồ</button>
    <button class="tab" role="tab" data-v="math"><span data-i="calc"></span>Trạm toán</button>
    <button class="tab" role="tab" data-v="garden"><span data-i="sprout"></span>Vườn<span class="dot" id="gdot" hidden></span></button>
  </nav>
</div>
<div class="ov" id="ov" hidden><div class="panel" id="panel"></div></div>
<canvas id="fx"></canvas>

<script>
/* Cấu hình bản lớp 6 cho ../_saga/saga.js (khoá lưu cũ: jenny-saga-6) */
const SAGA = {
  key: 'jenny-saga-6', back: '../../hanh-trinh-jenny/lop-6/', colsTall: 3, query: '',
  islands: [
  { id: 'r', name: 'Đảo Robot', sub: 'Lập trình robot', color: '#BFE7C9', edge: '#7CC79A', url: '../../tu-duy-bebras/robot-tim-duong/', need: 0,
    lv: [[0, 0, 4], [0, 0, 31], [0, 0, 8], [0, 0, 56], [0, 0, 48], [1, 0, 40], [1, 0, 34], [1, 0, 7], [1, 0, 26], [1, 0, 47], [2, 0, 40], [2, 0, 4], [2, 0, 36], [2, 0, 60], [2, 0, 38]] },
  { id: 'x', name: 'Đảo Xoay Lật', sub: 'Xoay và lật hình', color: '#FFE3A8', edge: '#E8B85C', url: '../../tu-duy-bebras/xoay-lat-hinh/', need: 25,
    lv: [[0, 0, 1], [0, 1, 9], [0, 2, 16], [0, 3, 23], [0, 4, 30], [1, 0, 1], [1, 1, 9], [1, 2, 16], [1, 3, 23], [1, 4, 30], [2, 0, 2], [2, 1, 22], [2, 3, 11], [2, 2, 28], [2, 5, 26]] }
]
};
</script>
<script src="../_saga/khoi-phuc.js"></script>
<script src="../_saga/saga.js"></script>
<script>
'use strict';
/* ================= math station ================= */
let typed = '', tries = 0, answered = false;
function pick(d) {
  const pool = BANK.filter(p => p.d === d && !S.solved[p.i]);
  const list = pool.length ? pool : BANK.filter(p => p.d === d);
  const fresh2 = list.filter(p => !S.miss[p.i]);
  const from = fresh2.length > 6 ? fresh2 : list;
  return from[Math.floor(Math.random() * from.length)].i;
}
function current() { let p = S.cur && BANK.find(x => x.i === S.cur.id); if (!p || p.d !== S.diff) { S.cur = { id: pick(S.diff) }; save(); p = BANK.find(x => x.i === S.cur.id); } return p; }
function drawMath() {
  if (!BANK) return; rollDay();
  $('#seg').innerHTML = DIFF.map((n, d) => `<button aria-pressed="${S.diff === d}" data-d="${d}">${n} · ${XU[d]}${I.coin}</button>`).join('');
  $('#seg').querySelectorAll('button').forEach(b => b.onclick = () => { if (+b.dataset.d === S.diff) return; sfx.tap(); S.diff = +b.dataset.d; S.cur = null; resetAnswer(); save(); drawMath(); });
  $('#today').innerHTML = `Hôm nay ${S.dayXu}/${DAY_XU}${I.coin}`;
  const p = current(), left = BANK.filter(x => x.d === S.diff && !S.solved[x.i]).length;
  const solTxt = answered ? `<div class="sol${S.cur.ok ? '' : ' bad'}"><b class="h">${S.cur.ok ? 'Đúng rồi! Lời giải:' : 'Đáp số là ' + p.a + '. Cùng xem lời giải:'}</b>${esc(p.s.replace(/\n\s*\n/g, '\n'))}</div>` : '';
  $('#mtext').className = 'mtext' + (answered ? ' solved' : '');
  $('#vMath').classList.toggle('answered', answered);
  $('#mtext').innerHTML = `<div class="qn">BÀI ${DIFF[S.diff].toUpperCase()}${p.t ? ' · ' + esc(p.t).toUpperCase() : ''} · CÒN ${left} BÀI CHƯA GIẢI</div><div class="q">${esc(p.q)}</div>${answered ? '<button class="qbtn" id="qbtn">Xem lại đề</button>' : ''}${solTxt}`;
  const qb = $('#qbtn'); if (qb) qb.onclick = () => { const m = $('#mtext'), on = m.classList.toggle('showq'); qb.textContent = on ? 'Xem lời giải' : 'Xem lại đề'; fitText(true); };
  drawKeys(); drawAns(); fitText();
  if (!answered && !$('#say').innerHTML) say('Giải đúng để nhận <b>xu</b> và <b>năng lượng</b> nhé!');
}
function drawKeys() {
  const k = $('#keys');
  k.classList.toggle('done', answered);
  if (answered) { k.innerHTML = `<button class="key go next" id="kNext" style="grid-column:1/-1">Bài tiếp theo ${I.right}</button>`; k.querySelector('#kNext').onclick = nextProblem; return; }
  k.innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="key" data-k="${n}">${n}</button>`).join('')
    + `<button class="key" data-k="-">−</button><button class="key" data-k="0">0</button><button class="key go" data-k="ok" aria-label="Kiểm tra">${I.check}</button>`;
  k.querySelectorAll('.key').forEach(b => b.onclick = () => press(b.dataset.k));
}
function drawAns(cls) { const a = $('#ans'); a.textContent = typed || '?'; a.className = 'ans' + (typed ? '' : ' empty') + (cls ? ' ' + cls : ''); }
function resetAnswer() { typed = ''; tries = 0; answered = false; }
function press(k) {
  if (answered) return;
  if (k === 'ok') return check();
  if (k === 'del') typed = typed.slice(0, -1);
  else if (k === '-') typed = typed.startsWith('-') ? typed.slice(1) : '-' + typed;
  else if (typed.replace('-', '').length < 7) typed = (typed === '0' ? '' : typed) + k;
  sfx.tap(); drawAns();
}
function check() {
  if (!typed || typed === '-') { say('Em gõ đáp số trước rồi bấm ✓ nhé.'); return; }
  const p = current(), v = parseInt(typed, 10);
  rollDay();
  if (v === p.a) {
    answered = true; S.cur.ok = true;
    const first = !S.solved[p.i]; S.solved[p.i] = 1; delete S.miss[p.i]; S.right++; S.grow++;
    let gain = 0, en = 0;
    if (first) { gain = Math.min(XU[p.d], Math.max(0, DAY_XU - S.dayXu)); en = Math.min(EN[p.d], EN_MAX - S.en); }
    S.xu += gain; S.dayXu += gain; S.en += en; save();
    sfx.good(); burst($('#ans'));
    const parts2 = []; if (gain) parts2.push(`+${gain} xu`); if (en) parts2.push(`+${en} năng lượng`);
    say(first ? (parts2.length ? `Giỏi quá! Em được <b>${parts2.join(', ')}</b>.` : (S.dayXu >= DAY_XU ? 'Đúng rồi! Hôm nay em đã nhận đủ xu, năng lượng cũng đã đầy.' : 'Đúng rồi! Năng lượng đã đầy.')) + ' Cây và thú trong vườn lớn thêm một chút!' : 'Đúng rồi! (Bài này em đã giải trước đây nên không nhận thêm xu.)', 'happy');
    hud('#pXu,#pEn'); drawMath(); drawAns('ok');
    return;
  }
  tries++; S.wrong++;
  if (tries < 2) { sfx.bad(); save(); drawAns('no'); say('Chưa đúng. Em đọc lại đề và thử <b>thêm 1 lần</b> nhé!', 'oops'); typed = ''; setTimeout(() => drawAns(), 450); return; }
  answered = true; S.cur.ok = false; S.miss[p.i] = (S.miss[p.i] || 0) + 1; save();
  sfx.bad(); say('Không sao! Em đọc lời giải rồi làm bài khác nhé. Bài này sẽ quay lại sau.', 'oops');
  drawMath(); drawAns('no');
}
function nextProblem() { sfx.tap(); resetAnswer(); S.cur = { id: pick(S.diff) }; save(); say('Bài mới đây! Cố lên em.'); drawMath(); }
$('#bSkip').onclick = () => { if (!BANK) return; nextProblem(); };
$('#bClr').onclick = () => press('del');
addEventListener('keydown', e => {
  if (view !== 'math' || !$('#ov').hidden || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (/^[0-9]$/.test(e.key)) { press(e.key); e.preventDefault(); }
  else if (e.key === 'Backspace') { press('del'); e.preventDefault(); }
  else if (e.key === '-') { press('-'); e.preventDefault(); }
  else if (e.key === 'Enter') { answered ? nextProblem() : check(); e.preventDefault(); }
});
function fitText(keepFold) {
  const m = $('#mtext'); if (!m || view !== 'math') return;
  if (!keepFold) m.classList.remove('fold', 'showq'); m.classList.remove('scroll');
  const over = () => m.scrollHeight > m.clientHeight + 1;
  const shrink = min => { let fs = innerHeight < 520 ? 17 : 22; m.style.fontSize = fs + 'px'; while (over() && fs > min) { fs -= .5; m.style.fontSize = fs + 'px'; } };
  shrink(m.classList.contains('fold') ? 10 : 13);
  if (over() && answered && !m.classList.contains('fold')) { m.classList.add('fold'); shrink(10); }
  else if (over()) shrink(10);
  if (over()) m.classList.add('scroll');
}
bootSaga();
</script>
</body>
</html>
