<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Đường đi rẻ nhất</title>
<link rel="icon" href="../../../assets/jenny-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="../_kit/kit.css">
<style>
/* map: one SVG that fills the play area; drawn in real pixels so text keeps its size */
.ddmap{width:100cqw;height:100cqh;display:block;user-select:none;-webkit-user-select:none}
.ddmap text{font-family:var(--display);font-weight:800;pointer-events:none}
.ddmap .hit{fill:transparent;cursor:pointer}
.ddmap .place:hover .glow{fill-opacity:.75}
.ddmap .coin,.ddmap .lbl,.ddmap .deco,.ddmap #ddBus,.ddmap .bridge,.ddmap .river,.ddmap .road{pointer-events:none}
.ddmap .hintring{animation:ddpulse 1s ease-in-out infinite}
@keyframes ddpulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.25}}
.ddmap .place.bump{animation:shake .4s}
/* trip box */
.trip{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.wallet{display:flex;align-items:center;gap:7px;font-weight:900;font-size:16px;line-height:1.1}
.wallet svg{width:24px;height:24px;flex:none}
.wallet b{font-family:var(--display);font-size:24px;line-height:1}
.wallet .lab{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--ink-soft);margin-left:auto}
.chips{display:flex;gap:3px;flex-wrap:nowrap;overflow:hidden;align-items:center;min-height:24px}
.chip{flex:none;font-size:12.5px;font-weight:900;border:2px solid var(--ink);border-radius:999px;padding:1px 8px;background:var(--sel-soft);white-space:nowrap;line-height:1.35}
.chip.home{background:#FFE1DC}
.chip.goal{background:var(--mint-soft)}
.chip.more{background:#fff;border-style:dashed}
.chips i{flex:none;font-style:normal;font-weight:900;color:var(--ink-soft);font-size:12px}
@media (max-height:520px) and (min-aspect-ratio:1/1){.trip{padding:5px 10px;gap:4px}.wallet b{font-size:20px}}
@media (max-aspect-ratio:1/1){.trip{flex-direction:row;align-items:center;gap:8px;padding:6px 10px;border-radius:14px;box-shadow:0 4px 0 var(--ink)}
  .wallet{flex:none;font-size:14px}.wallet b{font-size:20px}.wallet .lab{display:none}.chips{flex:1 1 auto;min-width:0}}
</style>
</head>

      + (req ? `<text x="${l.cx.toFixed(1)}" y="${(y1 + fs * .5 + lh2 / 2 + 1).toFixed(1)}" font-size="${(fs * .78).toFixed(1)}" text-anchor="middle" dominant-baseline="central" fill="${vis.has(i) ? '#138A63' : '#E2412C'}" stroke="#fff" stroke-width="${(fs * .28).toFixed(1)}" stroke-linejoin="round" paint-order="stroke">${vis.has(i) ? '✓ đã ghé' : '★ phải ghé'}</text>` : '') + '</g>');
  });
  out.push(`<g id="ddBus"><g id="ddBusIn" stroke="${INK}" stroke-width="2" stroke-linejoin="round">${BUS}</g></g>`);
  out.push(`</g><rect x="1.5" y="1.5" width="${W - 3}" height="${H - 3}" rx="14" fill="none" stroke="${INK}" stroke-width="3"/>`);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = out.join('');
  svg.querySelectorAll('.place').forEach(el => el.addEventListener('click', () => go(+el.dataset.id)));
  G.anim++; placeBus(pos[here]);
}
function busXY(p) { return [p[0] + G.s * .18, p[1] + G.s * .36]; }
function placeBus(p, face) {
  const bus = document.getElementById('ddBus'); if (!bus) return;
  if (face) G.face = face;
  const [x, y] = busXY(p), k = G.s * .66 / 40;
  bus.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${(k * G.face).toFixed(3)},${k.toFixed(3)})`);
}
function driveBus(from, to, done) {
  const a = G.pos[from], b = G.pos[to], tok = ++G.anim, t0 = performance.now(), dur = 520;
  const face = b[0] < a[0] - 1 ? -1 : b[0] > a[0] + 1 ? 1 : G.face;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const step = now => {
    if (tok !== G.anim) return;
    let t = reduce ? 1 : Math.min(1, (now - t0) / dur); const e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    placeBus([a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e - Math.sin(Math.PI * t) * 3], face);
    if (t < 1) requestAnimationFrame(step); else if (done) done();
  };
  requestAnimationFrame(step);
}
function bump(i) { const el = G.svg.querySelector(`.place[data-id="${i}"]`); if (!el) return; el.classList.remove('bump'); void el.getBBox(); el.classList.add('bump'); }

function go(id) {
  if (G.won) return;
  const P = G.P, from = cur(), nm = i => PLACES[P.names[i]].name;
  if (id === from) { G.ctx.say(`Xe buýt đang ở ${nm(id)} rồi. Chạm vào điểm bên cạnh nhé.`); return; }
  const e = edgeFor(P, from, id);
  if (!e) {
    G.ctx.sfx.bad(); bump(id);
    if (P.edges.some(x => x.one && x.a === id && x.b === from)) G.ctx.say(`Đường này chỉ đi 1 chiều, từ ${nm(id)} sang ${nm(from)} thôi!`, 'oops');
    else G.ctx.say(`Không có đường nối thẳng từ ${nm(from)} tới ${nm(id)}.`, 'oops');
    return;
  }
  G.route.push(id); G.hintId = -1; G.ctx.sfx.move(G.route.length);
  G.ctx.save({ route: G.route });
  const need = P.req.filter(r => !G.route.includes(r));
  const win = id === P.goal && !need.length;
  if (win) G.won = true;
  render(true); placeBus(G.pos[from]); driveBus(from, id);
  updateTrip();
  if (win) {
    const c = spent(), b = P.best, stars = c <= b ? 3 : c <= b + 2 ? 2 : 1;
    setTimeout(() => G.ctx.win(stars, stars === 3 ? `Hết ${c} xu – đúng là đường rẻ nhất!` : `Em tiêu ${c} xu. Đường rẻ nhất chỉ tốn ${b} xu.`), 560);
  } else if (id === P.goal) G.ctx.say(`Tới Trường rồi, nhưng còn phải ghé ${need.map(nm).join(' và ')}!`, 'oops');
  else if (P.req.includes(id) && G.route.indexOf(id) === G.route.length - 1) { G.ctx.sfx.good(); G.ctx.say(`Đã ghé ${nm(id)}! Đã tiêu ${spent()} xu.`, 'happy'); }
  else G.ctx.say(`Tới ${nm(id)}: thêm ${e.c} xu. Đã tiêu ${spent()} xu.`);
}
function undo() {
  if (G.won) return;
  if (G.route.length <= 1) { G.ctx.say('Xe buýt đang ở Nhà, chưa đi đâu cả.'); return; }
  const from = G.route.pop(), to = cur(); G.hintId = -1; G.ctx.sfx.tap();
  G.ctx.save({ route: G.route }); render(true); placeBus(G.pos[from]); driveBus(from, to); updateTrip();
  G.ctx.say(`Lùi về ${PLACES[G.P.names[to]].name}. Đã tiêu ${spent()} xu.`);
}
function restart() {
  if (G.won) return;
  G.route = [G.P.start]; G.hintId = -1; G.face = 1; G.ctx.sfx.tap();
  G.ctx.save({ route: G.route }); render(true); updateTrip();
  G.ctx.say('Xe buýt về lại Nhà. Đi lại từ đầu nhé!');
}
function hint(ctx) {
  if (G.won) return false;
  const P = G.P, need = P.req.filter(r => !G.route.includes(r));
  const sol = solve(P, cur(), need); if (!sol || sol.path.length < 2) return false;
  G.hintId = sol.path[1]; render(true);
  ctx.say(`Jenny gợi ý: đi tới ${PLACES[P.names[G.hintId]].name} (điểm sáng vàng) nhé!`, 'happy');
  return true;
}
function layout() { if (!G) return; render(false); updateTrip(); }
function onKey(e) { if (e.key === 'Backspace' || e.key === 'Delete') { undo(); e.preventDefault(); } }

window.__dd = { make, solve, dijkstra, pathTo, reachAll, costOf, edgeFor, LEVELS };
Kit.run({
  key: 'bb-duongdi',
  title: 'Đường đi rẻ nhất',
  intro: 'Lái xe buýt qua làng, từ Nhà tới Trường, mà tốn ít xu nhất.',
  rules: [
    'Chạm vào <b>điểm bên cạnh</b> (có đường nối) để lái xe buýt tới đó.',
    'Mỗi con đường có <b>giá vé</b> ghi trên đồng xu. Cộng lại cho thật ít!',
    'Điểm có vòng đỏ <b>★ phải ghé</b> thì nhất định phải đi qua.',
    'Đường có <b>mũi tên</b> chỉ đi 1 chiều. Bấm <b>Lùi 1 điểm</b> nếu đi nhầm.'
  ],
  levels: LEVELS.map(l => ({ name: l.name, desc: l.desc })),
  rounds: 8,
  hello: 'Chào em! Lái xe buýt tới Trường thật rẻ nhé.',
  make: lv => make(lv),
  mount, hint, onKey, layout
});
})();
