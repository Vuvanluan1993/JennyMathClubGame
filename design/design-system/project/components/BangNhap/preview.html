<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>BangNhap — Jenny</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Be+Vietnam+Pro:wght@400;600;700;800&family=Lexend:wght@400;500;600&display=swap">
<style>html,body{margin:0}body{font-family:var(--font-body)}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch}.col{display:grid;gap:12px;align-content:start}.lbl{font:12px/1.3 var(--font-lms);color:var(--app-muted);margin:0 0 6px}.pane{padding:16px;min-width:0;flex:1 1 300px}.hr{display:flex;flex-wrap:wrap;gap:10px;align-items:center}</style></head><body>
<div class="row">
<div class="jc jc-lms pane" style="display:grid;place-items:start center;background:#E8EAED"><p class="lbl" style="justify-self:start">Classroom — tiêu đề dính trên, nút dính đáy, thân cuộn</p>
 <form class="jc-modal" style="max-height:420px" onsubmit="return false"><div class="hd"><b>Thêm học sinh</b><button type="button" class="x">Đóng ✕</button></div>
 <div class="bd"><label for="a1">Họ</label><input id="a1" value="Lê"><label for="a2">Tên</label><input id="a2" value="Bảo Na"><label for="a3">Giới tính</label><select id="a3"><option>Nữ</option><option>Nam</option></select>
 <label for="a4">Ngày sinh</label><input id="a4" placeholder="dd/mm/yyyy"><label for="a5">Điện thoại phụ huynh</label><input id="a5" placeholder="09…"><label for="a6">Gmail phụ huynh</label><input id="a6" placeholder="…@gmail.com"><label for="a7">Lớp</label><select id="a7"><option>Chưa xếp lớp</option><option>1A</option></select></div>
 <div class="ft"><button type="button" class="jc-btn">Huỷ</button><button type="submit" class="jc-btn pri">Lưu</button></div></form></div>
<div class="jc jc-pixel pane" style="display:grid;place-items:start center"><p class="lbl" style="justify-self:start">Pixel — đầu navy chữ VT323, ô nhập khuyết góc cao 48</p>
 <form class="jc-modal" style="max-height:420px" onsubmit="return false"><div class="hd">Đổi mật khẩu<button type="button" class="x">✕</button></div>
 <div class="bd"><label for="b1">Mật khẩu mới</label><input id="b1" type="password" value="12345678"><label for="b2">Nhập lại</label><input id="b2" type="password"><p class="muted">8 kí tự trở lên, có chữ và số.</p></div>
 <div class="ft"><button type="button" class="jc-btn">Để sau</button><button type="submit" class="jc-btn pri">Đổi</button></div></form></div></div>
</body></html>
