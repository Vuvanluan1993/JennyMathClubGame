<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>PhongHoc — Jenny</title>

<style>html,body{margin:0}body{font-family:var(--font-body)}.phone{width:375px;min-height:812px;margin:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
.phone>main{flex:1;overflow:auto}.sea{background:var(--px-water) linear-gradient(90deg,var(--px-water-dot) 0 12px,transparent 12px) 20px 18px/96px 64px repeat;border:3px solid var(--px-frame);position:relative;height:300px;image-rendering:pixelated}
.isl{position:absolute;display:grid;gap:4px;justify-items:center}.isl .lbl2{background:var(--white);border:2px solid var(--px-frame);font-family:var(--font-pixel);font-size:18px;line-height:1;padding:4px 8px 2px;color:var(--app-ink)}
.isl .land{width:64px;height:40px;background:var(--sand);box-shadow:0 0 0 3px var(--px-frame);display:grid;place-items:center;font-size:9px;color:var(--brown-deep)}
.flag{position:absolute;background:var(--px-sun);border:2px solid var(--px-frame);font-family:var(--font-pixel);font-size:17px;line-height:1;padding:2px 6px 0;color:var(--app-ink)}
.topics{display:flex;gap:8px;overflow:hidden}.topics .no{flex:none;width:58px;height:58px;display:grid;place-items:center;background:var(--white);border:2px solid var(--px-frame);font-family:var(--font-pixel);font-size:24px;color:var(--app-ink);box-shadow:0 4px 0 var(--px-frame)}
.topics .no.on{background:var(--px-sun)}.topics .no.lock{color:var(--app-muted)}
.bar{display:flex;gap:4px}.bar i{width:22px;height:14px;background:var(--mist);box-shadow:var(--frame-2)}.bar i.done{background:var(--sand-deep)}.hearts{font-size:22px;color:var(--px-coral);letter-spacing:-2px}
.pic{display:flex;gap:10px;justify-content:center;padding:10px;background:var(--white);box-shadow:var(--frame-2)}.pic span{width:56px;height:34px;background:var(--coral);box-shadow:var(--frame-2);display:grid;place-items:center;font-size:9px;color:var(--white)}
.login{min-height:812px;display:grid;place-items:center;padding:16px;background:var(--sky) radial-gradient(var(--px-water) 2px,transparent 3px) 0 0/46px 34px}
.lgcard{width:100%;max-width:400px;background:var(--white);color:var(--app-ink);padding:22px;display:grid;gap:8px;box-shadow:var(--frame-3),0 8px 0 0 var(--px-frame)}
.lghead{display:flex;gap:12px;align-items:center;margin-bottom:6px}.lgcard label{font-weight:700;font-size:14px}.lgrem{display:flex;gap:8px;align-items:center;font-weight:400!important}
.lgnote{color:var(--app-muted);font-size:12.5px}.ver{font-size:11px;color:var(--app-muted);text-align:right}
</style></head><body>
