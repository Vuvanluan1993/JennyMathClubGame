<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>HopThoai — Jenny</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Be+Vietnam+Pro:wght@400;600;700;800&family=Lexend:wght@400;500;600&display=swap">
<style>html,body{margin:0}body{font-family:var(--font-body)}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch}.col{display:grid;gap:12px;align-content:start}.lbl{font:12px/1.3 var(--font-lms);color:var(--app-muted);margin:0 0 6px}.pane{padding:16px;min-width:0;flex:1 1 300px}.hr{display:flex;flex-wrap:wrap;gap:10px;align-items:center}</style></head><body>
<div class="row">
<div class="jc jc-pixel pane" style="display:grid;place-items:center;min-height:300px"><div class="jc-modal" style="width:min(380px,100%)"><div class="hd">Bỏ khỏi lớp?<button type="button" class="x">✕</button></div>
 <div class="bd"><p>Em <b>Lê Bảo Na</b> sẽ ra khỏi lớp 1A và chưa đăng nhập được cho tới khi xếp lớp mới.</p></div>
 <div class="ft"><button class="jc-btn">Giữ lại</button><button class="jc-btn danger">Bỏ khỏi lớp</button></div></div></div>
<div class="jc jc-lms pane" style="display:grid;place-items:center;min-height:300px;background:#E8EAED"><div class="jc-modal" style="width:min(380px,100%)"><div class="hd"><b>Đặt lại mật khẩu</b><button type="button" class="x">Đóng ✕</button></div>
 <div class="bd"><p>Mật khẩu mới của <b>Lê Bảo Na</b> là <b>bana4821</b>. Em sẽ phải đổi khi đăng nhập lần đầu.</p></div>
 <div class="ft"><button class="jc-btn pri">Đã ghi lại</button></div></div></div></div>
</body></html>
